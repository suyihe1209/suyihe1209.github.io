<meta property="og:description" content="15 首日语歌词的逐句精讲合集：影色舞、ノウナイディスコ、ノーポイッ！、気になるあの娘、フラッシュバッカー、ウミユリ海底譚、緋色の空、あいつら全員同窓会、上海an、アルクアラウンド、ミュージック、転がる岩、君に朝が降る、脳漿炸裂ガール、＊ハロー、プラネット。、ベノム。共 686 句 / 2309 词条 / 1170 语法点。">

<style>
/* ==== assets/base.css 内联 ==== */
/* ===== base.css —— 单曲与合集共用的样式（构建时内联进 <style>） ===== */

/* ---------- 设计令牌 ---------- */
:root{
  --bg:#08070d;
  --bg2:#0c0a14;
  --panel:#131020;
  --panel2:#1a1529;
  --line:#282040;
  --line2:#3a2e5c;
  --text:#ece9f7;
  --muted:#a09ab6;
  --muted2:#8b84a6;
  --cyan:#5fe3f5;
  --pink:#ff6fb5;
  --violet:#b78cff;
  --amber:#ffc266;
  --green:#7ff0a8;
  --red:#ff8080;
  --nav-h:64px;
  --r-md:14px;
  --r-sm:11px;
  --fs-body:15px;
  --fs-sm:14px;
  --fs-xs:13px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 14px);}
body{
  margin:0; background:
    radial-gradient(1100px 560px at 12% -8%, #2a1040 0%, transparent 58%),
    radial-gradient(900px 520px at 92% 2%, #0d2a38 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:"Source Han Serif CN","Noto Serif SC","Songti SC","SimSun","STSong",serif;
  font-size:var(--fs-body);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 120px;}

/* ---------- 页头 ---------- */
.kicker{font-size:12px;letter-spacing:.28em;color:var(--pink);text-transform:uppercase;font-weight:700;}
h1{font-size:clamp(28px,5vw,44px);margin:12px 0 6px;letter-spacing:.02em;line-height:1.2;}
h1 .sub{display:block;font-size:.40em;color:var(--muted);font-weight:400;letter-spacing:.16em;margin-top:10px;}
.byline{color:var(--muted);font-size:14.5px;margin-top:14px;}
.byline code{background:var(--panel2);padding:2px 7px;border-radius:5px;color:var(--cyan);font-size:13px;}

/* ---------- 卡片区 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;margin:16px 0;}
.card h2{font-size:17.5px;margin:0 0 12px;color:var(--pink);letter-spacing:.04em;display:flex;align-items:center;gap:9px;}
.card h2::before{content:"";width:4px;height:16px;background:var(--pink);border-radius:2px;}
.card.cy h2{color:var(--cyan);} .card.cy h2::before{background:var(--cyan);}
.card.ok{border-color:#1e4a30;background:linear-gradient(180deg,#0b1c13,#0e0d18);}
.card.ok h2{color:var(--green);} .card.ok h2::before{background:var(--green);}
.card.ok p{margin:8px 0;font-size:var(--fs-body);}
.card.ok b{color:var(--green);}
.card.hot{border-color:#4a2a3d;}
.card.hot h2{color:var(--pink);}

/* ---------- 工具栏（单曲 .bar / 合集 .nav 共用控件） ---------- */
.tg{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);
    font-size:13.5px;padding:6px 13px;border-radius:20px;cursor:pointer;transition:.16s;
    user-select:none;font-family:inherit;line-height:1.5;display:inline-flex;align-items:center;gap:6px;}
.tg:hover{color:var(--text);border-color:var(--pink);}
.tg.on{background:rgba(255,111,181,.15);border-color:var(--pink);color:var(--pink);font-weight:600;}
.tg.icon{padding:6px 10px;font-size:14px;}
.sp{flex:1;}
.count{font-size:var(--fs-xs);color:var(--muted2);white-space:nowrap;font-variant-numeric:tabular-nums;}

.search{position:relative;display:flex;align-items:center;flex:none;}
.search input{
  width:210px;max-width:42vw;background:var(--panel2);border:1px solid var(--line2);
  border-radius:20px;color:var(--text);font-family:inherit;font-size:13.5px;
  padding:6px 30px 6px 32px;transition:.16s;
}
.search input::placeholder{color:var(--muted2);}
.search input:focus{border-color:var(--cyan);background:var(--panel);}
.search::before{
  content:"";position:absolute;left:12px;width:12px;height:12px;pointer-events:none;
  border:2px solid var(--muted2);border-radius:50%;
}
.search::after{
  content:"";position:absolute;left:21px;top:20px;width:5px;height:2px;pointer-events:none;
  background:var(--muted2);transform:rotate(45deg);
}
.search input:focus ~ .search::before{border-color:var(--cyan);}

/* ---------- 段落 ---------- */
.sec{margin-top:34px;}
.sec-h{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
       padding-bottom:9px;margin-bottom:4px;flex-wrap:wrap;}
.sec-h .n{font-size:12.5px;font-weight:800;letter-spacing:.2em;color:var(--cyan);}
.sec-h h3{margin:0;font-size:20px;}
.sec-h .jp{color:var(--muted);font-size:14px;}
.sec-h .sp{flex:1;min-width:0;}
.sec-tg{border:1px solid transparent;background:transparent;color:var(--muted2);
        font-family:inherit;font-size:12.5px;padding:4px 10px;border-radius:14px;
        cursor:pointer;transition:.16s;white-space:nowrap;}
.sec-tg:hover{color:var(--pink);border-color:var(--line2);background:var(--panel2);}
.sec-cnt{font-size:12px;color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap;}
/* 搜索时整段无命中的降级显示（不留空白壳） */
.sec.nomatch{opacity:.42;}
.sec.nomatch .sec-h::after{content:"（无匹配）";font-size:12px;color:var(--muted2);}

/* ---------- 句子（阅读优先：连续流，无卡片边框） ---------- */
.line{position:relative;padding:13px 0 13px;margin:0;border-bottom:1px solid rgba(40,32,64,.55);
      transition:background .16s;}
.line:hover{background:rgba(255,255,255,.022);}
.line.hide{display:none;}
.line.open{background:rgba(255,255,255,.045);padding-left:16px;}
.line.open::before{content:"";position:absolute;left:2px;top:12px;bottom:12px;width:3px;
                   background:var(--pink);border-radius:3px;}

.head{cursor:pointer;position:relative;padding-right:26px;border-radius:8px;}
.head:hover .chev{opacity:.55;color:var(--pink);}
.head:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}
.orig{font-size:21px;letter-spacing:.03em;line-height:1.55;
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-weight:600;}
.rd{font-size:14px;color:var(--cyan);margin-top:4px;letter-spacing:.02em;display:none;}
.ro{font-size:13px;color:var(--muted2);margin-top:3px;font-style:italic;display:none;}
.tr{font-size:var(--fs-body);color:#c9c3dc;margin-top:9px;padding-left:12px;
    border-left:2px solid var(--line2);display:none;}
.foot{display:flex;align-items:center;gap:9px;margin-top:10px;min-height:20px;}
.lv{font-size:11px;font-weight:800;padding:2.5px 9px;border-radius:20px;letter-spacing:.05em;white-space:nowrap;}
.lv.n5{background:rgba(127,240,168,.15);color:var(--green);border:1px solid rgba(127,240,168,.35);}
.lv.n4{background:rgba(95,227,245,.14);color:var(--cyan);border:1px solid rgba(95,227,245,.34);}
.lv.n3{background:rgba(255,194,102,.14);color:var(--amber);border:1px solid rgba(255,194,102,.34);}
.lv.n2{background:rgba(255,128,128,.13);color:var(--red);border:1px solid rgba(255,128,128,.32);}
.lv.rep{background:rgba(183,140,255,.14);color:var(--violet);border:1px solid rgba(183,140,255,.34);}
.chev{position:absolute;right:2px;top:3px;font-size:12px;color:var(--muted2);
      opacity:.28;transition:.18s;pointer-events:none;}
.line.open .chev{opacity:1;color:var(--pink);transform:rotate(180deg);}

.detail{display:none;padding:14px 0 4px;}
.line.open .detail{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.detail h4{font-size:12.5px;letter-spacing:.16em;color:var(--violet);margin:16px 0 8px;font-weight:700;}
.detail h4:first-child{margin-top:4px;}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
th{text-align:left;color:var(--muted2);font-weight:600;font-size:12px;letter-spacing:.1em;
   padding:6px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:rgba(255,111,181,.05);}
td.w{font-weight:700;color:var(--text);white-space:nowrap;
     font-family:"Yu Gothic","Noto Sans JP",sans-serif;font-size:16px;}
td.rd2{color:var(--cyan);font-size:13.5px;white-space:nowrap;}
td.pos{color:var(--pink);font-size:12.5px;white-space:nowrap;}
td.mn{color:#c9c3dc;}
td.nt{color:var(--muted);font-size:13px;}

.sx{width:100%;border-collapse:collapse;font-size:var(--fs-sm);margin-top:8px;}
.sx th{font-size:12px;letter-spacing:.1em;padding:8px 10px;border-bottom:1px solid var(--line2);color:var(--muted2);}
.sx td{padding:9px 10px;border-bottom:1px solid var(--line);}
.sx td.a{color:var(--pink);font-weight:700;font-family:"Yu Gothic",sans-serif;font-size:15px;}
.sx td.b{color:var(--cyan);font-family:"Yu Gothic",sans-serif;}
.sx td.c{color:#c9c3dc;}
.sx tr:hover td{background:rgba(95,227,245,.05);}
/* 卡片里的表：窄屏横向滚动 */
.card .sx{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* ---------- 语法 / 大白话 / 提示 ---------- */
.g{margin:8px 0;padding:11px 14px;background:var(--panel2);border-radius:9px;
   border-left:3px solid var(--violet);font-size:14.5px;}
.g b{color:var(--violet);}
.plain{margin-top:12px;padding:11px 14px;border-radius:9px;font-size:14.5px;
       background:rgba(127,240,168,.07);border-left:3px solid var(--green);color:#cdeada;}
.plain b{color:var(--green);}
.tip{margin-top:10px;padding:11px 14px;border-radius:9px;font-size:14.5px;
     background:rgba(255,194,102,.07);border-left:3px solid var(--amber);color:#eadfc7;}
.tip b{color:var(--amber);}

/* ---------- 小卡网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:6px;}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;}
.mini .t{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:6px;}
.mini .d{font-size:13.5px;color:var(--muted);}
.mini .d em{color:var(--text);font-style:normal;background:rgba(95,227,245,.1);padding:1px 5px;border-radius:4px;
            font-family:"Yu Gothic",sans-serif;}
.mini .ex{font-size:13.5px;margin-top:7px;color:#c9c3dc;padding-top:7px;border-top:1px solid var(--line);}
.mini .ex span{color:var(--pink);}

footer{text-align:center;color:var(--muted2);font-size:13px;margin-top:52px;
       padding-top:22px;border-top:1px solid var(--line);}

/* ---------- 空结果提示 ---------- */
.empty{display:none;padding:26px 0;text-align:center;color:var(--muted2);font-size:14px;}
.empty.on{display:block;}

/* ---------- 可访问性 ---------- */
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;}
.skip{position:absolute;left:-9999px;top:0;background:var(--panel2);color:var(--text);
      padding:10px 16px;border-radius:0 0 10px 0;z-index:200;}
.skip:focus{left:0;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation:none!important;transition:none!important;}
}

/* ---------- 浅色主题（共用部分） ---------- */
html.light{
  --bg:#f5efe6; --bg2:#efe6d8; --panel:#ffffff; --panel2:#f7f1e8;
  --line:#efe6d8; --line2:#e0d3bf;
  --text:#1c1730; --muted:#585170; --muted2:#6b6484;
  /* 浅底上必须换一套更深的强调色：原来的青/粉在白色上只有 1.7–2.5:1 */
  --cyan:#0b7a8d; --pink:#c2185b; --violet:#6b3fb8;
  --amber:#8a5a00; --green:#0f7a46; --red:#b3261e;
}
html.light body{background:
  radial-gradient(1100px 560px at 12% -8%, #efe7fb 0%, transparent 58%),
  radial-gradient(900px 520px at 92% 2%, #e6f4fa 0%, transparent 55%),
  var(--bg);}
html.light .line{border-bottom-color:var(--line);}
html.light .line:hover{background:rgba(40,32,64,.028);}
html.light .line.open{background:rgba(40,32,64,.05);}
html.light .card.ok{border-color:#b9e2c8;background:linear-gradient(180deg,#f2fbf5,#ffffff);}
html.light .card.hot{border-color:#e8c2d4;}
html.light .tr,html.light td.mn,html.light .sx td.c,html.light .mini .ex{color:#4d4763;}
html.light .plain{color:#1c6e40;background:rgba(23,138,76,.09);}
html.light .tip{color:#7a5b14;background:rgba(191,138,26,.1);}
html.light .g{background:#f7f4ff;}
html.light .tg{background:#fff;}
html.light .search input{background:#fff;}
html.light footer{border-top-color:var(--line);}

/* ---------- 移动端 ---------- */
@media (max-width:700px){
  :root{--fs-body:15px;}
  .wrap{padding:0 14px 90px;}
  .orig{font-size:18.5px;}
  .card{padding:16px 15px;border-radius:12px;}
  .count{font-size:12.5px;}
  .search input{width:150px;padding:6px 26px 6px 30px;font-size:13px;}
  .sec{margin-top:28px;}
  .sec-h h3{font-size:18px;}

  /* 歌词里的逐词表：改成「一行一词」的块，避免 5 列在窄屏被裁 */
  .line .sx{display:block;width:100%;margin-top:6px;}
  .line .sx thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  .line .sx tbody,.line .sx tr,.line .sx td{display:block;width:auto;}
  .line .sx tr{padding:9px 0 10px;border-bottom:1px solid var(--line);}
  .line .sx tr:hover td{background:transparent;}
  .line .sx td{border:0;padding:0;white-space:normal;}
  .line .sx td.w{font-size:16.5px;font-weight:700;margin-bottom:2px;}
  .line .sx td.rd2{font-size:13.5px;}
  .line .sx td.pos{font-size:12px;margin:3px 0 1px;}
  .line .sx td.mn{font-size:14px;}
  .line .sx td.nt{font-size:13px;color:var(--muted2);margin-top:4px;}
  /* 用 data-h 给移动端补上列名标签（只留给释义/备注，词头三行靠字号和颜色区分） */
  .line .sx td[data-h]::before{content:attr(data-h);color:var(--muted2);font-size:10.5px;
    letter-spacing:.12em;margin-right:7px;}
  .line .sx td.w[data-h]::before,.line .sx td.rd2[data-h]::before,
  .line .sx td.pos[data-h]::before{display:none;}
  .line .sx td.mn[data-h]{font-size:14.5px;}
  .line .sx td.nt[data-h]::before{display:none;}
  .line .sx td.nt[data-h]{padding-left:11px;border-left:2px solid var(--line2);}
  .line{padding:12px 0;}
  .line.open{padding-left:13px;}
  .line.open::before{left:1px;width:3px;}
  .detail h4{font-size:12px;}
}

/* ---------- 打印 ---------- */
@media print{
  html,body{background:#fff!important;color:#111!important;}
  .nav,.bar,.search,.chev,.sec-tg,.theme,.modeSwitch,.skip{display:none!important;}
  .wrap{max-width:none;padding:0;}
  .card,.line,.mini,.g,.plain,.tip{background:#fff!important;border-color:#bbb!important;
    break-inside:avoid;box-shadow:none!important;}
  .orig,.tr,td,.sx td{color:#111!important;}
  .rd{color:#0a6b7a!important;}
  .lv{border-color:#999!important;}
  .line{page-break-inside:avoid;}
  a[href]::after{content:"";}
}


/* ===== 合集专用：多曲导航 / 曲目面板 / 深读层 / 浅色覆盖 ===== */
.nav{position:sticky;top:0;z-index:70;background:rgba(8,7,13,.94);
     backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
.nav .row{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;align-items:center;
          gap:10px;flex-wrap:wrap;}
.nav .row.songs{padding-top:10px;padding-bottom:8px;flex-wrap:nowrap;gap:12px;}
.nav .brand{font-size:11.5px;letter-spacing:.24em;color:var(--pink);font-weight:800;
            white-space:nowrap;flex:none;}

/* 曲目条：横向滚动 + 右端渐隐，第 9 首以后也不会把导航撑高 */
.chipcell{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;}
.chips{display:flex;gap:7px;min-width:0;overflow-x:auto;overflow-y:hidden;
       scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;
       mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%);
       -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%);
       padding:2px 16px 3px 2px;}
.chips.is-drag{cursor:grabbing;scroll-behavior:auto;}
/* 可拖的横向滚动条：常显，太细了点不到 */
.chips::-webkit-scrollbar{height:0;}
/* 自绘的曲目拖动条：比原生滚动条更粗、可抓，只在溢出时出现 */
.chipbar{position:relative;height:8px;border-radius:8px;margin:0 14px 0 2px;
         background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);
         cursor:pointer;touch-action:none;}
.chipbar.off{visibility:hidden;}
.chipbar .thumb{position:absolute;top:0;left:0;height:100%;min-width:36px;border-radius:8px;
                background:linear-gradient(180deg,#5d4a92,#463768);
                box-shadow:0 1px 2px rgba(0,0,0,.35);transition:background .15s,box-shadow .15s;}
.chipbar:hover .thumb{background:linear-gradient(180deg,#8a72c8,#6a55a4);}
.chipbar .thumb:active{background:linear-gradient(180deg,#ff8fc4,#d94f92);}
html.light .chipbar{background:rgba(40,32,64,.08);}
html.light .chipbar .thumb{background:linear-gradient(180deg,#a99ad6,#8f7fc4);}
html.light .chipbar:hover .thumb{background:linear-gradient(180deg,#8a7ab8,#6f5fa8);}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);
      background:var(--panel2);color:var(--muted);font-family:inherit;font-size:13px;
      padding:5px 12px 5px 8px;border-radius:20px;cursor:pointer;transition:.16s;white-space:nowrap;flex:none;}
.chip:hover{color:var(--text);border-color:var(--pink);transform:translateY(-1px);}
.chip .no{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--muted2);
           border:1px solid var(--line2);border-radius:20px;padding:1px 6px;}
.chip em{font-style:normal;font-size:11.5px;color:var(--muted2);}
.chip.on{background:rgba(255,111,181,.14);border-color:var(--pink);color:var(--pink);font-weight:600;}
.chip.on .no{color:var(--pink);border-color:rgba(255,111,181,.45);}
.chip.on em{color:rgba(255,111,181,.75);}
.nav .count{flex:none;}

.nav .row.tools{padding-bottom:10px;gap:8px;}
/* 桌面：抽屉容器「透明」，按钮直接参与工具条布局 */
.toolbox{display:contents;}
#toolsBtn{display:none;}

.song{display:none;}
.song.on{display:block;}
.song header{padding:40px 0 22px;position:relative;overflow:hidden;}
header .ball{position:absolute;right:-14px;top:-6px;height:110%;opacity:.55;pointer-events:none;}
.gfoot-wrap{padding-bottom:70px;}
.gfoot{opacity:.78;}
.gfoot br{line-height:2.1;}

/* 深读版视图 */
.deepview{display:none;}
.song.deepmode .lightview{display:none;}
.song.deepmode .deepview{display:block;}
.modeSwitch{display:flex;gap:3px;align-items:center;border:1px solid var(--line2);
  background:rgba(183,140,255,.06);border-radius:22px;padding:3px;flex:none;}
.modeSwitch[hidden]{display:none;}
.modeSwitch .tg{border:none;background:transparent;padding:4px 12px;font-size:12.5px;border-radius:18px;}
.modeSwitch .tg:hover{background:rgba(255,255,255,.05);}
.modeSwitch .tg.on{background:rgba(183,140,255,.2);color:#d9c6ff;font-weight:700;}
.modeSwitch .tg.on[data-m="deep"]{background:rgba(255,111,181,.22);color:var(--pink);}

.deepview .toc{padding:2px 0 13px;margin:4px 0 0;border-bottom:1px solid var(--line);}
.deepview .toc .in{display:flex;flex-wrap:wrap;gap:5px 3px;align-items:center;}
.deepview .toc a{color:var(--muted);text-decoration:none;font-size:12.5px;padding:5px 10px;
  border-radius:16px;border:1px solid transparent;transition:.15s;white-space:nowrap;}
.deepview .toc a:hover{color:var(--pink);border-color:var(--line2);background:var(--panel2);}
.deepview .toc .num{color:var(--muted2);font-size:10.5px;margin-right:4px;font-weight:700;}

.deepview .jp{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;}
.deepview td.jp{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:14.5px;color:var(--text);line-height:1.65;}
.deepview td.k{color:var(--muted2);font-size:12.5px;white-space:nowrap;}
.deepview mark{background:rgba(255,111,181,.2);color:#ffd3e8;padding:0 4px;border-radius:4px;font-weight:600;}
.deepview mark.b{background:rgba(95,227,245,.18);color:#c8f6ff;}
.deepview .df td:first-child{color:var(--muted2);font-size:12.5px;white-space:nowrap;width:34px;}
.deepview .card p{margin:9px 0;font-size:15px;color:#cfc9e2;}
.deepview .card p b{color:var(--text);}
.deepview .card p em{color:var(--cyan);font-style:normal;}
.deepview .card.vi h2{color:var(--violet);}
.deepview .card.vi h2::before{background:var(--violet);}

.deepview .tldr{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0 4px;}
.deepview .tldr .it{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:13px 15px;}
.deepview .tldr .it .k{font-size:11px;letter-spacing:.16em;color:var(--muted2);font-weight:700;}
.deepview .tldr .it .v{font-size:14.5px;margin-top:6px;color:var(--text);}
.deepview .tldr .it .v b{color:var(--pink);}

.deepview .skwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:12px;background:linear-gradient(180deg,#0d0b17,#100c1c);padding:6px 4px;}
.deepview svg.sk{display:block;min-width:660px;width:100%;height:auto;}

.deepview .stats{margin-top:10px;}
.deepview .st{display:grid;grid-template-columns:118px 1fr 42px;gap:10px;align-items:center;margin:9px 0;}
.deepview .st .lb{font-size:13.5px;color:var(--text);font-family:"Yu Gothic","Noto Sans JP",sans-serif;}
.deepview .st .lb span{color:var(--muted2);font-size:11.5px;margin-left:5px;font-family:inherit;}
.deepview .st .track{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
.deepview .st .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--violet),var(--pink));}
.deepview .st .fill.c{background:linear-gradient(90deg,#2c7f96,var(--cyan));}
.deepview .st .num{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;}

.deepview .gcard{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:13px 0;}
.deepview .gcard .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.deepview .gcard .pat{font-size:16px;font-weight:700;color:var(--cyan);font-family:"Yu Gothic","Noto Sans JP",sans-serif;}
.deepview .gcard .lab{font-size:11px;letter-spacing:.1em;color:var(--muted2);border:1px solid var(--line2);padding:1px 7px;border-radius:10px;}
.deepview .gcard .ex{margin:11px 0 0;font-size:14.5px;color:#d9d3ea;font-family:"Yu Gothic","Noto Sans JP",sans-serif;}
.deepview .gcard .ex i{color:var(--muted2);font-style:normal;font-size:13px;font-family:-apple-system,"Noto Sans SC",sans-serif;margin-left:8px;}
.deepview .gcard .bd{margin-top:10px;padding:10px 13px;background:rgba(95,227,245,.055);border-left:3px solid var(--cyan);border-radius:0 8px 8px 0;font-size:14.5px;color:#c3dde4;}
.deepview .gcard .bd b{color:var(--cyan);}
.deepview .gcard .me{margin-top:8px;font-size:13.5px;color:var(--muted);}
.deepview .gcard .me em{color:var(--green);font-style:normal;font-family:"Yu Gothic","Noto Sans JP",sans-serif;}

.deepview .note{margin:12px 0;padding:11px 14px;border-radius:9px;font-size:14.5px;background:rgba(255,194,102,.07);border-left:3px solid var(--amber);color:#eadfc7;}
.deepview .note b{color:var(--amber);}
.deepview .warn{margin:12px 0;padding:11px 14px;border-radius:9px;font-size:14.5px;background:rgba(255,128,128,.07);border-left:3px solid var(--red);color:#eccaca;}
.deepview .warn b{color:var(--red);}
.deepview .good{margin:12px 0;padding:11px 14px;border-radius:9px;font-size:14.5px;background:rgba(127,240,168,.07);border-left:3px solid var(--green);color:#cdeada;}
.deepview .good b{color:var(--green);}

.deepview details.fold{margin:9px 0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 14px;}
.deepview details.fold summary{cursor:pointer;padding:11px 0;font-size:14px;color:var(--pink);list-style:none;font-weight:600;}
.deepview details.fold summary::-webkit-details-marker{display:none;}
.deepview details.fold summary::before{content:"\25B8  ";color:var(--muted2);}
.deepview details.fold[open] summary::before{content:"\25BE  ";}
.deepview details.fold .bd{padding:2px 0 13px;font-size:14px;color:#cfc9e2;border-top:1px dashed var(--line2);margin-top:2px;}
.deepview details.fold .bd p{margin:8px 0;}

.deepview .q{margin:14px 0;padding:13px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;}
.deepview .q .no{font-size:11px;color:var(--muted2);letter-spacing:.1em;font-weight:700;}
.deepview .q .ask{font-size:14.5px;margin-top:4px;}
.deepview .q .stem{font-size:15px;color:var(--cyan);margin-top:7px;font-family:"Yu Gothic","Noto Sans JP",sans-serif;}

/* 浅色主题：导航与深读层 */
html.light .nav{background:rgba(250,248,255,.94);}
html.light .nav .row{border-color:var(--line);}
html.light .chip{background:#fff;}
html.light .chip:hover{background:#fff;}
html.light .modeSwitch .tg:hover{background:rgba(40,32,64,.05);}
html.light .modeSwitch .tg.on{color:#6b3fb8;background:rgba(124,77,204,.14);}
html.light .deepview .card p,html.light .deepview details.fold .bd{color:#4a4460;}
/* 深读版段落导语：原先写在 inline style 里，浅色主题下会变成浅灰压白底 */
.deepview .lede{font-size:14.5px;color:#cfc9e2;margin:0 0 14px;}
.deepview .lede b{color:#f0ecfa;}
.deepview .lede.sm{font-size:14px;}
.deepview .lede.tight{margin:0 0 4px;}
html.light .deepview .lede{color:#4d4763;}
html.light .deepview .lede b{color:#241f33;}
html.light .deepview mark{color:#a8306b;background:rgba(216,79,155,.14);}
html.light .deepview mark.b{color:#0b6e80;background:rgba(10,143,168,.13);}
html.light .deepview .gcard .ex{color:#3f3956;}
html.light .deepview .gcard .bd{color:#145e6e;background:rgba(10,143,168,.07);}
html.light .deepview .note{color:#7a5b14;background:rgba(191,138,26,.1);}
html.light .deepview .warn{color:#a03434;background:rgba(201,64,64,.08);}
html.light .deepview .good{color:#1c6e40;background:rgba(23,138,76,.09);}
html.light .deepview .skwrap{background:linear-gradient(180deg,#faf8ff,#ffffff);}
html.light .deepview svg.sk{filter:invert(1) hue-rotate(180deg);}

/* 窄屏：导航瘦身 */
@media (max-width:700px){
  .nav .row{padding:0 12px;}
  .nav .row.songs{padding-top:8px;padding-bottom:6px;gap:8px;}
  .nav .brand{display:none;}
  .chip{padding:4px 10px;font-size:12.5px;}
  .chip em{display:none;}
  /* 手机上直接左右滑，拖动条省掉 */
  .chipbar{display:none;}
  #toolsBtn{display:inline-flex;}
  .nav .row.tools{padding-bottom:8px;gap:6px;}
  .toolbox{display:none;flex:1 1 100%;flex-wrap:wrap;gap:6px;padding-top:2px;}
  .nav.tools-open .toolbox{display:flex;}
  .nav .row.tools .sp{display:none;}
  .tg{font-size:12.5px;padding:5px 11px;}
  .search input{width:auto;flex:1;min-width:0;}
  .search{flex:1 1 120px;}
  .deepview .st{grid-template-columns:92px 1fr 34px;gap:7px;}
  .deepview .st .lb{font-size:12.5px;}
  .modeSwitch .tg{padding:4px 10px;font-size:12px;}
  .deepview th,.deepview td{padding:7px 7px;}
  .deepview table{font-size:12.5px;}
  .deepview .card p{font-size:14.5px;}
  .song header{padding:26px 0 16px;}
  header .ball{display:none;}
}

   "byline": "r-906 feat. IA（CeVIO）／ 作詞・作曲・編曲：<code>r-906</code> ／ PV illustration：<code>サクヤ</code> ／ BPM 167<br>\n    目标水平：<code>JLPT N4–N5</code> ／ 全曲逐句拆词 + 句法结构 + 口语缩略还原",
   "footer": "逐句拆解仅供日语学习参考 · 歌词著作权归 r-906 及原权利人所有<br>\n  中文译文参考 VocaWiki（译：匠屋）／ B 站评论区译文，仅供学习对照<br>\n  生成于 2026-10-11 · 伊莉雅",
   "nav": "ノウナイディスコ",
   "cardsTopHtml": "<div class=\"card ok\">\n  <h2>好消息：这首比上一首适合你得多</h2>\n  <p>上一首《影色舞》是<b>文言文</b>（のたまえど、ちりぬる）。这首《ノウナイディスコ》是<b>彻头彻尾的口语</b>——\n  通篇是\"杵在那儿\"「突っ立ってんの」、\"也就那样吧\"「〜ていよう」、\"真是的烦死了\"「もう五月蝿いな」。</p>\n  <p><b>它的难度不在词难，而在\"缩得狠\"。</b>日本人在口语里会把「何だというのだ」压成「なんだってんだ」、\n  把「放っておいて」压成「放っといて」、把「ならない」压成「なんない」。你把缩略还原回来，这首歌就通了。</p>\n  <p><b>建议路线：</b>先看下面那张「<b>口语缩略还原表</b>」，把它当单词表背一遍，再回头逐句读——效率翻倍。</p>\n</div>\n\n<div class=\"card cy\">\n  <h2>口语缩略还原表（本曲提分第一要素）</h2>\n  <table class=\"sx\">\n    <thead><tr><th>歌里的写法</th><th>还原成规范形</th><th>意思 / 说明</th></tr></thead>\n    <tbody>\n      <tr><td class=\"a\">立ってんだ</td><td class=\"b\">立っているのだ</td><td class=\"c\">三重缩略：ている＋の＋だ → てん＋だ</td></tr>\n      <tr><td class=\"a\">突っ立ってんの？<br>間違ってんの？</td><td class=\"b\">突っ立っているの？<br>間違っているの？</td><td class=\"c\">口语疑问，语气偏\"怪罪/自问\"</td></tr>\n      <tr><td class=\"a\">言ったって<br>みたって</td><td class=\"b\">言っても<br>みても</td><td class=\"c\">〜たって ＝ 〜ても（就算…也），全曲出现 4 次</td></tr>\n      <tr><td class=\"a\">踊っていよう<br>呪っていよう</td><td class=\"b\">踊っていよう<br>呪っていよう</td><td class=\"c\">ている ＋ 意向形（〜よう）＝\"就…着吧\"</td></tr>\n      <tr><td class=\"a\">何にもなんない</td><td class=\"b\">何にもならない</td><td class=\"c\">\"什么用都没有\"；ならない → なんない 是常见缩略</td></tr>\n      <tr><td class=\"a\">放っといて</td><td class=\"b\">放っておいて</td><td class=\"c\">\"别管（我）\"；ておく → とく 的缩略</td></tr>\n      <tr><td class=\"a\">なんだってんだ</td><td class=\"b\">何だというのだ</td><td class=\"c\">\"到底想怎样\"；整句被压成骨架</td></tr>\n      <tr><td class=\"a\">気が付きゃ</td><td class=\"b\">気が付けば</td><td class=\"c\">\"等回过神来\"；〜えば → 〜や 的缩略</td></tr>\n      <tr><td class=\"a\">五月蝿い</td><td class=\"b\">うるさい</td><td class=\"c\">当字（借字），汉字只是借来表意，读音不可推</td></tr>\n      <tr><td class=\"a\">ワタシ / キミ / ボク</td><td class=\"b\">私 / 君 / 僕</td><td class=\"c\">片假名写法＝刻意的\"表演感\"，见文末对照卡</td></tr>\n    </tbody>\n  </table>\n</div>",
   "cardsBottomHtml": "<div class=\"card\" style=\"margin-top:34px;border-color:#4a2a3d\">\n  <h2 style=\"color:var(--pink)\">本曲的两个\"文字游戏\"（读不懂就白听了）</h2>\n  <div class=\"g\"><b>① 片假名 vs 汉字 ＝ 说出口 vs 真心情</b><br>\n  「<b>ワタシ</b>は<b>キミ</b>が好きって言ったって ／ <b>私</b>は<b>君</b>が嫌いな様です」——同一句里，前句用片假名写\"我/你\"，后句用汉字写\"我/你\"。这不是排版随意：片假名是\"嘴上说的、表演出来的\"，汉字是\"心里真的\"。中文读者最容易漏掉这个机关。</div>\n  <div class=\"g\"><b>②「後ろの正面」出自童谣《かごめかごめ》</b><br>\n  日本国民级童谣，最后一句就是「後ろの正面だあれ（我背后正对着的是谁）」。歌里说\"明明都告诉你『身后即正面』了\"——意思是<b>答案一直就在你身后，只有你装看不见</b>。不懂这个梗，这句就是乱码。</div>\n</div>\n\n<div class=\"card cy\">\n  <h2>三分钟词汇账</h2>\n  <div class=\"grid\">\n    <div class=\"mini\"><div class=\"t\">场景词（舞厅）</div>\n      <div class=\"d\">ミラーボール・フロア・<em>レイザー</em>・<em>シンセサイザー</em>・スパンコール</div>\n      <div class=\"ex\">全是外来语，靠英语发音认，<span>不用背拼写</span></div></div>\n    <div class=\"mini\"><div class=\"t\">情绪词</div>\n      <div class=\"d\">不安定・<em>狂う</em>・<em>耐え切れず</em>・<em>呪う</em>・喚く・燻る</div>\n      <div class=\"ex\">动词为主，注意 <span>耐え切れず ＝ 忍不住</span></div></div>\n    <div class=\"mini\"><div class=\"t\">转折与语气</div>\n      <div class=\"d\">でもさ・だからさ・もう・いっそ・ひょっとしたら</div>\n      <div class=\"ex\">句尾「さ」出现 <span>3 次</span>，全是松垮的口语气</div></div>\n    <div class=\"mini\"><div class=\"t\">必背句型</div>\n      <div class=\"d\">〜たって（就算）・〜しか〜ない（只有）・〜のせい（怪）・〜ながら</div>\n      <div class=\"ex\">拿走 <span>〜たって</span> 和 <span>〜しか〜ない</span> 就够本</div></div>\n  </div>\n</div>"

   "nav": "ノーポイッ！",
   "cardsTopHtml": "<div class=\"card ok\">\n  <h2>先说结论：这首是三首里最适合你的</h2>\n  <p>跟前两首对比一下：第一首《影色舞》是<b>文言文</b>，第二首《ノウナイディスコ》是<b>高速口语</b>。\n    这首《ノーポイッ！》的正经语法底子基本落在 <b>N5–N4</b>——全曲没有文言残留，没有四字熟语，\n    连复合动词都很少。42 句里有 20 句你能直接读懂。</p>\n  <p>但别急着庆祝。它的难度不在语法，在<b>三层文字游戏</b>。畑亜貴把机关全藏在了读音里：\n    同一首歌里出现「ポイッ」和「プイッ」两个只差半个音的词，\n    还有「一歩、二歩」和「一羽、二羽」两套数法——<b>听不懂不是语法问题，是耳朵没被训练过</b>。</p>\n  <p><b>建议路线：</b>先把下面那张「三层文字游戏」看完，再逐句读。这张表不看，歌词你每个词都认识，但会完全读歪。</p>\n</div>\n\n<div class=\"card cy\">\n  <h2>本曲的三层文字游戏（跳过这个等于白听）</h2>\n  <table class=\"sx\">\n    <thead><tr><th>机关</th><th>歌里的原文</th><th>到底在说什么</th></tr></thead>\n    <tbody>\n      <tr>\n        <td class=\"a\">① ポイッ vs プイッ</td>\n        <td class=\"b\">ポイッて今日を投げださない<br>キミがプイッて プイッておこっても</td>\n        <td class=\"c\"><b>ポイッ</b>＝随手把东西一扔（对物）；<b>プイッ</b>＝哼一声扭头不理（对人）。<br>\n        全曲逻辑就是这一对：<b>你可以对我闹脾气（プイッ），但不可以把今天扔掉（ポイッ）</b>。</td>\n      </tr>\n      <tr>\n        <td class=\"a\">② 一歩 vs 一羽</td>\n        <td class=\"b\">一歩、二歩、三歩、四歩…<br>一羽、二羽、三羽、四羽…</td>\n        <td class=\"c\">数脚步用<b>歩（ほ）</b>：いっぽ・にほ・さんぽ・よんほ；\n        数鸟用<b>羽（わ）</b>：いちわ・にわ・さんわ・よんわ。<br>\n        读音几乎押韵，字面从「走路」变成「飞起来」——<b>脚步长出了翅膀</b>。\n        而且点兔是兔子，日语里兔子正好也用「羽」来数。</td>\n      </tr>\n      <tr>\n        <td class=\"a\">③ 汉字故意写假名</td>\n        <td class=\"b\">世界へいわだ<br>科学しんぽで<br>あいさつだいじです</td>\n        <td class=\"c\">「平和→へいわ」「進歩→しんぽ」「大事→だいじ」——<b>不是错字，是刻意的</b>。\n        汉字换成假名＝把词变轻、变口语、变可爱，同时凑音节。<br>\n        不懂这一层，你会以为自己在看错版歌词。</td>\n      </tr>\n    </tbody>\n  </table>\n</div>",
   "cardsBottomHtml": "<div class=\"card\" style=\"margin-top:34px;border-color:#4a2a3d\">\n  <h2 style=\"color:var(--pink)\">ポイッ / プイッ 对照表（本曲唯一的考点）</h2>\n  <table class=\"sx\">\n    <thead><tr><th>词</th><th>读音</th><th>动作</th><th>对象</th><th>歌里的用法</th></tr></thead>\n    <tbody>\n      <tr><td class=\"a\">ポイッ</td><td class=\"b\">poi</td><td class=\"c\">随手一抛、丢掉</td><td class=\"c\">东西 / 事情</td>\n          <td class=\"c\">ポイッて今日を投げださない＝别把今天扔掉</td></tr>\n      <tr><td class=\"a\">プイッ</td><td class=\"b\">pui</td><td class=\"c\">扭头、撇嘴不理人</td><td class=\"c\">人</td>\n          <td class=\"c\">キミがプイッておこっても＝就算你赌气扭头</td></tr>\n    </tbody>\n  </table>\n  <div class=\"g\" style=\"margin-top:12px\"><b>怎么练这一对？</b><br>\n    把元音拉开读：ポイッ 的嘴型是圆的、往外送（像扔东西）；プイッ 的嘴型是扁的、往里收（像撇嘴）。\n    这两个动作的嘴型，正好就是它们各自的意思。<b>日语拟声拟态词，多半都能靠嘴型记住。</b></div>\n</div>\n\n<div class=\"card cy\">\n  <h2>三分钟词汇账</h2>\n  <div class=\"grid\">\n    <div class=\"mini\"><div class=\"t\">拟态词（本曲最多）</div>\n      <div class=\"d\">わくわく・てくてく・じりじり・わいわい・ゆっくり・ちょっぴり</div>\n      <div class=\"ex\">不需要加助词，直接当状语。<span>先认脸，别硬背</span></div></div>\n    <div class=\"mini\"><div class=\"t\">谚语缩略（写片假名）</div>\n      <div class=\"d\">チリ積モ・棚ボタ・ノーノー・イエスイエス</div>\n      <div class=\"ex\">チリツモ＝積少成多；<span>タナボタ＝天上掉馅饼</span></div></div>\n    <div class=\"mini\"><div class=\"t\">括号里的呼应词</div>\n      <div class=\"d\">(あるよ) (なるね) (ちがう？) (おねがいです) (だめです) (すきです)</div>\n      <div class=\"ex\">这是第二个声部在<span>回话</span>，不是注释</div></div>\n    <div class=\"mini\"><div class=\"t\">必背口语语法</div>\n      <div class=\"d\">〜ちゃう／〜ちゃおう・〜たって・〜なくたって・〜はずだ・〜そう</div>\n      <div class=\"ex\">拿走 <span>〜ちゃう</span> 和 <span>〜たって</span> 就够本</div></div>\n  </div>\n</div>"

   "cardsTopHtml": "<div class=\"card ok\">\n<h2>这首歌对你是什么难度</h2>\n<p>先说好消息：<b>词汇非常日常</b>。ふつう、わりと、意地悪、髪、心——全是初学阶段就该会的词。全曲 24 句里有 <b>14 句</b>你现在的水平就能直接读懂。</p>\n<p>坏消息是：<b>句子是碎的</b>。やくしまるえつこ 的写法是短句、跳接、名词并排往外扔，很多句子没有完整谓语（「気になるあの娘の生きがい　願い」就这么断在那儿）。这不是语法难，是<b>它压根没打算把话说完整</b>。</p>\n<p><b>建议路线：</b>先看下面那张「三件事」，把那三个坑绕开，再逐句读。这三点不看，你会发现每个词都认识、整句却读不通。</p>\n</div>\n\n<div class=\"card cy\">\n<h2>读这首歌前，先把这三件事钉死</h2>\n<table class=\"sx\"><thead><tr><th>坑</th><th>歌里的原文</th><th>真相</th></tr></thead><tbody>\n<tr><td class=\"a\">① 娘 ≠ 娘</td><td class=\"b\">気になるあの<b>娘</b></td><td class=\"c\">读 <b>こ</b>，意思是<b>女孩</b>。汉语的「娘」是妈妈，日语里完全不是这个意思。这一首的标题就差这一个字。</td></tr>\n<tr><td class=\"a\">② 动词成对出现</td><td class=\"b\">止めないで ／ 止まらない<br>あたためて ／ （あたたまる）</td><td class=\"c\">日语动词分<b>他动词</b>（我去做）和<b>自动词</b>（它自己发生）。同一个词根配一对，必须成对记。本曲正好把「止める／止まる」这对用满了。</td></tr>\n<tr><td class=\"a\">③ 歌词会倒装</td><td class=\"b\">回して<b>ハンドル</b><br>踏み込んで<b>アクセル</b></td><td class=\"c\">正常语序是「ハンドルを回して」。为了踩拍子，宾语被甩到动词后面。<b>不是病句，也不是你读错</b>。</td></tr>\n</tbody></table>\n</div>",
   "cardsBottomHtml": "<div class=\"card hot\">\n<h2>这首歌的机关：荒诞的地理跳跃</h2>\n<p>副歌里那两句「出租车」，是理解整首歌的钥匙：</p>\n<div class=\"g\"><b>① 九龍 → ニューヨーク（九龙 → 纽约）</b><br>物理上不可能的距离。这不是地理知识，是<b>心情的尺度</b>——恋爱里那种「想立刻飞到她身边」的失控感，只能用荒诞的跨度来表达。</div>\n<div class=\"g\"><b>② 香港 → センター街（香港 → 涩谷中心街）</b><br>「センター街」默认指东京涩谷那条街。注意这里比上一段<b>稍微「现实」了一点</b>——从「跨半个地球」缩到「跨国」。两段副歌的差别就在这一个地名上。</div>\n<div class=\"g\"><b>③ 观察者视角</b><br>全曲都在写「她」，但「気になる（在意）」「意地悪（坏心眼）」都是<b>我的判断</b>。她脑子里其实只是「ふつう ふつう わりと普通」——<b>普通的不是她，是我看她的眼光</b>。这是相対性理論最擅长的写法：用平静的语气唱出失控的内容。</div>\n</div>\n\n<div class=\"card cy\">\n<h2>三分钟词汇账</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">她的一切（名词堆）</div><div class=\"d\">頭の中・生きがい・願い・想い・心</div><div class=\"ex\">全是抽象名词，<span>直接并排用，不加助词</span></div></div>\n<div class=\"mini\"><div class=\"t\">运动与身体</div><div class=\"d\">はしゃぐ・疲れる・眠りこむ・なびく・震える・抱きしめる</div><div class=\"ex\">本曲动词密度最高的部分，<span>注意复合动词</span></div></div>\n<div class=\"mini\"><div class=\"t\">外来语四连</div><div class=\"d\">タクシー・サイボーグ・ペーパードライバー・アクセル</div><div class=\"ex\">两个是<b>和制英语</b>，<span>英语里不这么说</span></div></div>\n<div class=\"mini\"><div class=\"t\">必背组合</div><div class=\"d\">〜てよ（请求）・〜ないで（别…）・〜こむ（彻底）</div><div class=\"ex\">拿走这三个，<span>整首副歌就通了</span></div></div>\n</div>\n</div>"

   "nav": "フラッシュバッカー",
   "cardsTopHtml": "<div class=\"card ok\">\n<h2>先说结论：这是五首里最容易上手的一首</h2>\n<p>语法底子基本落在 <b>N5–N4</b>——没有文言残留，没有四字熟语，连口语缩略都很少（全曲只有「〜てる」「〜てく」「〜ちゃう」三处）。46 句里有 <b>18 句你现在就能直接读懂</b>。</p>\n<p>但它换了另一种难法：<b>意象词密度高</b>。転換点、行方、薄明、星屑、宙、彩り——单看都不难，凑在一起就成了一首「关于消失」的诗。建议路线：<b>先背副歌那四句骨架，再回头补主歌的名词</b>。</p>\n</div>\n\n<div class=\"card cy\">\n<h2>全曲 6 个必拿句型（这张表比逐句更值钱）</h2>\n<table class=\"sx\"><thead><tr><th>歌里的写法</th><th>还原 / 结构</th><th>一句说清</th></tr></thead><tbody>\n<tr><td class=\"a\">泡になって消えた</td><td class=\"b\">名词 ＋ に ＋ なる</td><td class=\"c\">「に」标变化结果（变成泡沫）。<b>不是「を」</b></td></tr>\n<tr><td class=\"a\">残れる / 成れる / 写せる</td><td class=\"b\">五段动词 → え段 ＋ る</td><td class=\"c\">可能形三连：能留下／能变成／能拍到</td></tr>\n<tr><td class=\"a\">消えてしまう → 消えちゃう</td><td class=\"b\">〜てしまう 的口语缩略</td><td class=\"c\">遗憾地…了／不由自主地…。全曲 2 处</td></tr>\n<tr><td class=\"a\">ぼやけたままのフォーカス</td><td class=\"b\">〜たまま ＋ の ＋ 名词</td><td class=\"c\">保持着「糊」这个状态没变</td></tr>\n<tr><td class=\"a\">寂しげな顔</td><td class=\"b\">形容词词干 ＋ げ</td><td class=\"c\">看起来…（书面版「〜そう」）</td></tr>\n<tr><td class=\"a\">フォーカスじゃ</td><td class=\"b\">では 的口语缩略</td><td class=\"c\">「…的话」。じゃ 后面常接否定结果</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card hot\">\n<h2>标题机关：フラッシュバッカー 不是英语</h2>\n<p>这词你在词典里查不到，因为它是<b>作者自己造的</b>：<code>flashback</code>（闪回）＋ 英语后缀 <code>-er</code>（…的人）＝「总是闪回的那个人」。</p>\n<p>日语里这类「和製英語」很多（サラリーマン、ハイテンション）。造词的用意很明确：<b>不是「闪回」这个现象，而是「活在闪回里的人」</b>。全曲最后落在「今も思い出してる」，说话的一直是「我」——所以这个标题其实是在叫自己。</p>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>暗线：一组自他动词，撑起了全曲的情绪转折</h2>\n<table class=\"sx\"><thead><tr><th>自动词（自己发生）</th><th>他动词（伸手去做）</th><th>歌里的用法</th></tr></thead><tbody>\n<tr><td class=\"a\">離れる → 離れない</td><td class=\"b\">離す → 離さない</td><td class=\"c\">第一段「言葉が離れない」→ 末段「言葉を離さない」，一字之差，立场反转</td></tr>\n<tr><td class=\"a\">消える → 消えた</td><td class=\"b\">消す</td><td class=\"c\">泡になって消えた——自己消失，没有凶手</td></tr>\n<tr><td class=\"a\">染まる</td><td class=\"b\">染める</td><td class=\"c\">空が薄明に染まる（天被染色，自动词）</td></tr>\n<tr><td class=\"a\">こぼれる</td><td class=\"b\">こぼす → こぼして</td><td class=\"c\">空が彩りをこぼして（天主动洒下，他动词）</td></tr>\n<tr><td class=\"a\">流れる → 流れ</td><td class=\"b\">流す</td><td class=\"c\">水のように流れ（自己流走）</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card\">\n<h2>三分钟词汇账：全曲的四个意象群</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">消失系</div><div class=\"d\">泡・行方・薄明・水・透明</div><div class=\"ex\">整套「留不住」的意象，动词一律自动词</div></div>\n<div class=\"mini\"><div class=\"t\">光系</div><div class=\"d\">光る・眩しい・星屑・彩り</div><div class=\"ex\">对应「抓得住」的一侧，注意 眩しい 读 まぶしい</div></div>\n<div class=\"mini\"><div class=\"t\">身体系</div><div class=\"d\">背中・体・顔・心</div><div class=\"ex\">从「背中を包まれる」到「心が宙に舞う」，被动转主动</div></div>\n<div class=\"mini\"><div class=\"t\">必背三句</div><div class=\"d\">泡になって消えた／離れない／離さない</div><div class=\"ex\">拿走这三句，全曲骨架就到手了</div></div>\n</div>\n</div>"

 {
  "meta": {
   "titleMain": "ウミユリ海底譚",
   "titleSub": "海百合海底譚 / Umiyuri Kaiteitan",
   "kicker": "Lyrics Breakdown · 逐句精讲 ＋ 深读",
   "byline": "n-buna ／ 作詞・作曲：<code>n-buna</code> ／ 歌唱：<code>初音ミク</code> ／ 2014-02-24 投稿 ／ BPM 120<br>\n    目标水平：<code>JLPT N4–N5</code> ／ 全曲逐句拆词 + 句法结构 + 意象词标注 ／ 另附深读版",
   "footer": "逐句拆解仅供日语学习与作品评论 · 歌词著作权归 n-buna 及原权利人所有<br>歌词核对：Vocaloid Lyrics Wiki ／ vocaloidlyrics(miraheze) ／ 百度百科 三源对照 · 生成于 2026-10-22 · 伊莉雅",
   "nav": "ウミユリ海底譚",
   "cardsTopHtml": "<div class=\"card ok\">\n<h2>先说清楚：这首歌对你现在是什么难度</h2>\n<p>语法本身不算地狱——没有文言残留，没有四字熟语，句型基本在 <b>N4–N3</b> 区间。真正卡人的是<b>意象</b>：n-buna 把整首歌写成一个深海生物的独白，词与词之间的逻辑跳跃非常大，一句话里同时有「海の底」和「空の底」。</p><p><b>所以别按字面读。</b>这歌的所有方位词都是反的：海底是灰、空底是梦；他在海底仰望天空，又在天空里溺水。你把这层搞懂，剩下的就是背单词。</p><p><b>建议路线：</b>先看下面两张卡（标题密码 + 读音陷阱），再逐句读。跳过前两张卡直接读歌词，你会以为自己在读乱码。</p>\n</div>\n\n<div class=\"card cy\">\n<h2>标题密码：ウミユリ 是动物，不是花</h2>\n<p>「海百合」三个字长得像植物，中文里也常被当成海里的百合花。但 <b>ウミユリ（海百合）是棘皮动物</b>——海星、海胆的亲戚。它一辈子固定在海底，顶端张开像一朵花，其实是触手在捞浮游生物。</p><p>这就是全曲的核心比喻：<b>一朵固定在深海、永远够不到天空的花，在仰望天空。</b>作者投稿时的原话是「深海の生き物が空に憧れるの、可愛くないですか」（向往天空的深海生物，不可爱吗）。</p><p>所以歌里才反复出现「海の底／空の底」「空を眺める」「空に溺れる」——<b>它从来没离开过海底，整首歌都是它仰头看见的幻象</b>。这个前提不知道，副歌全是废话；知道了，副歌全是刀子。</p>\n</div>\n\n<div class=\"card cy\">\n<h2>五个读音陷阱（汉字会骗你）</h2>\n<table class=\"sx\"><thead><tr><th>歌词里的写法</th><th>实际读音</th><th>为什么坑</th></tr></thead><tbody>\n<tr><td class=\"a\">灰に塗れてく</td><td class=\"b\">はいに まみれてく</td><td class=\"c\">「塗れる」读 まみれる，不是 ぬれる。ぬれる 是「湿了」，まみれる 是「沾满、糊了一层」</td></tr>\n<tr><td class=\"a\">泡沫の庭</td><td class=\"b\">うたかたの にわ</td><td class=\"c\">不是 ほうまつ。うたかた 是文言残留，指水面泡沫，引申为「短暂虚幻」</td></tr>\n<tr><td class=\"a\">嗚咽</td><td class=\"b\">おえつ</td><td class=\"c\">不是 うえつ、也不是 おけつ。指压抑着哭的声音</td></tr>\n<tr><td class=\"a\">四拍子</td><td class=\"b\">よんびょうし</td><td class=\"c\">音乐术语 4/4 拍。这歌确实是 4/4，BPM 120</td></tr>\n<tr><td class=\"a\">縋ってよ</td><td class=\"b\">すがってよ</td><td class=\"c\">「縋る」＝抓住不放、哀求。原形读音就很偏，N2 词</td></tr>\n</tbody></table>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>全曲最大的机关：灰 hai ↔ 藍 ai</h2>\n<p>注意这两句：</p><p>「今 <b>灰</b>に塗れてく」→ <b>はい</b> に まみれてく<br>「ただ <b>藍</b>に呑まれてく」→ <b>あい</b> に のまれてく</p><p>「灰（はい）」和「藍（あい）」只差一个 <b>h</b> 音，母音完全相同（a-i）。而且两句结构一模一样：<b>颜色词 + に + 被动式动词</b>。第一段是「被灰掩埋」，第二段是「被深蓝吞掉」——同一个句式，换了颜色，情绪从「熄灭」滑到「沉没」。</p><p>这就是 n-buna 的招牌：<b>用读音做转场，不靠歌词意思</b>。你听的时候会觉得「这两句好像」，这就是他埋的东西。</p>\n</div>\n\n<div class=\"card cy\">\n<h2>全曲反复出现的三个骨架</h2>\n<table class=\"sx\"><thead><tr><th>句型</th><th>意思</th><th>在歌里出现</th></tr></thead><tbody>\n<tr><td class=\"a\">〜ないで</td><td class=\"b\">请不要…／不要…</td><td class=\"c\">笑わないで・戻らないで・止まらないで・歌わないで（4 次以上）</td></tr>\n<tr><td class=\"a\">〜てしまってよ</td><td class=\"b\">干脆…掉算了</td><td class=\"c\">取り去ってしまってよ・消え去ってしまってよ（强烈请求，带自弃）</td></tr>\n<tr><td class=\"a\">〜てく／〜ていく</td><td class=\"b\">逐渐…下去</td><td class=\"c\">塗れてく・呑まれてく・溺れていく（全曲的下沉主线）</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>三分钟词汇账（先背这些就够读一半）</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">下沉系</div><div class=\"d\">塗れる(まみれる)・呑まれる(のまれる)・溺れる(おぼれる)・沈む</div><div class=\"ex\">全是「被…吞掉」的被动感，<span>主语永远无力</span></div></div>\n<div class=\"mini\"><div class=\"t\">消失系</div><div class=\"d\">遠のく(とおのく)・掻き消す(かきけす)・消え去る・泣き止む</div><div class=\"ex\">掻き消す 是「一把抹掉」，<span>比 消す 狠得多</span></div></div>\n<div class=\"mini\"><div class=\"t\">情绪系</div><div class=\"d\">縋る(すがる)・塞ぐ(ふさぐ)・逆らう(さからう)・笑う</div><div class=\"ex\">縋る＝死抓着不放，<span>全曲的核心动作</span></div></div>\n<div class=\"mini\"><div class=\"t\">必背句型</div><div class=\"d\">〜ないで・〜てしまってよ・〜のに・〜なんて</div><div class=\"ex\">拿走 <span>〜のに</span>（明明…却）就够本</div></div>\n</div>\n</div>",
   "deepHtml": "<nav class=\"toc\">\n  <div class=\"in\">\n    <a href=\"#d1\"><span class=\"num\">01</span>骨架</a>\n    <a href=\"#d2\"><span class=\"num\">02</span>改词表</a>\n    <a href=\"#d3\"><span class=\"num\">03</span>音韵</a>\n    <a href=\"#d4\"><span class=\"num\">04</span>语法</a>\n    <a href=\"#d5\"><span class=\"num\">05</span>语气</a>\n    <a href=\"#d6\"><span class=\"num\">06</span>主题</a>\n    <a href=\"#d7\"><span class=\"num\">07</span>跟读</a>\n    <a href=\"#d8\"><span class=\"num\">08</span>练习</a>\n    <a href=\"#d9\"><span class=\"num\">09</span>清单</a>\n  </div>\n</nav>\n\n<div class=\"card ok\">\n  <h2>先给结论：三分钟版</h2>\n  <p>逐句篇回答「这句在说什么」，这一篇回答「<b>为什么整首这样写</b>」。三个结论，你先拿走：</p>\n  <div class=\"tldr\">\n    <div class=\"it\">\n      <div class=\"k\">结构</div>\n      <div class=\"v\">57 句其实只有 <b>3 副骨架</b>。A 与 A′ 同骨、B 与 D 同骨、A 与 F 同骨。全曲是同一股水来回冲刷，不是六段新内容。</div>\n    </div>\n    <div class=\"it\">\n      <div class=\"k\">音韵</div>\n      <div class=\"v\">三个词只差一个辅音：<b>灰（はい）→ 藍（あい）→ 愛（あい）</b>。这条音链就是全曲的脊椎。</div>\n    </div>\n    <div class=\"it\">\n      <div class=\"k\">语气</div>\n      <div class=\"v\">日语表达沉重感情，靠的是<b>把它说小</b>（だけ）和<b>把它推开</b>（なんて），不是加重语气。</div>\n    </div>\n  </div>\n</div>\n\n\u003C!-- ============ 01 ============ -->\n<section class=\"sec\" id=\"d1\">\n  <div class=\"sec-h\"><span class=\"n\">01</span><h3>骨架：六段，三副骨</h3><span class=\"jp\">構成</span></div>\n\n  <p class=\"lede\" style=\"margin:0 0 14px\">\n    A → B → A′ → D → C → F。乍看是六段新内容，实际是 <b>三对镜像</b>：A 与 A′、B 与 D、A 与 F。\n    真正「只有一次」的段落只有 C（桥段），而它恰好是全曲最短、最狠的地方。\n  </p>\n\n  <div class=\"skwrap\">\n    <svg class=\"sk\" viewBox=\"0 0 900 400\" role=\"img\" aria-label=\"六段结构与深度走向\">\n      <defs>\n        <linearGradient id=\"dln\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n          <stop offset=\"0\" stop-color=\"#5fe3f5\"/><stop offset=\".55\" stop-color=\"#b78cff\"/><stop offset=\"1\" stop-color=\"#ff6fb5\"/>\n        </linearGradient>\n      </defs>\n      \u003C!-- 水面 -->\n      <line x1=\"30\" y1=\"204\" x2=\"872\" y2=\"204\" stroke=\"#3a2e5c\" stroke-dasharray=\"6 7\" stroke-width=\"1.2\"/>\n      <text x=\"34\" y=\"194\" fill=\"#7ff0a8\" font-size=\"11.5\" font-family=\"sans-serif\" letter-spacing=\"1\">↑ 空 ／ 生 ／ 对方所在</text>\n      <text x=\"34\" y=\"226\" fill=\"#918aa8\" font-size=\"11.5\" font-family=\"sans-serif\" letter-spacing=\"1\">↓ 海 ／ 梦 ／ 我所在</text>\n\n      \u003C!-- 主线 -->\n      <path d=\"M100,258 C150,300 185,312 232,312 C300,312 322,244 364,244\n               C430,244 455,278 500,278 C560,278 580,330 632,330\n               C700,330 720,168 790,158\"\n            fill=\"none\" stroke=\"url(#dln)\" stroke-width=\"2.6\" stroke-linecap=\"round\" opacity=\".92\"/>\n\n      \u003C!-- 节点 -->\n      <g font-family=\"sans-serif\">\n        <circle cx=\"100\" cy=\"258\" r=\"7.5\" fill=\"#5fe3f5\"/>\n        <text x=\"100\" y=\"238\" fill=\"#5fe3f5\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">A</text>\n        <text x=\"100\" y=\"288\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">主歌</text>\n\n        <circle cx=\"232\" cy=\"312\" r=\"7.5\" fill=\"#6fd8ea\"/>\n        <text x=\"232\" y=\"342\" fill=\"#6fd8ea\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">B</text>\n        <text x=\"232\" y=\"360\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">副歌 1</text>\n\n        <circle cx=\"364\" cy=\"244\" r=\"7.5\" fill=\"#9fb6ff\"/>\n        <text x=\"364\" y=\"226\" fill=\"#9fb6ff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">A′</text>\n        <text x=\"364\" y=\"266\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">主歌 2</text>\n\n        <circle cx=\"500\" cy=\"278\" r=\"7.5\" fill=\"#b78cff\"/>\n        <text x=\"500\" y=\"261\" fill=\"#b78cff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">D</text>\n        <text x=\"500\" y=\"300\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">副歌 2</text>\n\n        <circle cx=\"632\" cy=\"330\" r=\"7.5\" fill=\"#d98cd8\"/>\n        <text x=\"632\" y=\"360\" fill=\"#d98cd8\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">C</text>\n        <text x=\"632\" y=\"378\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">桥段（最深）</text>\n\n        <circle cx=\"790\" cy=\"158\" r=\"7.5\" fill=\"#ff6fb5\"/>\n        <text x=\"790\" y=\"140\" fill=\"#ff6fb5\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">F</text>\n        <text x=\"790\" y=\"182\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">末段</text>\n      </g>\n\n      \u003C!-- 注释 -->\n      <text x=\"700\" y=\"112\" fill=\"#ff6fb5\" font-size=\"11.5\" font-family=\"sans-serif\" text-anchor=\"end\">\n        あの空に溺れていく ——「上浮」也是溺\n      </text>\n      <path d=\"M700,118 L772,146\" stroke=\"#ff6fb5\" stroke-width=\"1\" stroke-dasharray=\"3 4\" opacity=\".7\"/>\n\n      <text x=\"164\" y=\"330\" fill=\"#6f6889\" font-size=\"10.5\" font-family=\"sans-serif\">被藍吞没</text>\n      <text x=\"560\" y=\"350\" fill=\"#6f6889\" font-size=\"10.5\" font-family=\"sans-serif\">被期待的话杀死</text>\n    </svg>\n  </div>\n\n  <div class=\"note\">\n    <b>看这条线的形状。</b>它不是 U 形（先沉后浮），也不是单纯的下降。它沉到 C 段最低点，然后在 F 段<b>冲到水面之上</b>——\n    而最后一句偏偏是「在那片天空里溺下去」。作者用整首歌把你带到「上面」，再告诉你上面也是水。\n    这条曲线本身就是全曲的论点。\n  </div>\n\n  <h4 style=\"font-size:13px;letter-spacing:.14em;color:var(--violet);margin:22px 0 8px;\">对仗矩阵</h4>\n  <table>\n    <tr><th>组</th><th>对应段</th><th>关系</th><th>唯一的实质差别</th></tr>\n    <tr><td class=\"k\">①</td><td class=\"jp\">A ↔ A′</td><td>同骨架，换四面镜子</td><td>「海の底」→「空の底」；「夢を見た」→「夢を描いた」</td></tr>\n    <tr><td class=\"k\">②</td><td class=\"jp\">B ↔ D</td><td>同骨架，语气反转</td><td>「縋ってよ（求你缠着我）」→「塞いでよ（堵上吧）」</td></tr>\n    <tr><td class=\"k\">③</td><td class=\"jp\">A ↔ F</td><td>同骨架，几乎原样复现</td><td>「僕の歌」→「僕の夢」；「空中散歩のSOS」→「泣いて笑ってよSOS」</td></tr>\n    <tr><td class=\"k\">④</td><td class=\"jp\">B ↔ F</td><td>局部借用</td><td>「取り去って」→「消え去って」</td></tr>\n    <tr><td class=\"k\">⑤</td><td class=\"jp\">C</td><td>孤本，无镜像</td><td>全曲唯一直接说「你杀了我」的段落</td></tr>\n  </table>\n\n  <div class=\"good\">\n    <b>学习上的用处：</b>你不用记 57 句。记住 A、B、C 三段的词，等于掌握了 40 句以上。剩下的全是「改了哪几个词」。\n    这也是最省力的背词法——<b>用差异记忆，而不是用重复记忆</b>。\n  </div>\n</section>\n\n\u003C!-- ============ 02 ============ -->\n<section class=\"sec\" id=\"d2\">\n  <div class=\"sec-h\"><span class=\"n\">02</span><h3>改词表：作者动手的地方</h3><span class=\"jp\">差し替え</span></div>\n\n  <p class=\"lede\" style=\"margin:0 0 6px\">\n    三张表，把重复段落逐位对齐。左边是第一次，右边是第二次。<mark>粉色</mark>是被换掉的部分。\n    这一节是全篇的核心——<b>作者在哪动手，就是他想说什么</b>。\n  </p>\n\n  <div class=\"card cy\">\n    <h2>表一　A → A′：「你只是远去了」改写成「你对我挥了挥手」</h2>\n    <table class=\"df\">\n      <tr><th>#</th><th>A メロ（第一次）</th><th>A′ メロ（第二次）</th><th>换了什么</th></tr>\n      <tr>\n        <td>1</td>\n        <td class=\"jp\">海の底 息を飲み干す夢を見た</td>\n        <td class=\"jp\"><mark>空</mark>の底 <mark>灰の中で</mark>夢を<mark>描いた</mark></td>\n        <td>介质从「海」翻到「空」，但两边都是「底」；「做梦」变成「画梦」</td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td class=\"jp\">光の泳ぐ空にさざめく</td>\n        <td class=\"jp\">光<mark>に届く</mark> 波に<mark>揺らめく</mark> 夜の奥</td>\n        <td>「光在远处游」变成「够得到光了」——但只是「够到」，不是「抓住」</td>\n      </tr>\n      <tr>\n        <td>3</td>\n        <td class=\"jp\">君が遠のいただけ</td>\n        <td class=\"jp\"><mark>僕の心に</mark> 君が<mark>手を振った</mark>だけ</td>\n        <td>同一个「だけ」，事实从「你走远了」变成「你朝我挥手了」</td>\n      </tr>\n      <tr>\n        <td>4</td>\n        <td class=\"jp\">僕の手を遮った</td>\n        <td class=\"jp\"><mark>君の背を掻き消した</mark>（主语换成「消える光」）</td>\n        <td>主动的「挡」变成被动的「抹掉」，动作的主语悄悄换成了光</td>\n      </tr>\n    </table>\n    <div class=\"note\" style=\"margin-top:14px;\">\n      <b>手筋：改叙述，不改事实。</b>第 3 行最典型。对方做的事没变（离开），但说法从「远去」换成「挥手」。\n      一字之差，被抛弃就成了告别。这是全曲最痛的一处改写——<b>他没有否认失去，他只是换了个说法让自己受得住</b>。\n      「だけ」在这里不是「只有」，是「我不敢再多说」。\n    </div>\n  </div>\n\n  <div class=\"card cy\">\n    <h2>表二　B → D：「求你」变成「我不要」</h2>\n    <table class=\"df\">\n      <tr><th>#</th><th>サビ 1</th><th>サビ 2</th><th>换了什么</th></tr>\n      <tr>\n        <td>1</td>\n        <td class=\"jp\"><mark>もっと</mark>縋ってよ</td>\n        <td class=\"jp\"><mark>そっと</mark>塞いでよ</td>\n        <td><b>も→そ</b>：一个假名。「再多缠着我」变成「轻轻堵上」</td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td class=\"jp\">知ってしまうから</td>\n        <td class=\"jp\">もういらないから</td>\n        <td>理由从「因为我会知道（真相）」换成「因为已经不需要了」</td>\n      </tr>\n      <tr>\n        <td>3</td>\n        <td class=\"jp\">僕の歌を笑わないで</td>\n        <td class=\"jp\"><mark>そんな嘘を歌わないで</mark></td>\n        <td>请求对象反转：别笑我 → 你别唱（把「谎」的标签贴回去）</td>\n      </tr>\n      <tr>\n        <td>4</td>\n        <td class=\"jp\">君はここ<mark>に</mark>戻らないで</td>\n        <td class=\"jp\">君はここ<mark>で</mark>止まらないで</td>\n        <td>助词 に→で；动词 戻る→止まる。回来 vs 停下</td>\n      </tr>\n      <tr>\n        <td>5</td>\n        <td class=\"jp\">泣いて笑ってよ <mark>一等星</mark></td>\n        <td class=\"jp\">泣いて笑ってよ <mark>SOS</mark></td>\n        <td>呼语从「最亮的星」降级成「求救信号」</td>\n      </tr>\n      <tr>\n        <td>6</td>\n        <td class=\"jp\"><mark>僕は 僕は 僕は</mark></td>\n        <td class=\"jp\"><mark>愛は 愛は 愛は</mark></td>\n        <td>三连排比的主语，从「我」换成「爱」</td>\n      </tr>\n      <tr>\n        <td>7</td>\n        <td class=\"jp\">ただ藍に呑まれてく</td>\n        <td class=\"jp\"><mark>消えない君を描いた</mark> 僕にもっと</td>\n        <td>全曲第一次出现「我做了什么」——从被吞，变成描画</td>\n      </tr>\n    </table>\n    <div class=\"note\" style=\"margin-top:14px;\">\n      <b>手筋：一个假名的转身。</b>もっと（mo-tto）／そっと（so-tto）。辅音 m 换成 s，音量立刻从「喊」降到「耳语」。\n      这是全曲最省力、也最见功力的一次改笔。<b>日语的抒情经常不靠换词，靠换一个音。</b>\n    </div>\n  </div>\n\n  <div class=\"card cy\">\n    <h2>表三　A → F：结尾不是解决，是回到开头</h2>\n    <table class=\"df\">\n      <tr><th>#</th><th>A メロ（开篇）</th><th>ラスサビ（收尾）</th><th>换了什么</th></tr>\n      <tr><td>1</td><td class=\"jp\">待って わかってよ</td><td class=\"jp\">待って わかってよ</td><td><b>完全没改</b></td></tr>\n      <tr><td>2</td><td class=\"jp\">僕の<mark>歌</mark>を笑わないで</td><td class=\"jp\">僕の<mark>夢</mark>を笑わないで</td><td>歌 → 梦</td></tr>\n      <tr><td>3</td><td class=\"jp\">空中散歩<mark>の SOS</mark></td><td class=\"jp\">泣いて笑ってよ <mark>SOS</mark></td><td>SOS 从「贴纸」变成「喊出来的动作」</td></tr>\n      <tr><td>4</td><td class=\"jp\">空を<mark>眺める</mark></td><td class=\"jp\">あの空<mark>に溺れていく</mark></td><td>を→に；眺める→溺れる</td></tr>\n      <tr><td>5</td><td class=\"jp\">僕の手を遮った</td><td class=\"jp\">（删除）</td><td>没人再挡了——因为已经沉下去了</td></tr>\n      <tr><td>6</td><td class=\"jp\">君はここに戻らないで</td><td class=\"jp\"><mark>僕は</mark>ここで止まらないで</td><td>主语从「你」换成「我」</td></tr>\n    </table>\n    <div class=\"warn\" style=\"margin-top:14px;\">\n      <b>最后一处最狠。</b>第 6 行：第二段是「<b>你</b>别回到这里」，末段变成「<b>我</b>不要停在这里」。\n      但「止まらないで」的对象是自己——这句话在语法上是「请别人别停」，主语却写成了「僕は」。\n      <b>他既在说「我不要停」，也在说「谁来叫我别停」。</b>一句话两个说话对象，这是全曲最漂亮的一处语法裂缝。\n    </div>\n  </div>\n</section>\n\n\u003C!-- ============ 03 ============ -->\n<section class=\"sec\" id=\"d3\">\n  <div class=\"sec-h\"><span class=\"n\">03</span><h3>音韵：只差一个辅音</h3><span class=\"jp\">音の仕掛け</span></div>\n\n  <p class=\"lede\" style=\"margin:0 0 14px\">\n    日语的谐音不是文字游戏，是<b>听觉上的滑动</b>。这首歌最核心的一条音链只有三个词，全部出现在段落的最后一句、同一个句型里：\n  </p>\n\n  <table>\n    <tr><th>段</th><th>原句</th><th>读音</th><th>词义</th></tr>\n    <tr><td class=\"k\">A</td><td class=\"jp\">今 灰に塗れてく</td><td class=\"jp\">はい に まみれてく</td><td>此刻，被<b>灰</b>一点点糊满</td></tr>\n    <tr><td class=\"k\">B</td><td class=\"jp\">ただ藍に呑まれてく</td><td class=\"jp\">あい に のまれてく</td><td>只是被<b>深蓝</b>一点点吞掉</td></tr>\n    <tr><td class=\"k\">D</td><td class=\"jp\">愛は 愛は 愛は</td><td class=\"jp\">あい は あい は あい は</td><td><b>爱</b>啊，爱啊，爱啊</td></tr>\n  </table>\n\n  <div class=\"good\">\n    <b>ha-i → a-i → a-i。</b>h 掉了，词就从「灰烬」滑到「海的颜色」，再滑到「爱」。\n    中间那个「藍」是枢纽：它既是颜色（海），又只差一个字母就是「愛」。\n    所以「被蓝吞没」和「被爱吞没」在听觉上是同一件事——<b>这首歌不用解释这个，它让你听见</b>。\n  </div>\n\n  <h4 style=\"font-size:13px;letter-spacing:.14em;color:var(--violet);margin:24px 0 6px;\">另外四组</h4>\n  <table>\n    <tr><th>原句</th><th>双关</th><th>说得通在哪</th></tr>\n    <tr>\n      <td class=\"jp\">海の底 息を飲み干す</td>\n      <td class=\"jp\">息（いき）＝ 生き（いき）</td>\n      <td>「把呼吸喝干」＝「把活命喝干」。惯用「息を飲む」是倒吸一口气，加个「干す」就变成喝到一滴不剩——海底溺死的另一种说法。</td>\n    </tr>\n    <tr>\n      <td class=\"jp\">最終列車と泣き止んだ</td>\n      <td class=\"jp\">泣く ＝ 鳴く（なく）</td>\n      <td>「我不哭了」的同时也是「（列车）不响了」。末班车开走＝最后一班也不再鸣笛＝真的回不去了。一个「泣き止む」写了两件事。</td>\n    </tr>\n    <tr>\n      <td class=\"jp\">もっと縋ってよ ／ そっと塞いでよ</td>\n      <td class=\"jp\">mo-tto ／ so-tto</td>\n      <td>只换首辅音，「更多」变「轻轻」。整段语气从乞求翻成安抚，没有换任何语法。</td>\n    </tr>\n    <tr>\n      <td class=\"jp\">海の底 ／ 空の底</td>\n      <td class=\"jp\">そこ ／ そら</td>\n      <td>都是「そ」开头、两个假名。两个「底」读音几乎重叠：海的最深处和天的最远处，在耳朵里是同一个地方。</td>\n    </tr>\n  </table>\n\n  <div class=\"note\">\n    <b>怎么判断一个「双关」是真的？</b>三条标准，中三条才算硬证据：<br>\n    ① <b>同位置</b>——出现在对应段落、对应句位；<br>\n    ② <b>同句型</b>——用同一个语法框架（这里是「〜に〜れてく」）；<br>\n    ③ <b>语义接得上</b>——两个意思都要能放进上下文，不能只靠读音硬凑。<br>\n    上面「灰→藍→愛」三条全中，是真双关；「海（うみ）／産み（うみ）」只中读音一条，那叫联想，不能当结论。\n    <b>学会分清这两类，比多背十个谐音词有用。</b>\n  </div>\n</section>\n\n\u003C!-- ============ 04 ============ -->\n<section class=\"sec\" id=\"d4\">\n  <div class=\"sec-h\"><span class=\"n\">04</span><h3>语法：六组能直接搬走的</h3><span class=\"jp\">文法の骨</span></div>\n\n  <p class=\"lede tight\">\n    这一节按「用得上」排序。每组给：曲中原句 → 结构拆解 → 你自己能造的一句。\n    这些句型在 N4–N3 阅读里出现率极高，学会就能反查。\n  </p>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">て形 ＋ よ ／ ないで</span><span class=\"lab\">请求 · 禁止</span></div>\n    <div class=\"ex\">わかってよ ／ 縋ってよ ／ 塞いでよ ／ 泣いて笑ってよ</div>\n    <div class=\"ex\">笑わないで ／ 戻らないで ／ 止まらないで<i>全曲 7 次</i></div>\n    <div class=\"bd\">\n      て形单独收句＝<b>亲密关系里的请求或催促</b>，语气比「〜てください」软、比命令形暖。「ないで」＝「别…」。\n      两者都<b>只能对平辈或更亲近的人用</b>，对上司说「わかってよ」会非常失礼。\n      这首歌通篇用这一组，等于把整首歌的音量定在「对一个人说话」，而不是「对世界喊话」。\n    </div>\n    <div class=\"me\">自造：<em>ちょっと待ってよ、まだ話してないでしょ。</em>（等一下啊，我还没说完呢。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">てしまう ／ ちゃう</span><span class=\"lab\">无可挽回 · 了断</span></div>\n    <div class=\"ex\">取り去ってしまってよ ／ 逆らってしまってよ ／ 消え去ってしまってよ<i>3 次</i></div>\n    <div class=\"ex\">僕を殺しちゃった<i>ちゃう＝てしまう 的口语</i></div>\n    <div class=\"bd\">\n      「てしまう」本义是「做完」，但感情色彩是<b>「回不去了」</b>——要么遗憾，要么干脆。\n      这首歌用的是第二种：<b>「〜てしまってよ」＝「干脆…吧」</b>。\n      自己下不了手，所以求对方动手。三个「てしまってよ」连着出现，是把自己的东西一件件往外推。\n    </div>\n    <div class=\"me\">自造：<em>もう忘れてしまいたい。</em>（真想干脆忘掉。）／ <em>捨てちゃってよ。</em>（扔了吧。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">てく ／ ていく</span><span class=\"lab\">朝未来变化</span></div>\n    <div class=\"ex\">灰に塗れてく ／ 藍に呑まれてく<i>缩约形</i></div>\n    <div class=\"ex\">あの空に溺れていく<i>最后一句恢复完整形</i></div>\n    <div class=\"bd\">\n      「ていく」＝某个变化<b>朝未来持续下去</b>，和「てくる」（从过去累积到现在）相对。\n      口语里常缩成「てく」，唱起来少一拍，正好卡在四拍子的缝里。\n      注意：<b>全曲只有最后一句用了完整的「ていく」</b>——前面都在赶，最后一句放慢了，因为那是全曲的落点。\n      <b>语法形式的快慢，本身就是编曲。</b>\n    </div>\n    <div class=\"me\">自造：<em>だんだん寒くなっていく。</em>（会一点点冷下去。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">なら</span><span class=\"lab\">既然 · 如果是</span></div>\n    <div class=\"ex\">行ってしまうなら ／ こんな世界なら</div>\n    <div class=\"bd\">\n      名词或普通形 ＋ なら＝<b>承接对方（或假设）的前提，然后给出自己的判断</b>。\n      中文常译「既然…那就…」，但它比「から」少一点因果、多一点<b>「既然是那样，我也只好…」</b>的让步感。\n      两句都是「既然如此，那我就把话说绝」——这是全曲唯一在「谈条件」的地方。\n    </div>\n    <div class=\"me\">自造：<em>行くなら早く言ってよ。</em>（要去就早点说啊。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">动词普通形 ＋ 名词</span><span class=\"lab\">关系从句（重点）</span></div>\n    <div class=\"ex\">光の<b>泳ぐ</b>空 ／ 波に<b>揺らめく</b>夜の奥 ／ <b>消えない</b>君</div>\n    <div class=\"ex\">知らない人の<b>吸った</b>愛 ／ 信じてたって<b>笑う</b>ようなハッピーエンド</div>\n    <div class=\"bd\">\n      这是中文母语者最容易卡的一处：<b>日语可以把一整句塞到名词前面</b>，动词放最后。\n      「光の泳ぐ空」不是「光、游泳的天空」，而是「（其中）光在游动的天空」。\n      读法：<b>先跳到最后一个名词，再回头补前面的修饰</b>。\n      这首歌有 5 处这种长定语，密度很高——能拆开这 5 处，N3 阅读理解基本就通了。\n    </div>\n    <div class=\"me\">自造：<em>君のくれた手紙</em>（你给我的信）／ <em>雨の降る日に読む本</em>（下雨天读的书）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">のに</span><span class=\"lab\">逆接 · 不甘</span></div>\n    <div class=\"ex\">始まらない 僕はまだ忘れないのに</div>\n    <div class=\"bd\">\n      「のに」＝明明…却…，带<b>不满、遗憾、撒娇</b>。全曲只用了一次，位置在 A′ 段末尾——\n      这是整首歌唯一一次<b>直接对命运提出异议</b>。前面都在退让（だけ）、假装（なんて），到这里绷不住了。\n      <b>找一首歌的「唯一一次」，往往就找到了它的心脏。</b>\n    </div>\n    <div class=\"me\">自造：<em>頑張ったのに、間に合わなかった。</em>（明明努力了，却没赶上。）</div>\n  </div>\n</section>\n\n\u003C!-- ============ 05 ============ -->\n<section class=\"sec\" id=\"d5\">\n  <div class=\"sec-h\"><span class=\"n\">05</span><h3>语气：把大事说小，把它推开</h3><span class=\"jp\">語気</span></div>\n\n  <p class=\"lede\" style=\"margin:0 0 10px\">\n    中文表达重感情靠「加重」：太痛了、真的受不了。日语相反，靠<b>缩小</b>和<b>推开</b>。\n    这首歌把这两招用到了极致，看统计：\n  </p>\n\n  <div class=\"stats\">\n    <div class=\"st\"><div class=\"lb\">ないで<span>别…</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:100%\"></div></div><div class=\"num\">7</div></div>\n    <div class=\"st\"><div class=\"lb\">なんて<span>什么的</span></div><div class=\"track\"><div class=\"fill\" style=\"width:72%\"></div></div><div class=\"num\">5</div></div>\n    <div class=\"st\"><div class=\"lb\">てしまう<span>干脆…了</span></div><div class=\"track\"><div class=\"fill\" style=\"width:58%\"></div></div><div class=\"num\">4</div></div>\n    <div class=\"st\"><div class=\"lb\">てく<span>…下去</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:43%\"></div></div><div class=\"num\">3</div></div>\n    <div class=\"st\"><div class=\"lb\">だけ<span>只是</span></div><div class=\"track\"><div class=\"fill\" style=\"width:29%\"></div></div><div class=\"num\">2</div></div>\n    <div class=\"st\"><div class=\"lb\">のに<span>明明</span></div><div class=\"track\"><div class=\"fill\" style=\"width:14%\"></div></div><div class=\"num\">1</div></div>\n  </div>\n\n  <div class=\"note\">\n    <b>看那根最短的条。</b>「のに」只有一次。一首歌里出现频率最低的那个词，往往是最真的那句。\n    前面 6 次「别…」、5 次「什么的」都是防御，只有这 1 次「明明」是漏出来的。\n  </div>\n\n  <h4 style=\"font-size:13px;letter-spacing:.14em;color:var(--violet);margin:24px 0 8px;\">だけ：不是「只有」，是「我不敢多说」</h4>\n  <table>\n    <tr><th>原句</th><th>直译</th><th>实际在说</th></tr>\n    <tr><td class=\"jp\">君が遠のいただけ</td><td>你只是走远了而已</td><td>你抛下了我——但我不敢这么讲</td></tr>\n    <tr><td class=\"jp\">君が手を振っただけ</td><td>你只是挥了挥手而已</td><td>那是永别——但我把它降级成「挥手」</td></tr>\n  </table>\n  <p class=\"lede sm\">\n    两次「だけ」都出现在同一句位、同一个结构「君が＋动词＋だけ」。这不是巧合，是<b>同一种自我保护反复使用</b>。\n    学日语时值得记住：<b>「だけ」除了限定数量，还能限定「事情的严重程度」</b>，这是教科书很少讲、但歌里到处都是的用法。\n  </p>\n\n  <h4 style=\"font-size:13px;letter-spacing:.14em;color:var(--violet);margin:24px 0 8px;\">なんて：把不想面对的东西推开</h4>\n  <p class=\"lede sm\" style=\"margin-top:0\">\n    「涙なんて」「ハッピーエンドなんて」——「なんて」跟在名词后，等于说「那种东西」。\n    它同时做两件事：<b>引用对方的说法</b>（把话摆出来），<b>再表示轻蔑或自嘲</b>（把它推到一边）。\n    所以「涙なんて」不是「眼泪这种东西」，是「你跟我说眼泪？眼泪算什么」。\n    全曲还有 5 次单独成句的「なんて」，那是把这一整套动作压缩成一个词，直接甩在段尾。\n  </p>\n\n  <h4 style=\"font-size:13px;letter-spacing:.14em;color:var(--violet);margin:24px 0 8px;\">一个语法歧义：信じてたって笑うような</h4>\n  <div class=\"card vi\" style=\"margin:10px 0;\">\n    <p class=\"jp\" style=\"font-size:17px;color:var(--text);\">信じてたって笑うような ハッピーエンドなんて</p>\n    <table style=\"margin-top:10px;\">\n      <tr><th>解析</th><th>拆法</th><th>意思</th></tr>\n      <tr>\n        <td class=\"k\">A</td>\n        <td class=\"jp\">信じてた ＋ って（引用）＋ 笑う</td>\n        <td>（别人）会笑着说「你还真信了」的那种幸福结局</td>\n      </tr>\n      <tr>\n        <td class=\"k\">B</td>\n        <td class=\"jp\">信じてたって ＝ 信じていても（ても 的口语缩约）</td>\n        <td>就算你信，也会被笑的那种幸福结局</td>\n      </tr>\n    </table>\n    <div class=\"bd\" style=\"margin-top:12px;\">\n      <b>两种都成立，而且意思几乎一样。</b>「〜たって」在口语里就是「〜ても」（例：今さら謝ったって遅い／现在道歉也晚了）。\n      日语里「って」既是引用助词、又是「ても」的缩约，只能靠上下文判断。\n      <b>这种地方不必选一个「正确答案」——能同时看出两种读法，说明你真的读懂了日语。</b>\n    </div>\n  </div>\n</section>\n\n\u003C!-- ============ 06 ============ -->\n<section class=\"sec\" id=\"d6\">\n  <div class=\"sec-h\"><span class=\"n\">06</span><h3>主题：三个不可能的空间</h3><span class=\"jp\">主題</span></div>\n\n  <table>\n    <tr><th>意象</th><th>原句</th><th>它在做什么</th></tr>\n    <tr><td class=\"jp\">海中列車</td><td class=\"jp\">海中列車に遠のいた</td><td>海底跑火车——物理上不可能。它在提示：这不是写实场景，是梦或死后的世界。</td></tr>\n    <tr><td class=\"jp\">泡沫の庭</td><td class=\"jp\">泡沫の庭の隅</td><td>用泡沫做的庭院——一碰就没。整首歌的「家」是这个材质。</td></tr>\n    <tr><td class=\"jp\">空中散歩</td><td class=\"jp\">空中散歩の SOS</td><td>在空中走路——同样不可能。与「海中」正好上下对称。</td></tr>\n  </table>\n  <p class=\"lede sm\">\n    三个空间都「不成立」。这不是作者偷懒，是<b>明确告诉你：不要把这首歌当故事读</b>。\n    一旦你不再追问「他到底在哪儿」，剩下的就只有两件事——<b>谁走了，谁还留着</b>。\n  </p>\n\n  <div class=\"card\">\n    <h2>三层，由外到内</h2>\n    <p><b>第一层·场景：</b>海底、列车、泡沫庭院、天空。全是「留不住」的材质。</p>\n    <p><b>第二层·关系：</b>一个留下的人，一个离开的人。全曲最狠的话是「你别回来」——\n    但「戻らないで」和「戻ってこないで」不同，前者是「别回来（这里）」，后者才是「别回来（找我）」。\n    作者用的是前者：<b>他把她推开，推的却是「这里」这个地点，不是「我」这个人</b>。留了一条极细的缝。</p>\n    <p><b>第三层·自指：</b>看这三个词在同一位置的轮换——\n    <span class=\"jp\" style=\"color:var(--pink);\">僕の<mark>歌</mark>を笑わないで</span> →\n    <span class=\"jp\" style=\"color:var(--pink);\">僕の<mark>夢</mark>を笑わないで</span> →\n    <span class=\"jp\" style=\"color:var(--pink);\">そんな<mark>嘘</mark>を歌わないで</span>。\n    歌＝梦＝谎。到第三句，他自己把前两句请求过的东西，亲手叫作「谎」。\n    <b>这才是全曲真正的转折：不是她走了，是他不再为自己的歌辩护了。</b></p>\n  </div>\n\n  <div class=\"good\">\n    <b>标题就是方法论。</b>ウミユリ（海百合）不是花，是<b>棘皮动物</b>——和海星、海胆同门，\n    深海固着，长得像花，会动，会捕食。<b>它是一株「伪装成花的动物」。</b><br>\n    于是「海底譚」这个标题本身就是说明书：<b>看着像情歌，其实不是情歌</b>；\n    看着像在写她，其实在写「写歌这件事」。你若只当情歌听，听到的是失恋；\n    知道海百合是动物之后，听到的是一个人对着自己的作品说「别笑我」。\n  </div>\n\n  <div class=\"note\">\n    <b>「譚」这个字值得单独记。</b>音読み「たん」，意思是「物语、谈」——怪談（かいだん）、\n    新選組異聞（しんせんぐみいぶん）之类。用「譚」而不是「唄」「歌」，作者一开始就把它定位成「一个被讲出来的故事」，\n    而不是「一首唱出来的心情」。<b>标题选字，是日本流行歌词里最容易被忽略的一层信息。</b>\n  </div>\n</section>\n\n\u003C!-- ============ 07 ============ -->\n<section class=\"sec\" id=\"d7\">\n  <div class=\"sec-h\"><span class=\"n\">07</span><h3>跟读：它自己说了是四拍子</h3><span class=\"jp\">読み方</span></div>\n\n  <p class=\"lede\">\n    第 21 句「空中散歩と<b>四拍子</b>」不只是歌词，是作者给的节奏提示。全曲基本可以按 4 拍一组切开。\n  </p>\n\n  <table>\n    <tr><th>要点</th><th>例子</th><th>做法</th></tr>\n    <tr><td class=\"k\">促音</td><td class=\"jp\">まって／わかって／もっと／そっと</td><td>小「っ」占一整拍，必须停住。中文母语者最容易吞掉它，一吞句子就散了。</td></tr>\n    <tr><td class=\"k\">长音</td><td class=\"jp\">エスオーエス／一等星（いっとうせい）</td><td>「エスオーエス」是 6 拍，SOS 三个字母要一个个念出来，不能连成「sos」。</td></tr>\n    <tr><td class=\"k\">缩约</td><td class=\"jp\">塗れてく＝塗れていく</td><td>少一拍，正好塞进拍缝。唱的时候不要补回去。</td></tr>\n    <tr><td class=\"k\">跨行</td><td class=\"jp\">吐き出せない／泡沫の庭の隅を／光の泳ぐ空にさざめく</td><td>这是一整句被切成三行（日语叫「跨行」）。念的时候三行连成一口气，别在行末停。</td></tr>\n  </table>\n\n  <div class=\"note\">\n    <b>练法（三步，每步 3 遍）：</b><br>\n    ① 只念假名（r 行），不管意思，先把促音和长音念准；<br>\n    ② 边念边看汉字，确认每个汉字的读音对得上；<br>\n    ③ 跟唱，但只跟 A 段和 F 段——它们几乎一样，跟会一段等于会两段。\n  </div>\n</section>\n\n\u003C!-- ============ 08 ============ -->\n<section class=\"sec\" id=\"d8\">\n  <div class=\"sec-h\"><span class=\"n\">08</span><h3>改词练习：把骨架换成你自己的</h3><span class=\"jp\">練習</span></div>\n\n  <p class=\"lede\">\n    最有效的记忆方式不是背原句，是<b>用同一个骨架造自己的句子</b>。十题，先自己写，再看答案。\n    写不出来就回去看第 04 节对应的卡片。\n  </p>\n\n  <div class=\"q\">\n    <div class=\"no\">Q1 ／ 请求</div>\n    <div class=\"ask\">「别笑我的发音。」用「〜を笑わないで」。</div>\n    <div class=\"stem\">僕の（　　　）を笑わないで</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>僕の発音を笑わないで。</b>（ぼくのはつおんをわらわないで）</p>\n      <p>「発音」はつおん。注意不是「はついん」。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q2 ／ 被吞没</div>\n    <div class=\"ask\">「被工作吞没了。」用「〜に呑まれてく」。</div>\n    <div class=\"stem\">仕事に（　　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>仕事に呑まれてく。</b>（しごとにのまれてく）</p>\n      <p>「呑まれる」是「飲まれる」的表记变体，意思一样：被吞掉、被淹没。日常也可以说「仕事に追われる」，但「呑まれる」更重。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q3 ／ 干脆</div>\n    <div class=\"ask\">「干脆忘掉吧。」用「〜てしまってよ」。</div>\n    <div class=\"stem\">もう（　　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>もう忘れてしまってよ。</b>（もうわすれてしまってよ）</p>\n      <p>「てしまってよ」＝求对方「干脆…」。自己说不出口，所以让别人动手——这个语感是这首歌教的最实用的一条。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q4 ／ 条件</div>\n    <div class=\"ask\">「既然要走，那就把我的照片也带走。」前半用「〜なら」。</div>\n    <div class=\"stem\">行ってしまう（　　）、写真も持って行って</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>行ってしまうなら、写真も持って行って。</b></p>\n      <p>「なら」承接前提。「持って行って」也是て形请求，和全曲的语气一致。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q5 ／ 只是</div>\n    <div class=\"ask\">「他只是睡着了而已。」用「〜だけ」，注意「だけ」放在句末。</div>\n    <div class=\"stem\">彼は（　　　）だけ</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>彼は寝ていただけ。</b>（かれはねていただけ）</p>\n      <p>「寝ている」的过去形「寝ていた」＋だけ。和「遠のいただけ」同一个结构：把一件大事降级成「只是」。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q6 ／ 不甘</div>\n    <div class=\"ask\">「明明约好了，却没来。」用「〜のに」。</div>\n    <div class=\"stem\">約束した（　　）、来なかった</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>約束したのに、来なかった。</b></p>\n      <p>「のに」前面接普通形（过去式「した」）。语气带不满，不能对上级用。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q7 ／ 目的</div>\n    <div class=\"ask\">「为了不被听见，小声笑了。」用「〜ないように」。</div>\n    <div class=\"stem\">聞こえない（　　）笑ってた</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>聞こえないように笑ってた。</b></p>\n      <p>「〜ように」表目的：「为了达到某状态」。原曲是「聞こえないように笑ってんの」，「んの」＝「の」的口语。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q8 ／ 关系从句</div>\n    <div class=\"ask\">「会唱歌的鱼」。把整句塞到「魚」前面。</div>\n    <div class=\"stem\">（　　　）魚</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>歌を歌う魚。</b>（うたをうたうさかな）</p>\n      <p>动词普通形直接贴名词，中间不加「の」。这是本曲最密集的语法，也是 N3 阅读的分水岭。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q9 ／ 推开</div>\n    <div class=\"ask\">「考试什么的，无所谓。」用「なんて」。</div>\n    <div class=\"stem\">試験（　　）、どうでもいい</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>試験なんて、どうでもいい。</b></p>\n      <p>「なんて」＝把话题推开并带轻蔑。「どうでもいい」是「随便、无所谓」。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q10 ／ 变化趋向</div>\n    <div class=\"ask\">「会一点点冷下去。」用「〜ていく」。</div>\n    <div class=\"stem\">だんだん寒く（　　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>だんだん寒くなっていく。</b></p>\n      <p>い形容词→「寒くなる」＋ていく。口语可缩成「寒くなってく」，和原曲的「塗れてく」同一个操作。</p>\n    </div></details>\n  </div>\n</section>\n\n\u003C!-- ============ 09 ============ -->\n<section class=\"sec\" id=\"d9\">\n  <div class=\"sec-h\"><span class=\"n\">09</span><h3>可迁移清单：二十条，直接背</h3><span class=\"jp\">持ち帰り</span></div>\n\n  <p class=\"lede\">\n    全部出自本曲。左边是句型，中间是你以后能套的场景，右边是曲中原句（方便回去对）。\n  </p>\n\n  <table>\n    <tr><th>#</th><th>句型</th><th>意思 / 能用在</th><th>曲中出处</th></tr>\n    <tr><td class=\"k\">01</td><td class=\"jp\">〜てよ</td><td>（亲近的人之间）求你…</td><td class=\"jp\">わかってよ</td></tr>\n    <tr><td class=\"k\">02</td><td class=\"jp\">〜ないで</td><td>别…</td><td class=\"jp\">笑わないで</td></tr>\n    <tr><td class=\"k\">03</td><td class=\"jp\">〜てしまってよ</td><td>干脆…吧（让别人动手）</td><td class=\"jp\">取り去ってしまってよ</td></tr>\n    <tr><td class=\"k\">04</td><td class=\"jp\">〜てく／ていく</td><td>朝未来一点点…下去</td><td class=\"jp\">藍に呑まれてく</td></tr>\n    <tr><td class=\"k\">05</td><td class=\"jp\">〜なら</td><td>既然…／如果是…</td><td class=\"jp\">行ってしまうなら</td></tr>\n    <tr><td class=\"k\">06</td><td class=\"jp\">〜のに</td><td>明明…却（不满）</td><td class=\"jp\">忘れないのに</td></tr>\n    <tr><td class=\"k\">07</td><td class=\"jp\">〜だけ</td><td>只是…（也可降级严重程度）</td><td class=\"jp\">遠のいただけ</td></tr>\n    <tr><td class=\"k\">08</td><td class=\"jp\">〜なんて</td><td>…什么的（轻蔑 / 自嘲）</td><td class=\"jp\">涙なんて</td></tr>\n    <tr><td class=\"k\">09</td><td class=\"jp\">〜ように</td><td>为了…（达到某状态）</td><td class=\"jp\">聞こえないように</td></tr>\n    <tr><td class=\"k\">10</td><td class=\"jp\">〜てしまう／ちゃう</td><td>（无可挽回地）…了</td><td class=\"jp\">殺しちゃった</td></tr>\n    <tr><td class=\"k\">11</td><td class=\"jp\">动词普通形＋名</td><td>关系从句（长定语）</td><td class=\"jp\">光の泳ぐ空</td></tr>\n    <tr><td class=\"k\">12</td><td class=\"jp\">〜てんの</td><td>＝〜ているの（口语）</td><td class=\"jp\">笑ってんの</td></tr>\n    <tr><td class=\"k\">13</td><td class=\"jp\">〜たって</td><td>＝〜ても（口语）</td><td class=\"jp\">信じてたって</td></tr>\n    <tr><td class=\"k\">14</td><td class=\"jp\">縋る（すがる）</td><td>缠着、依赖（N2）</td><td class=\"jp\">もっと縋ってよ</td></tr>\n    <tr><td class=\"k\">15</td><td class=\"jp\">塞ぐ（ふさぐ）</td><td>堵住、捂住</td><td class=\"jp\">そっと塞いでよ</td></tr>\n    <tr><td class=\"k\">16</td><td class=\"jp\">逆らう（さからう）</td><td>反抗</td><td class=\"jp\">逆らってしまってよ</td></tr>\n    <tr><td class=\"k\">17</td><td class=\"jp\">遠のく（とおのく）</td><td>远去、渐渐疏远</td><td class=\"jp\">遠のいた</td></tr>\n    <tr><td class=\"k\">18</td><td class=\"jp\">塗れる（まみれる）</td><td>沾满（血、泥、灰）</td><td class=\"jp\">灰に塗れてく</td></tr>\n    <tr><td class=\"k\">19</td><td class=\"jp\">泡沫（うたかた）</td><td>泡影、虚幻（文学语）</td><td class=\"jp\">泡沫の庭</td></tr>\n    <tr><td class=\"k\">20</td><td class=\"jp\">嗚咽（おえつ）</td><td>呜咽（书面语）</td><td class=\"jp\">君の嗚咽</td></tr>\n  </table>\n\n  <div class=\"warn\">\n    <b>三个最容易读错的，单独盯住：</b><br>\n    塗れる → <b>まみれる</b>（不是「ぬれる」，ぬれる 是「濡れる」＝淋湿）<br>\n    泡沫 → <b>うたかた</b>（不是「ほうまつ」，ほうまつ 是物理上的泡沫）<br>\n    縋る → <b>すがる</b>（不是「たぐる」）<br>\n    这三个词都是「汉字看着眼熟、读音完全不同」的类型，考试爱考，歌里出现是白送的分。\n  </div>\n</section>\n\n<div class=\"card ok\">\n  <h2>最后一句：这首歌到底在讲什么</h2>\n  <p>不是「她走了我很痛」。是——</p>\n  <p><b>一个人把自己的歌交出去，先求别人别笑，再改口说「别唱那种谎」，最后承认自己是在灰里画梦。</b></p>\n  <p>她走只是背景。<b>真正的情节是他对自己作品的态度，从辩护，到怀疑，到亲手作废。</b></p>\n  <p>所以最后一句才是「あの空に溺れていく」——他不是沉进海里，是沉进自己画的那片天空。\n  <b>淹死他的不是失恋，是他自己造的那个梦。</b>海百合长得像花，可它是动物；这首歌听着像情歌，可它在讲创作。</p>\n</div>"
  },

   "cardsTopHtml": "<div class=\"card ok\">\n<h2>先说实话：这首歌的真实难度</h2>\n<p>句子骨架其实不深——て形、被动、使役、ぬ＝ない，全在 <b>N4</b> 射程内。真正堆在门口的是<b>文学词汇</b>：紅霞、紅塵、漲る、冴える、躊躇う、瞬かせて……这是 2005 年 I've 系动画歌的标配：词难、句短、信息密。</p><p>但这首歌有一张全场最强的牌：<b>当字（あてじ）</b>——汉字写 A、读音是 B。記憶唱作とき、結末唱作みらい、一身唱作み。看不懂不是你词汇量的问题，是作者故意让汉字管意思、假名管发音。</p><p><b>建议路线：</b>先看下面两张当字卡和读音陷阱卡 → 再逐句。直接硬读，你会以为自己在读加密文件。</p>\n</div>\n\n<div class=\"card cy\">\n<h2>当字三连：这首歌的隐藏主线</h2>\n<table class=\"sx\"><thead><tr><th>歌词写法</th><th>实际读音</th><th>为什么这样写</th></tr></thead><tbody>\n<tr><td class=\"a\">一身（み）</td><td class=\"b\">み</td><td class=\"c\">一身 本读 いっしん，这里只取一个 身（み）字单念。『用这副身躯』——把成语拆成单字，重量翻倍。首尾各出现一次</td></tr>\n<tr><td class=\"a\">記憶（とき）</td><td class=\"b\">とき</td><td class=\"c\">记忆＝时刻。记忆的本质就是逝去的时间，作者把两个词焊在一起：看到的是记忆，听到的是时间</td></tr>\n<tr><td class=\"a\">結末（みらい）</td><td class=\"b\">みらい</td><td class=\"c\">结局＝未来。『反正结局都一样』——当字一用，宿命感直接焊死在发音里</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>一个「紅」字，四种读音（外加标题也不安分）</h2>\n<table class=\"sx\"><thead><tr><th>写法</th><th>读音</th><th>出现处与说明</th></tr></thead><tbody>\n<tr><td class=\"a\">紅（くれない）</td><td class=\"b\">くれない</td><td class=\"c\">そして紅 紅塵を撒き——深红、绯红，红色染料的古称</td></tr>\n<tr><td class=\"a\">紅（くれ）る</td><td class=\"b\">くれる</td><td class=\"c\">紅る世界——染红。和 暮れる（日暮）同音：天红＝天晚，一音双关</td></tr>\n<tr><td class=\"a\">紅霞（こうか）</td><td class=\"b\">こうか</td><td class=\"c\">紅霞を溶かし——红色霞光，文学词</td></tr>\n<tr><td class=\"a\">紅塵（こうじん）</td><td class=\"b\">こうじん</td><td class=\"c\">紅塵を撒き——红尘（佛教语：现世），字面是红色的尘土</td></tr>\n<tr><td class=\"a\">緋色（ひしょく）</td><td class=\"b\">ひしょく</td><td class=\"c\">标题本身！正式注音 ひしょく，但日常口语常读 ひいろ——歌名自己就有两读</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>五个读音陷阱（汉字会骗你 II）</h2>\n<table class=\"sx\"><thead><tr><th>歌词里的写法</th><th>实际读音</th><th>为什么坑</th></tr></thead><tbody>\n<tr><td class=\"a\">躊躇った</td><td class=\"b\">ためらった</td><td class=\"c\">躊躇 音读是 ちゅうちょ，训读才是 ためらう。ためらう→ためらった 促音便</td></tr>\n<tr><td class=\"a\">漲る</td><td class=\"b\">みなぎる</td><td class=\"c\">不是 ちょう。原义涨水，引申为满腔、充盈。N2 读音考题常客</td></tr>\n<tr><td class=\"a\">冴える</td><td class=\"b\">さえる</td><td class=\"c\">不是 こう。刀の冴える＝寒光凛冽；頭が冴える＝头脑清醒</td></tr>\n<tr><td class=\"a\">瞬かせて</td><td class=\"b\">またたかせて</td><td class=\"c\">瞬く＝またたく（眨眼、闪烁），不读 しゅん</td></tr>\n<tr><td class=\"a\">斬る</td><td class=\"b\">きる</td><td class=\"c\">和 切る 同音，但 斬る 专指用刀砍——用字自带杀气</td></tr>\n</tbody></table>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>全曲的对称结构：冷与热、暗与光、だけ与まで</h2>\n<table class=\"sx\"><thead><tr><th>对照</th><th>A 侧</th><th>B 侧</th><th>在说什么</th></tr></thead><tbody>\n<tr><td class=\"a\">强与弱</td><td class=\"b\">熱く揺るがす「強さ」</td><td class=\"c\">儚く揺れる「弱さ」</td><td class=\"c\">同一副骨架，他动词向外撼动、自动词向内摇晃</td></tr>\n<tr><td class=\"a\">火与火</td><td class=\"b\">現れる陽（ひ）</td><td class=\"c\">また灯（ひ）が一つ</td><td class=\"c\">天上的太阳是人间的灯——夏娜世界观里人命即火炬</td></tr>\n<tr><td class=\"a\">冷与热</td><td class=\"b\">焼けた雲</td><td class=\"c\">冴える刃</td><td class=\"c\">被灼烧的云是心愿在烧；寒光凛冽的刀是使命在握</td></tr>\n<tr><td class=\"a\">暗与光</td><td class=\"b\">闇を斬る</td><td class=\"c\">胸の奥の光</td><td class=\"c\">先劈开黑暗，再点亮心光——战斗与守望是同一件事</td></tr>\n<tr><td class=\"a\">起点与终点</td><td class=\"b\">進むだけ（只是前进）</td><td class=\"c\">果たしてゆくまで（直到完成）</td><td class=\"c\">开场没有目标，结尾有了终点——全曲真正的成长弧</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>文语速查：四个等式通吃全曲</h2>\n<table class=\"sx\"><thead><tr><th>文语</th><th>现代语</th><th>曲中出处</th></tr></thead><tbody>\n<tr><td class=\"a\">〜ぬ</td><td class=\"b\">＝〜ない</td><td class=\"c\">変わらぬ日々＝変わらない日々</td></tr>\n<tr><td class=\"a\">〜ゆく</td><td class=\"b\">＝〜いく</td><td class=\"c\">消えゆく／果たしてゆく</td></tr>\n<tr><td class=\"a\">連用中止（〜し）</td><td class=\"b\">＝〜て，句中停顿</td><td class=\"c\">溶かし・撒き・迷い・戸惑い——四个动作连着甩，全不收尾</td></tr>\n<tr><td class=\"a\">た形＋名词</td><td class=\"b\">动词直接修饰名词</td><td class=\"c\">消えた現実／躊躇った瞳／舞い降りた地</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>三分钟词汇账（先背这些就够读一半）</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">红色系</div><div class=\"d\">緋色（ひしょく）・紅（くれない）・紅る（くれる）・紅霞（こうか）・紅塵（こうじん）</div><div class=\"ex\">整首歌就是一个红色的宇宙，<span>标题即答案</span></div></div>\n<div class=\"mini\"><div class=\"t\">战斗系</div><div class=\"d\">斬る（きる）・刺す（さす）・刃（やいば）・舞い降りる・振り斬る</div><div class=\"ex\">把打斗写成风景，<span>动作全是画面</span></div></div>\n<div class=\"mini\"><div class=\"t\">情绪系</div><div class=\"d\">高鳴る・迷う・戸惑う・躊躇う・焦がす・疼く系 痛み</div><div class=\"ex\">夏娜的心事全在这几个词里，<span>焦がす 是灵魂</span></div></div>\n<div class=\"mini\"><div class=\"t\">必背句型</div><div class=\"d\">〜を〜に変える・〜だす（突然开始）・ぬ＝ない・〜てゆくだけ／まで</div><div class=\"ex\">拿走 <span>涙を力に変える</span> 就够本</div></div>\n</div>\n</div>"
