   "cardsTopHtml": "<div class=\"card ok\">\n<h2>先说实话：这首歌难在哪</h2>\n<p>句子骨架对你来说很友好——<b>て形、ない形、た形、～し、～から</b>基本都是 N5–N4 射程。真正卡人的是另外三样：</p><p><b>一、口语缩约（脱落）</b>。歌里<b>几乎全用口语收缩形</b>：置いていった → <b>置いてった</b>、飛んでいった → <b>飛んでった</b>、終わっていく → <b>終わってく</b>、探している → <b>探してる</b>。中间那个「い」被吃掉是日语口语的常规操作，但你如果在字典里查「おいてった」一定查不到。这是<b>听力第一杀手</b>，值得单独记。</p><p><b>二、惯用句密集</b>。当たり障りがない、道草を食う、下積み、空騒ぎ、命取り、棚に上げる、骨が折れる——这七家伙出现二十多处，而且全是<b>日本初高中生就会、外国学习者没听过</b>的那类。</p><p><b>三、ACAね 的造词</b>。愛闇＝アイシャドウ、ジェメオス＝涂鸦双人组、ステンバイミー＝stand by me。这些不是你词汇量的问题，是作者故意难为读者。</p><p><b>建议路线：</b>先把下面三张速查卡（口语缩约 / 惯用句 / 造词）过一遍 → 再逐句。顺序倒过来会被卡得很难看。</p>\n</div>\n\n<div class=\"card cy\">\n<h2>造词与当字：ACAね 的四个暗号</h2>\n<table class=\"sx\"><thead><tr><th>歌词写法</th><th>实际读音</th><th>是什么 / 为什么要这样写</th></tr></thead><tbody>\n<tr><td class=\"a\">愛闇</td><td class=\"b\">アイシャドウ</td><td class=\"c\">当字（当て字）。「愛」取音读 ai、「闇」管意思（＝影/暗）。整词＝eyeshadow 眼影。作者不写片假名，偏要用两个汉字拼出这个外来语，是ずとまよ的标志手法</td></tr>\n<tr><td class=\"a\">ジェメオス</td><td class=\"b\">ジェメオス</td><td class=\"c\">巴西圣保罗的涂鸦艺术家双人组 <b>Os Gêmeos</b>（葡萄牙语「双子」），作品遍布全球。<b>配合下一句理解</b>：这是 Street art 的语境</td></tr>\n<tr><td class=\"a\">ステンバイミー</td><td class=\"b\">スタンド・バイ・ミー</td><td class=\"c\">Stand by me（站在我这边）。刻意写成「ステン」而不是标准的「スタンド・バイ・ミー」，压缩成一句话的长度</td></tr>\n<tr><td class=\"a\">ファッション</td><td class=\"b\">ふぁっしょん</td><td class=\"c\">外来语</td><td class=\"c\">时装、穿搭＝自我表达的外壳</td><td class=\"c\">这首歌里它不是「好看的衣服」，而是把情绪发散出去的容器——与上一句的「言葉」并列</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card hot\">\n<h2>口语缩约对照表（这首歌的听力命门）</h2>\n<table class=\"sx\"><thead><tr><th>歌里写的</th><th>还原后</th><th>脱落了什么</th></tr></thead><tbody>\n<tr><td class=\"a\">置いてった</td><td class=\"b\">置いていった</td><td class=\"c\">「い」脱落：〜てしまう/〜ていく 的口语音便。同型还有「置いてく」「置いてった」</td></tr>\n<tr><td class=\"a\">飛んでった</td><td class=\"b\">飛んでいった</td><td class=\"c\">同上。注意不是「跳んでった」，动词是<b>飛ぶ</b></td></tr>\n<tr><td class=\"a\">終わってく</td><td class=\"b\">終わっていく</td><td class=\"c\">「いく」被压缩成「く」。<b>〜ていく</b>＝逐渐……下去（表示状态持续走向某方向）</td></tr>\n<tr><td class=\"a\">探してる</td><td class=\"b\">探している</td><td class=\"c\">ている → てる，日常会话标准操作</td></tr>\n<tr><td class=\"a\">わからなすぎ</td><td class=\"b\">わからなすぎる</td><td class=\"c\">〜すぎる 变名词用法，后面直接挂「問題」</td></tr>\n<tr><td class=\"a\">気づいてない</td><td class=\"b\">気づいていない</td><td class=\"c\">「ていない」→「てない」：进行/否定的口语压缩，全曲出现两次</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>七个惯用句，听不懂就整首垮一半</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">当たり障りがない</div><div class=\"d\">不得罪人、不痛不痒、没棱角。字面「没有会磕碰的地方」，形容一个人/一句话<b>安全到毫无内容</b>。</div><div class=\"ex\">当たり障りのない儀式みたいな　→　像例行仪式一样毫无内容</div></div>\n<div class=\"mini\"><div class=\"t\">道草を食う</div><div class=\"d\">在路上耽搁、闲逛再回来（原义：马在路上吃草耽误行程）。这首歌里说这是<b>贅沢</b>，即「能在路上瞎逛简直是奢侈」。</div><div class=\"ex\">道草食って帰る　→　路上晃一圈再回家</div></div>\n<div class=\"mini\"><div class=\"t\">下積み</div><div class=\"d\">在底层苦干、寂寂无闻地打基础（演艺圈/手艺行当的用词）。下積み正義＝<b>「埋头苦干才是正义」那套说教</b>。</div><div class=\"ex\">下積み正義　→　吃苦当正义</div></div>\n<div class=\"mini\"><div class=\"t\">空騒ぎ</div><div class=\"d\">からさわぎ。瞎起哄、白忙一场、虚张声势的热闹。<b>『冷や水』不同</b>——这是「六曜都是一个人在吵」的意思。</div><div class=\"ex\">シャイな空騒ぎ　→　怯场却还要跟着起哄</div></div>\n<div class=\"mini\"><div class=\"t\">命取り</div><div class=\"d\">いのちとり。致命的、要命的（不一定真死，指导致失败的致命偏差）。</div><div class=\"ex\">小さな誤解が命取り　→　一点点误会就要命</div></div>\n<div class=\"mini\"><div class=\"t\">棚に上げる</div><div class=\"d\">把自己的问题放到一边不予理会＝<b>对自己宽容</b>。完整形：自分のことは棚に上げる。</div><div class=\"ex\">自分棚に上げすぎ　→　对自己太宽容了</div></div>\n<div class=\"mini\"><div class=\"t\">骨が折れる</div><div class=\"d\">惯用句：费力气、辛苦。<b>这首歌最后一行双关</b>——字面是「笑到肋骨折」，惯用是「竭尽全力」。</div><div class=\"ex\">あばらの骨が折れるまで　→　到肋骨折为止</div></div>\n</div>\n</div>",
   "cardsBottomHtml": "<div class=\"card hot\">\n<h2>四组替换：这首歌真正的修辞手法</h2>\n<table class=\"sx\"><thead><tr><th>位置</th><th>第一次</th><th>第二次</th><th>作者想说什么</th></tr></thead><tbody>\n<tr><td class=\"a\">副歌 A／B</td><td class=\"b\">ねばった<b>戦績</b>（せんせき）</td><td class=\"c\">ねばった<b>成績</b>（せいせき）</td><td class=\"c\">戦績＝战斗/游戏战绩（呼应 PSO2 合作），成績＝考试成绩。同一句滚两遍，<b>把「战绩」和「成绩」焊在一起</b>：在这个世界里，你的人生打算和你的战斗数据是一回事</td></tr>\n<tr><td class=\"a\">最后一次副歌</td><td class=\"b\">なりたい自分に絡まる<b>電柱</b></td><td class=\"c\">なりたい自分に絡まる<b>連中</b></td><td class=\"c\"><b>全曲最重要的一处改动</b>。前五遍副歌缠住「想成为的自己」的是<b>电线杆</b>（无生命的障碍物）；最后一次换成了<b>连中</b>（＝那群家伙、あいつら）。绕了三分钟才承认：挡路的一直是人</td></tr>\n<tr><td class=\"a\">第三幕 对句</td><td class=\"b\"><b>どう</b>でもいいから置いてった</td><td class=\"c\"><b>そう</b>でもないから飛んでった</td><td class=\"c\">どう↔そう、置いて↔飛んで。<b>只换两个词，意义颠倒</b>：前面是「无所谓，所以我放下了」，后面是「并非无所谓，所以我飞走」——上一句的逞强在这里被自己推翻</td></tr>\n<tr><td class=\"a\">结尾两句</td><td class=\"b\"><b>言</b>い切れることはない</td><td class=\"c\"><b>いい</b>切れたことは自分に言い聞かせてること</td><td class=\"c\">第一行用汉字「言い切れる」（断言），第二行改写成平假名「いい切れた」，<b>让「いい（好）」乘机混进来</b>：那些斩钉截铁的话，只是反复催眠自己「这样就好」</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>「ゆうもわな」——官方没给写法的一个词</h2>\n<p>「ジェメオスよりもゆうもわな落書きに」是全曲唯一<b>官方歌词本没公布汉字写法</b>的一句，目前有两派解读：</p><p><b>A 派（口语收缩说）：</b>ゆうもわな ← 「言うほどでもない」（いうほどでもない）。<b>いうほ</b>→ゆうも、<b>でもない</b>→わな，被口胡一样的连贯发音压成一团。意思是「说了也没什么大不了 / 不值一提」，整句＝<b>「比起 Os Gêmeos 的涂鸦，我更在意那种没人当回事的涂鸦」</b>。</p><p><b>B 派（嵌字说）：</b>「優（ゆう）も罠（わな）」——连「优秀」本身也是一种陷阱。这派与下一句「下積み正義」衔接更顺：正因为不迷信优秀，才有资格丢掉那套吃苦哲学。</p><p>本页<b>保留假名原文</b>不强行汉字化——这是负责任的做法。你只要记住它大概在说「不值一提 / 当回事就输了」即可。</p>\n</div>\n\n<div class=\"card ok\">\n<h2>这首歌能搬走的六个句型</h2>\n<div class=\"g\"><b>① 置いてった／飛んでった（〜ていく 的口语缩约）</b><br>置いていった・飛んでいった → <b>置いてった・飛んでった</b>。<br>公式：<b>〜ていく → 〜てった／〜てく</b>（中间的「い」脱落）。<br>你的句子：財布を忘れてった（我把钱包落那儿了）。<br><span class=\"dim\">口语里极其常见，听力必考，但写作不要用。</span></div>\n<div class=\"g\"><b>② 〜たって／〜なくたって（＝ても／なくても）</b><br>誰を批判しなくたって → 「即使不去批判任何人」。<br>公式：<b>动词ない形的く → たって</b>（行かなくたって＝即使不去）。<br>比「ても」更<b>口语、更带赌气感</b>。</div>\n<div class=\"g\"><b>③ 名词止め（不用动词也能结句）</b><br>あいつら全員同窓会＝「那群人全跑去开同学会了」，句子最后是<b>名词直接结句（名词止め）</b>，没有动词。<br>效果：留下画面、制造余味；抒情歌词和标题最爱用。</div>\n<div class=\"g\"><b>④ 〜でしかない（不过只是……）</b><br>想像は想像でしかないし → 「想象终究<b>只是</b>想象」。<br>公式：<b>N／ナ形词干 + でしかない</b>＝不过只是……（带贬义的限定）。<br>N3 语法，这首歌用得极熟：先承认局限，再顺势把所有东西拆台。</div>\n<div class=\"g\"><b>⑤ 棚に上げる（对自己宽容）</b><br>人のダメなとこばっか見つけて／指摘して、自分<b>棚に上げすぎ</b> → 「净盯着别人的毛病指指点点，对自己却过度宽容」。<br>完整形：<b>自分のことは棚に上げる</b>（把自己的问题搁到架子上不予理会）。<br>建议整句背下来，<b>吐槽时的万能句</b>。</div>\n<div class=\"g\"><b>⑥ 〜まで（到……为止）</b><br>あばらの骨が折れるまで → 「直到肋骨折」。<br>公式：<b>动词辞书形 + まで</b>＝直到……为止。<br>この曲的出现形式是夸张：笑的时间长度被夸张到身体出ダメージ为止。</div>\n</div>"

   "cardsTopHtml": "<div class=\"card hot\">\n<h2>先说清楚：这首歌唱的不是上海，是「听不懂」</h2>\n<p>整首歌只有一个场景：一个人到了上海，下飞机二十分钟就彻底迷路——行李不见、车票不知去向、被人架着举手投降。剩下的三分钟，全是她在跟这座城市<b>讨价还价</b>。</p><p>歌词密度不高，但有两个坑必须提前排掉：</p><p>① <b>全曲是谐音搭起来的</b>——<b>について</b>（关于／到了）、<b>さんはい</b>（三拜／三杯）与<b>しゃんはい</b>（上海）、<b>うっかり</b> 与 <b>すっかり</b>。听不懂不是因为语法难，是因为<i>它在玩声音</i>。</p><p>② <b>口语黏连很多</b>——「どこだが分からない」「ついてく」这类写法在教科书里查不到，是作者故意把话说糊。别怀疑自己的语法书。</p><p><b>建议用法：</b>先只读带 <b>N5</b> / <b>N4</b> 徽章的句子，把场景在脑子里摆出来；再用顶栏搜索框搜「にっち」「ちょうだい」「案内」，把三个反复出现的词组拎出来。这一首的爽点不在单词量，在<b>听懂那个人在耍你</b>。</p>\n</div>\n\n<div class=\"card\">\n<h2>N4–N5 生存指南：这首歌里反复出现的 8 个套路</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">①「について」的两个意思</div><div class=\"d\">书面是「关于…」，唱出来是「<b>着いて</b>」＝到达。全曲第一句就在骗耳朵：上海<b>について</b>20分＝到上海才二十分钟。</div><div class=\"ex\">上海について20分 ／ 日本のアニメについて話す</div></div>\n<div class=\"mini\"><div class=\"t\">② にっちもさっちもいかない</div><div class=\"d\">「进退两难、一筹莫展」。来自算盘口诀「二進も三進も」，本是除不尽的死局，现在只当固定说法用。</div><div class=\"ex\">にっちもさっちもいかなくて</div></div>\n<div class=\"mini\"><div class=\"t\">③ させられる（使役受身）</div><div class=\"d\">「被迫做」。万歳<b>させられてる</b>＝被人架着举起手（投降）。日语里最委屈的一个形式：动作不是我做的，责任也不在我。</div><div class=\"ex\">万歳させられてるけど</div></div>\n<div class=\"mini\"><div class=\"t\">④ 〜じゃないし</div><div class=\"d\">「又不是…啊」。<b>し</b> 把话尾一收，语气变成吐槽＋留白。全曲的叛逆都靠这个「し」。</div><div class=\"ex\">差し出す命じゃないし</div></div>\n<div class=\"mini\"><div class=\"t\">⑤ 〜ほどではない</div><div class=\"d\">「还没到…的地步」。被人说要带路，回答「<b>ついてくほどではない</b>」＝我还没沦落到要人带路。含蓄地拒绝。</div><div class=\"ex\">ついてくほどではないし</div></div>\n<div class=\"mini\"><div class=\"t\">⑥ 身体惯用句</div><div class=\"d\"><b>頭を抱える</b>＝抱头苦恼；<b>小首をかしげる</b>＝歪头疑惑；<b>身に覚えがない</b>＝我没印象。日语的情绪多半写在身体上。</div><div class=\"ex\">頭を抱えて叫んだ ／ 小首をかしげて唸った</div></div>\n<div class=\"mini\"><div class=\"t\">⑦ あんあん 是拟声</div><div class=\"d\">不是「安」，是哼唧/呻吟的拟声词。副歌的每一句都由它开头，像被人戳了一下就出声。</div><div class=\"ex\">あんあん　あんあん　うっかりとびでたあいつ</div></div>\n<div class=\"mini\"><div class=\"t\">⑧ うっかり / すっかり / しゃんはい</div><div class=\"d\">副歌里 <b>うっかり</b>（不留神）到第二段变成 <b>すっかり</b>（    "cardsTopHtml": "<div class=\"card hot\">\n<h2>先说清楚：这首歌的歌名本身就是一个双关</h2>\n<p><b>アルクアラウンド</b>＝<b>歩く</b>（あるく，走）＋<b>around</b>（绕圈）。不是「走秀」，是「绕着走」——全曲的结构也真的是一圈：走着出发 → 在涌里绕 → 又走起来。</p><p>歌词只有 26 句（4 分 26 秒里大半是人声之外的器乐），但三个坑必须先排掉：</p><p>① <b>三个文语／拟态词</b>——<b>つれづれ</b>（无事可做）、<b>しらしらと</b>（白蒙蒙）、<b>つらつらと</b>（漫不经心，但也有「仔细」的相反义）。这三个词全曲各出现一到两次，跳过它们等于跳过这首歌的词。</p><p>② <b>一句文语</b>——「〜になりにけり」里的<b>けり</b>是古典助动词，表咏叹／回望。</p><p>③ <b>一个动词替换</b>——第一遍副歌「歩き回る」，第二遍「泳ぎ回る」，最后一遍把「終わらせる」改写成「今始まる」。这三处才是全曲真正的叙事。</p><p><b>建议用法：</b>先只读带 <b>N5</b>／<b>N4</b> 徽章的行，把「走路—叹息—绕圈」的画面立起来；再从头看副歌的三次变体。这首歌的难点不在词汇量，在<b>它一直重复同一句，却从不给你同一个意思</b>。</p>\n</div>\n\n<div class=\"cardNone\">\n<h2>核心词 8 个：看懂这八个，全曲就通了</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">歩く（あるく）</div><div class=\"d\">走。<b>全曲出现 6 次</b>，是节拍器，不是信息。</div><div class=\"ex\">歩き回る（绕圈走）／歩き始める（开始走）</div></div>\n<div class=\"mini\"><div class=\"t\">つれづれ（な）</div><div class=\"d\">无所事事、闲得发慌。文语「つれづれなり」，现代多写「徒然」。<b>不是「无聊」那么轻</b>，是「任时间流走」。</div><div class=\"ex\">つれづれな日／《徒然草》＝闲来无事写下的东西</div></div>\n<div class=\"mini\"><div class=\"t\">しらしらと</div><div class=\"d\">白而微明，多写天将亮或月光泛白。<b>不是「白色」</b>，是「白得还没暖起来」。</div><div class=\"ex\">夜の明かりしらしらと／注意别和「しらしらしい」混</div></div>\n<div class=\"mini\"><div class=\"t\">つらつらと</div><div class=\"d\">① 漫不经心 ② 仔细地。<b>同一个词两个相反义</b>，全靠上下文定；这里是①。</div><div class=\"ex\">つらつら考える＝随便想想／也＝细细思量</div></div>\n<div class=\"mini\"><div class=\"t\">うねり</div><div class=\"d\">涌、起伏。<b>うねる</b>（蜿蜒、起伏）的名词形；海面用，人心也用。</div><div class=\"ex\">うねりの中を歩き回る／泳ぎ回る</div></div>\n<div class=\"mini\"><div class=\"t\">揺らす／揺れる</div><div class=\"d\">摇（他动）／摇（自动）。第 13、14 句<b>成对出现</b>，一个「你摇我」，一个「我和你一起摇」。</div><div class=\"ex\">正しく僕を揺らす／正しく君と揺れる</div></div>\n<div class=\"mini\"><div class=\"t\">終わらせる／始まる</div><div class=\"d\">使它结束（使役）／自己开始（自动）。<b>全曲的答案就藏在这对词的互换里</b>。</div><div class=\"ex\">終わらせる意味 → 今始まる意味</div></div>\n<div class=\"mini\"><div class=\"t\">〜ようになる</div><div class=\"d\">变得、逐渐会。接动词辞书形，<b>表状态的变化</b>，不是动作。</div><div class=\"ex\">知らない場所を知るようになる</div></div>\n</div>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>读音陷阱：这些字别读错</h2>\n<table class=\"sx\"><thead><tr><th>词</th><th>读音</th><th>易错点</th></tr></thead><tbody>\n<tr><td class=\"a\">歩く</td><td class=\"b\">あるく</td><td class=\"c\">不是「かく」；单字音读为 ほ（歩行 ほこう）</td></tr>\n<tr><td class=\"a\">淋しい</td><td class=\"b\">さびしい</td><td class=\"c\">也写「寂しい」，同音同义；不读 りん</td></tr>\n<tr><td class=\"a\">手の平</td><td class=\"b\">てのひら</td><td class=\"c\">「平」在这里不读 へい／たいら</td></tr>\n<tr><td class=\"a\">解る</td><td class=\"b\">わかる</td><td class=\"c\">＝分かる，同音；作者故意用「解」字</td></tr>\n<tr><td class=\"a\">離ればなれ</td><td class=\"b\">はなればなれ</td><td class=\"c\">不是「りれればなれ」；「離れ」读 はなれ</td></tr>\n<tr><td class=\"a\">嘆く</td><td class=\"b\">なげく</td><td class=\"c\">不是「たんく」；て形是 嘆いて</td></tr>\n<tr><td class=\"a\">この地</td><td class=\"b\">このち</td><td class=\"c\">「地」在这里读 ち，不是 じ</td></tr>\n<tr><td class=\"a\">しらしらと</td><td class=\"b\">しらしらと</td><td class=\"c\">别和「しらしらしい」（不知羞耻／佯装不知）混</td></tr>\n</tbody></table>\n</div>\n\n<div class=\"card cy\">\n<h2>同一句的三次变体：这首歌真正的结构</h2>\n<table class=\"sx\"><thead><tr><th>位置</th><th>原文</th><th>变化了什么</th></tr></thead><tbody>\n<tr><td class=\"a\">副歌一</td><td class=\"b\">うねりの中を歩き回る</td><td class=\"c\">脚还踩着地</td></tr>\n<tr><td class=\"a\">副歌二</td><td class=\"b\">うねりの中を泳ぎ回る</td><td class=\"c\">动词换了，人悬空了</td></tr>\n<tr><td class=\"a\">副歌三</td><td class=\"b\">今始まる意味を探し求め</td><td class=\"c\">从「让…结束」变成「自己开始」</td></tr>\n<tr><td class=\"a\">三遍接缝</td><td class=\"b\">疲れを忘れて</td><td class=\"c\">一字未改（焊接点）</td></tr>\n<tr><td class=\"a\">全曲收尾</td><td class=\"b\">また歩き始める</td><td class=\"c\">一字未改（循环成立）</td></tr>\n</tbody></table>\n</div>",
   "deepHtml": "<nav class=\"toc\">\n  <div class=\"in\">\n    <a href=\"#d1\"><span class=\"num\">01</span>骨架</a>\n    <a href=\"#d2\"><span class=\"num\">02</span>改词表</a>\n    <a href=\"#d3\"><span class=\"num\">03</span>音韵</a>\n    <a href=\"#d4\"><span class=\"num\">04</span>语法</a>\n    <a href=\"#d5\"><span class=\"num\">05</span>语气</a>\n    <a href=\"#d6\"><span class=\"num\">06</span>主题</a>\n    <a href=\"#d7\"><span class=\"num\">07</span>跟读</a>\n    <a href=\"#d8\"><span class=\"num\">08</span>练习</a>\n    <a href=\"#d9\"><span class=\"num\">09</span>清单</a>\n  </div>\n</nav>\n\n<div class=\"card ok\">\n  <h2>先给结论：三分钟版</h2>\n  <p>逐句篇回答「这句在说什么」，这一篇回答「<b>为什么整首这样写</b>」。三个结论，你先拿走：</p>\n  <div class=\"tldr\">\n    <div class=\"it\">\n      <div class=\"k\">结构</div>\n      <div class=\"v\">26 句只有<b>一副骨架</b>：三段副歌里，「疲れを忘れて」「この地で　この地で」「また歩き始める」三次一字不改，全曲只动了<b>三处</b>。这是一个圈，不是一条线。</div>\n    </div>\n    <div class=\"it\">\n      <div class=\"k\">音韵</div>\n      <div class=\"v\"><b>あるく</b> 与 <b>まわる</b> 是同一个元音骨架（a-u）；标题 <b>アルクアラウンド</b> 就是「歩く」＋around 的合体。三个拟态词全部是「〜ら〜」形：つれづれ／しらしらと／つらつらと。</div>\n    </div>\n    <div class=\"it\">\n      <div class=\"k\">语气</div>\n      <div class=\"v\">前半 8 句全是<b>僕</b>（一个人走），后半 4 次全是<b>僕ら</b>（一群人绕），切换发生在第 9 句，之后再没回来过。</div>\n    </div>\n  </div>\n</div>\n\n\u003C!-- ============ 01 ============ -->\n<section class=\"sec\" id=\"d1\">\n  <div class=\"sec-h\"><span class=\"n\">01</span><h3>骨架：七段，一个圈</h3><span class=\"jp\">構成</span></div>\n\n  <p class=\"lede\">\n    A → B → S → C → D → S′ → E。看起来是七段新内容，实际只有<b>一处真的「新」</b>：C 段（桥段）。其余段落都在两条轨道上来回：\n    一条是「僕は歩く」的主歌，一条是「疲れを忘れて…また歩き始める」的副歌。\n  </p>\n\n  <div class=\"skwrap\">\n    <svg class=\"sk\" viewBox=\"0 0 900 400\" role=\"img\" aria-label=\"七段结构与三次副歌的循环\">\n      <defs>\n        <linearGradient id=\"aln\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n          <stop offset=\"0\" stop-color=\"#5fe3f5\"/><stop offset=\".55\" stop-color=\"#b78cff\"/><stop offset=\"1\" stop-color=\"#ff6fb5\"/>\n        </linearGradient>\n      </defs>\n\n      \u003C!-- 基准线：原地（この地で） -->\n      <line x1=\"30\" y1=\"330\" x2=\"872\" y2=\"330\" stroke=\"#3a2e5c\" stroke-dasharray=\"6 7\" stroke-width=\"1.2\"/>\n      <text x=\"34\" y=\"352\" fill=\"#918aa8\" font-size=\"11.5\" font-family=\"sans-serif\" letter-spacing=\"1\">この地で　この地で　＝　始终没有离开的那块地</text>\n\n      \u003C!-- 主线：一圈一圈绕 -->\n      <path d=\"M76,300 C120,232 168,206 226,208\n               C292,210 318,268 372,272\n               C432,276 452,196 512,196\n               C572,196 588,262 646,262\n               C704,262 722,186 790,182\"\n            fill=\"none\" stroke=\"url(#aln)\" stroke-width=\"2.6\" stroke-linecap=\"round\" opacity=\".92\"/>\n\n      <g font-family=\"sans-serif\">\n        <circle cx=\"76\" cy=\"300\" r=\"7\" fill=\"#5fe3f5\"/>\n        <text x=\"76\" y=\"282\" fill=\"#5fe3f5\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">A</text>\n        <text x=\"76\" y=\"322\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">主歌 1</text>\n\n        <circle cx=\"226\" cy=\"208\" r=\"7\" fill=\"#6fd8ea\"/>\n        <text x=\"226\" y=\"190\" fill=\"#6fd8ea\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">B</text>\n        <text x=\"226\" y=\"232\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">主歌 2</text>\n\n        <circle cx=\"372\" cy=\"272\" r=\"7\" fill=\"#9fb6ff\"/>\n        <text x=\"372\" y=\"254\" fill=\"#9fb6ff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">S</text>\n        <text x=\"372\" y=\"296\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">副歌 1</text>\n\n        <circle cx=\"512\" cy=\"196\" r=\"7\" fill=\"#b78cff\"/>\n        <text x=\"512\" y=\"178\" fill=\"#b78cff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">C</text>\n        <text x=\"512\" y=\"220\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">桥段</text>\n\n        <circle cx=\"646\" cy=\"262\" r=\"7\" fill=\"#c79aff\"/>\n        <text x=\"646\" y=\"244\" fill=\"#c79aff\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">D</text>\n        <text x=\"646\" y=\"286\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">回头</text>\n\n        <circle cx=\"790\" cy=\"182\" r=\"7\" fill=\"#ff6fb5\"/>\n        <text x=\"790\" y=\"164\" fill=\"#ff6fb5\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\">S′→E</text>\n        <text x=\"790\" y=\"206\" fill=\"#918aa8\" font-size=\"11\" text-anchor=\"middle\">再绕一圈</text>\n      </g>\n\n      \u003C!-- 三次经过同一句的标记 -->\n      <line x1=\"372\" y1=\"272\" x2=\"646\" y2=\"262\" stroke=\"#ff6fb5\" stroke-width=\"1\" stroke-dasharray=\"3 5\" opacity=\".45\"/>\n      <line x1=\"646\" y1=\"262\" x2=\"790\" y2=\"182\" stroke=\"#ff6fb5\" stroke-width=\"1\" stroke-dasharray=\"3 5\" opacity=\".45\"/>\n      <text x=\"430\" y=\"368\" fill=\"#7ff0a8\" font-size=\"11.5\" font-family=\"sans-serif\" letter-spacing=\".5\">同一句出现三次：疲れを忘れて ／ この地で この地で ／ また歩き始める</text>\n    </svg>\n  </div>\n\n  <table>\n    <tr><th>段</th><th>句数</th><th>它在干什么</th><th>与谁同骨</th></tr>\n    <tr><td class=\"k\">A</td><td>4</td><td>一个人走，一个人等夜，抬头看月</td><td>—（起）</td></tr>\n    <tr><td class=\"k\">B</td><td>4</td><td>「僕は歩く」变成固定起句，最后自问「在找什么」</td><td>与 A 同骨，但换了起句位置</td></tr>\n    <tr><td class=\"k\">S</td><td>4</td><td>人称切到「僕ら」，第一次绕圈（歩き回る）</td><td>副歌本体</td></tr>\n    <tr><td class=\"k\">C</td><td>4</td><td>全曲唯一的新内容：君、揺らす、つらつらと</td><td>—（只有一次）</td></tr>\n    <tr><td class=\"k\">D</td><td>2</td><td>把 B 的后两句拿回来，换个问法</td><td>与 B 同骨</td></tr>\n    <tr><td class=\"k\">S′</td><td>4</td><td>第二次绕圈，动词从「歩く」换成「泳ぐ」</td><td>与 S 同骨</td></tr>\n    <tr><td class=\"k\">E</td><td>4</td><td>第三次绕圈，第一句换成新句，落点改成「今始まる」</td><td>与 S′ 同骨</td></tr>\n  </table>\n\n  <div class=\"note\">\n    <b>数一下重复率：</b>26 句里，「疲れを忘れて」3 次、「この地で　この地で」3 次、「また歩き始める」3 次——整整 <b>9 句是同一句</b>，占了三分之一。\n    再加上 D 段那 2 句是把 B 段拿回来用，全曲真正「一次性」的句子只剩 15 句左右。\n    <b>这不是偷懒，是编曲：重复让「绕圈」这件事在结构上真的发生了。</b>\n  </div>\n\n  <p class=\"lede\">\n    注意最后一段 E 的走法：它没有像 S、S′ 那样用「〜て　〜て」开头，而是换成一句全新的「悩んで　僕らはまた知らない場所を知るようになる」，\n    然后才接回「疲れを忘れて」。这是全曲唯一一次<b>在副歌里插进新信息</b>——因为这里是出口。\n  </p>\n</section>\n\n\u003C!-- ============ 02 ============ -->\n<section class=\"sec\" id=\"d2\">\n  <div class=\"sec-h\"><span class=\"n\">02</span><h3>改词表：作者只动了三处</h3><span class=\"jp\">書き換え</span></div>\n\n  <p class=\"lede\">\n    三张表，把重复段落逐位对齐。左边是第一次，右边是后来的。<mark>粉色</mark>是被换掉的部分。\n    这一节是全篇的核心——<b>作者在哪动手，就是他想说什么</b>。\n  </p>\n\n  <div class=\"card cy\">\n    <h2>表一　A → B：「新しい夜　僕は待っていた」→「僕は歩く　新しい夜を待っていた」</h2>\n    <table class=\"df\">\n      <tr><th>#</th><th>A 段（第 2 句）</th><th>B 段（第 6 句）</th><th>换了什么</th></tr>\n      <tr>\n        <td>1</td>\n        <td class=\"jp\">新しい夜　僕は待っていた</td>\n        <td class=\"jp\">僕は歩く　新しい夜<mark>を</mark>待っていた</td>\n        <td>句首塞进「僕は歩く」，于是「夜」从<b>话题</b>掉成<b>宾语</b>；「待つ」从独立状态变成「边走边等」的一个环节</td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td class=\"jp\">（原句没有动作）</td>\n        <td class=\"jp\">僕は歩く　ひとり冷えた手の平を見たのです</td>\n        <td>同一个「僕は歩く」起句，后面接的东西从「等」换成「看见自己的手很冷」——视线从远处收回到身体</td>\n      </tr>\n    </table>\n    <div class=\"bd\" style=\"margin-top:12px;\">\n      <b>同一句话，两个语法身份。</b>第 2 句里「新しい夜」是主题（可以读成「至于新的夜，我在等它」）；\n      第 6 句加了「を」，它就成了「待つ」的宾语，而「僕は歩く」占住了句子开头。\n      <b>日语很喜欢用「を」把主题降级成宾语</b>——加一个字，谁重要谁不重要就翻了。\n      另一个细节：第 2 句在「夜」后面有一个空格（行内停顿），第 6 句没有。念起来第二遍更快，因为它已经不需要停顿来强调了。\n    </div>\n  </div>\n\n  <div class=\"card cy\">\n    <h2>表二　B → D：同一个「〜ぬまま」，两个方向的问法</h2>\n    <table class=\"df\">\n      <tr><th>#</th><th>B 段（第 7–8 句）</th><th>D 段（第 17–18 句）</th><th>换了什么</th></tr>\n      <tr>\n        <td>1</td>\n        <td class=\"jp\">覚えたてのこの道 夜の明かり　しらしらと</td>\n        <td class=\"jp\">覚えたてのこの道 夜の明かり　しらしらと</td>\n        <td><b>一字不改</b>。整句搬回来当参照点</td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td class=\"jp\">何<mark>を</mark>探し回るのか　僕にもまだ<mark>わからぬ</mark>まま</td>\n        <td class=\"jp\">何<mark>が</mark>不安で何<mark>が</mark>足りないのか<mark>が</mark><mark>解らぬ</mark>まま</td>\n        <td>问句从「在找什么」（向外）变成「不安什么、缺什么」（向内）；「わからぬ」改写成汉字「解らぬ」</td>\n      </tr>\n    </table>\n    <div class=\"bd\" style=\"margin-top:12px;\">\n      两句的骨架完全一样：<b>疑问小句 ＋ のか ＋ 〜ぬまま</b>。区别只在问的方向——\n      第 8 句问「我要找的东西是什么」（往外找），第 18 句问「我为什么不安、缺了什么」（往里看）。\n      <b>一个人从「找东西」变成「体检」，通常意味着他找不到。</b>\n      <br><br>\n      还有一个表记层面的动作：<mark>わからぬ → 解らぬ</mark>。读音一样（わからぬ），汉字更书面、更硬。\n      同一个词，第一次用假名（轻），第二次用汉字（重）——<b>作者连标点都没改，只换了两个字，句子就沉下去了。</b>\n    </div>\n  </div>\n\n  <div class=\"card cy\">\n    <h2>表三　S → S′ → E：三次副歌只在两个位置动手</h2>\n    <table class=\"df\">\n      <tr><th>位置</th><th>副歌 1（S）</th><th>副歌 2（S′）</th><th>尾声（E）</th></tr>\n      <tr>\n        <td>1</td>\n        <td class=\"jp\">嘆いて　嘆いて　僕らは今うねりの中を<mark>歩き回る</mark></td>\n        <td class=\"jp\">流れて　流れて　僕らは今うねりの中を<mark>泳ぎ回る</mark></td>\n        <td class=\"jp\"><mark>悩んで</mark>　僕らはまた<mark>知らない場所を知るようになる</mark></td>\n      </tr>\n      <tr>\n        <td>2</td>\n        <td class=\"jp\">疲れを忘れて</td>\n        <td class=\"jp\">疲れを忘れて</td>\n        <td class=\"jp\">疲れを忘れて</td>\n      </tr>\n      <tr>\n        <td>3</td>\n        <td class=\"jp\">この地で　この地で　<mark>終わらせる</mark>意味を探し求め</td>\n        <td class=\"jp\">この地で　この地で　<mark>終わらせる</mark>意味を探し求め</td>\n        <td class=\"jp\">この地で　この地で　<mark>今始まる</mark>意味を探し求め</td>\n      </tr>\n      <tr>\n        <td>4</td>\n        <td class=\"jp\">また歩き始める</td>\n        <td class=\"jp\">また歩き始める</td>\n        <td class=\"jp\">また歩き始める</td>\n      </tr>\n    </table>\n    <div class=\"bd\" style=\"margin-top:12px;\">\n      12 句副歌（4×3），被改的只有 <b>3 处</b>：第一句的动词（歩き回る→泳ぎ回る）、第一句的叹词（嘆いて→流れて）、第三句的「終わらせる→今始まる」。\n      <b>剩下 9 句一字不改。</b>\n      <br><br>\n      而这三处改动指向同一件事：<b>从「绕」到「沉」，再到「重新开始」。</b>\n      走路是在地面上绕，游泳是在水里绕——同一个「回る」，介质换了；\n      「嘆く」是往外发泄，「流れる」是被动漂走，主语其实已经不当家了；\n      最后「終わらせる」是被动的使役（我让别人结束），改成「今始まる」是纯自动词（它自己开始）——<b>他放弃了控制权。</b>\n    </div>\n  </div>\n\n  <div class=\"warn\">\n    <b>这张表最容易被跳过，但它比歌词本身更值钱：</b>如果只是「看懂了每句」，\n    你会以为这首歌在讲「找不到东西」。看完三张表你会发现，作者真正做的是<b>在四个位置上留白、只在三个位置动手</b>——\n    其余全部交给重复去完成。<b>歌词的结构就是它的论点。</b>\n  </div>\n</section>\n\n\u003C!-- ============ 03 ============ -->\n<section class=\"sec\" id=\"d3\">\n  <div class=\"sec-h\"><span class=\"n\">03</span><h3>音韵：走与回的音</h3><span class=\"jp\">音</span></div>\n\n  <p class=\"lede\">\n    这首歌的题目是一个日语词和一个英语词的合体，而这两个词的意思是同一个动作。先看音，再看意思。\n  </p>\n\n  <div class=\"stats\">\n    <div class=\"st\"><div class=\"lb\">〜回る<span>转、绕、到处</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:100%\"></div></div><div class=\"num\">5</div></div>\n    <div class=\"st\"><div class=\"lb\">〜始める<span>开始</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:60%\"></div></div><div class=\"num\">3</div></div>\n    <div class=\"st\"><div class=\"lb\">〜ら〜 拟态词<span>つれづれ・しらしら・つらつら</span></div><div class=\"track\"><div class=\"fill\" style=\"width:100%\"></div></div><div class=\"num\">5</div></div>\n    <div class=\"st\"><div class=\"lb\">歩く（あるく）<span>标题的前半</span></div><div class=\"track\"><div class=\"fill\" style=\"width:100%\"></div></div><div class=\"num\">5</div></div>\n  </div>\n\n  <table>\n    <tr><th>词</th><th>读音拆解</th><th>音上的事</th></tr>\n    <tr><td class=\"k\">歩く</td><td class=\"jp\">あ る く</td><td>a-ru-ku：<b>a</b> 打头，<b>u</b> 收尾，中间夹一个 <b>r</b>。踏出去（a）→ 收回（u），脚步的形状就在这两个元音里</td></tr>\n    <tr><td class=\"k\">回る</td><td class=\"jp\">ま わ る</td><td>ma-wa-ru：和「あるく」同一个元音骨架（a…u），也是以 る 结尾。两个动词连读音都像</td></tr>\n    <tr><td class=\"k\">うねり</td><td class=\"jp\">う ね り</td><td>u-ne-ri：唯一一个以 <b>u</b> 打头的关键词——副歌那句「うねりの中を」，声音本身就往下沉</td></tr>\n    <tr><td class=\"k\">つれづれ</td><td class=\"jp\">つ れ づ れ</td><td>「〜れ〜れ」叠形，两个清音夹一个浊音（づ），念起来像无事可做时钟摆的来回</td></tr>\n    <tr><td class=\"k\">しらしらと</td><td class=\"jp\">し ら し ら と</td><td>「〜ら〜」叠形，全清音（s-r-s-r），最亮的一个——天刚亮、什么都没暖起来</td></tr>\n    <tr><td class=\"k\">つらつらと</td><td class=\"jp\">つ ら つ ら と</td><td>「〜ら〜」叠形，与「しらしら」只差一个辅音（ts 对 sh），意思却滑到「心不在焉」</td></tr>\n  </table>\n\n  <div class=\"good\">\n    <b>发现没有：三个拟态词全是一个模子。</b>つれづれ／しらしらと／つらつらと——都是「清音＋ら/れ＋清音＋ら/れ」的叠形，都是文语。\n    它们在这首歌里分工极其清楚：<b>つれづれ</b>＝没有事做的时间，<b>しらしらと</b>＝天亮了但还没暖的时间，<b>つらつらと</b>＝心不在焉的那段时间。\n    <b>三个词都是「空白的时间」</b>，而全曲的主语恰好一直在走路——他一直在动，可他经历的全是空白。\n  </div>\n\n  <p class=\"lede\">\n    再看题目：<b>アルクアラウンド</b> 是 a-ru-ku-a-ra-u-n-do，八拍。把它切开是「アルク（歩く）」＋「アラウンド（around）」，\n    中间那个 <b>ku-a</b> 连读起来正是「くわ」——<b>「歩く」的尾巴直接焊在 around 的头上</b>，听不出接缝。\n    日语里这种「和制外来语拼接」很常见，但这首歌拼得特别准：around 的意思本来就是「绕一圈」，而「回る」的读音又和它押上。\n  </p>\n\n  <table>\n    <tr><th>句尾</th><th>出现的句子</th><th>效果</th></tr>\n    <tr><td class=\"k\">〜る</td><td class=\"jp\">歩き回る／泳ぎ回る／始める</td><td>全曲最硬的一组收尾，都是动作动词，句子落地有声</td></tr>\n    <tr><td class=\"k\">〜て</td><td class=\"jp\">疲れを忘れて／探し求め</td><td>不收尾，把话往下推，正好推出下一句</td></tr>\n    <tr><td class=\"k\">〜た</td><td class=\"jp\">待っていた／見たのです</td><td>前半段的收尾，都是「已经发生」，语气平</td></tr>\n    <tr><td class=\"k\">〜と</td><td class=\"jp\">しらしらと／つらつらと</td><td>文语副词尾，念完要停半拍，是全曲仅有的「留白」</td></tr>\n  </table>\n</section>\n\n\u003C!-- ============ 04 ============ -->\n<section class=\"sec\" id=\"d4\">\n  <div class=\"sec-h\"><span class=\"n\">04</span><h3>语法：六组能直接搬走的</h3><span class=\"jp\">文法の骨</span></div>\n\n  <p class=\"lede tight\">\n    这一节按「用得上」排序。每组给：曲中原句 → 结构拆解 → 你自己能造的一句。\n  </p>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">ます形 ＋ 回る</span><span class=\"lab\">反复 · 到处</span></div>\n    <div class=\"ex\">歩き回る ／ 泳ぎ回る ／ 探し回る<i>全曲 5 次</i></div>\n    <div class=\"bd\">\n      「回る」接在动词ます形后面，表示<b>同一个动作到处、反复地做</b>：走→走来走去，探す→到处找，泳ぐ→游来游去。\n      它比单纯重复多一层「没有固定方向」的意思——所以「探し回る」不是「找」，是「<b>到处找不到才一直找</b>」。\n      这首歌拿它当主旋律：三个副歌的核心动词全是「〜回る」。\n    </div>\n    <div class=\"me\">自造：<em>鍵を探し回ったけど、ポケットにあった。</em>（到处找钥匙，结果在口袋里。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">ます形 ＋ 始める</span><span class=\"lab\">动作的开端</span></div>\n    <div class=\"ex\">また歩き始める<i>三次一字不改</i></div>\n    <div class=\"bd\">\n      「始める」接ます形＝<b>某个动作从现在开始</b>。注意它和「〜始まる」的区别：始める 是<b>人主动开始</b>（他动词），\n      始まる 是<b>事情自己开始</b>（自动词）。全曲最后一句用的是「今始まる」——<b>不是他开始的，是它自己开始的。</b>\n      同一个意思，两个词性，态度完全不同。\n    </div>\n    <div class=\"me\">自造：<em>雨が降り始めた。</em>（开始下雨了。）／ <em>授業が始まる。</em>（课要开始了。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">自他动词对：揺らす／揺れる</span><span class=\"lab\">谁在动</span></div>\n    <div class=\"ex\">正しく僕を<mark>揺らす</mark>　正しい君のあの話</div>\n    <div class=\"ex\">正しく君と<mark>揺れる</mark>　何かを確かめて</div>\n    <div class=\"bd\">\n      「揺らす」＝我摇它（他动词，带を）；「揺れる」＝它/我在摇（自动词，不带を）。\n      这两句是全曲唯一一处<b>语法对仗</b>：第一句「你摇我」，第二句「我与你一起摇」——<b>从被动变成共振。</b>\n      日语里这类自他对（揺らす/揺れる、終わらせる/終わる、始める/始まる）是 N4–N3 的高频考点，\n      判断方法就一条：<b>句子里的「を」属于谁。</b>\n    </div>\n    <div class=\"me\">自造：<em>風が木を揺らす。</em>（风吹动树。）／ <em>木が風に揺れる。</em>（树在风里摇。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">〜ぬまま</span><span class=\"lab\">文语否定 · 保持原状</span></div>\n    <div class=\"ex\">僕にもまだ<mark>わからぬ</mark>まま ／ <mark>解らぬ</mark>まま</div>\n    <div class=\"bd\">\n      「ぬ」是「ない」的文语形，「まま」＝保持那个状态不变。合起来＝<b>「在还没…的状态下」</b>。\n      它比「〜ないままで」更书面、更硬，适合放在段落最后当断句。\n      这首歌两次都用它收句，等于<b>两个段落都以「不知道」结束</b>——这才是真正的结构。\n      注意接续：动词未然形＋ぬ（わから＋ぬ／解ら＋ぬ）。\n    </div>\n    <div class=\"me\">自造：<em>理由もわからぬまま、彼は去った。</em>（连理由都不知道，他就走了。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">〜ようになる</span><span class=\"lab\">状态的变化</span></div>\n    <div class=\"ex\">知らない場所を知る<mark>ようになる</mark></div>\n    <div class=\"bd\">\n      「ようになる」＝<b>从「不会/不是」变成「会/是」</b>，表能力或状态的渐变，不表一次性动作。\n      对比：「知る」＝知道了（瞬间）；「知るようになる」＝<b>慢慢变得知道</b>（过程）。\n      这首歌把它放在全曲倒数第四句，等于给整首歌一个「渐变」的落点——不是顿悟，是慢慢熬出来的。\n    </div>\n    <div class=\"me\">自造：<em>日本語が少し話せるようになった。</em>（日语能说一点了。）</div>\n  </div>\n\n  <div class=\"gcard\">\n    <div class=\"hd\"><span class=\"pat\">て形中顿（连用中止）</span><span class=\"lab\">话不断句</span></div>\n    <div class=\"ex\">疲れを<mark>忘れて</mark> ／ 〜を<mark>探し求め</mark></div>\n    <div class=\"bd\">\n      て形放在句尾不收句，只是「停一下继续说」。日语靠这一招把几句话串成一条流水，语气不停。\n      这首歌的副歌四句就是靠「忘れて」「探し求め」两个中顿连成<b>一口气</b>的：忘掉疲劳→在地里找意义→又开始走。\n      如果改成「疲れを忘れる。意味を探す。歩き始める。」就会变成三个独立的短句，<b>那股一直在动的感觉立刻消失。</b>\n    </div>\n    <div class=\"me\">自造：<em>コーヒーを飲んで、少し休んで、また仕事を始めた。</em>（喝了咖啡，歇了会儿，又开始干活。）</div>\n  </div>\n\n  <h4 style=\"font-size:13px;letter-spacing:.14em;color:var(--violet);margin:24px 0 8px;\">一处同词双形：正しく／正しい</h4>\n  <div class=\"card vi\" style=\"margin:10px 0;\">\n    <p class=\"jp\" style=\"font-size:17px;color:var(--text);\">正しく僕を揺らす　正しい君のあの話</p>\n    <table style=\"margin-top:10px;\">\n      <tr><th>形态</th><th>拆法</th><th>作用</th></tr>\n      <tr>\n        <td class=\"k\">正しく</td>\n        <td class=\"jp\">形容词连用形（＝副词）＋ 動詞「揺らす」</td>\n        <td>修饰动作：<b>恰当地</b>摇动我——摇的方式是对的</td>\n      </tr>\n      <tr>\n        <td class=\"k\">正しい</td>\n        <td class=\"jp\">形容词连体形 ＋ 名詞「君のあの話」</td>\n        <td>修饰名词：<b>正确的</b>那句话——话的内容是对的</td>\n      </tr>\n    </table>\n    <div class=\"bd\" style=\"margin-top:12px;\">\n      同一个词根，一口气用两个形态，一个管动词、一个管名词，中间只隔一个空格。\n      <b>日语里这叫「掛詞」式的并置</b>——不是双关，是让读者同时听到「方式正确」和「内容正确」。\n      这类地方不必挑一个读法，<b>能听出两层就已经读到位了。</b>\n    </div>\n  </div>\n</section>\n\n\u003C!-- ============ 05 ============ -->\n<section class=\"sec\" id=\"d5\">\n  <div class=\"sec-h\"><span class=\"n\">05</span><h3>语气：从仆到我们</h3><span class=\"jp\">語気</span></div>\n\n  <p class=\"lede\">\n    这首歌最重要的一个动作不是换词，是<b>换人</b>。看统计：\n  </p>\n\n  <div class=\"stats\">\n    <div class=\"st\"><div class=\"lb\">僕<span>一个人（前半 8 句）</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:100%\"></div></div><div class=\"num\">7</div></div>\n    <div class=\"st\"><div class=\"lb\">僕ら<span>我们（后半 4 次）</span></div><div class=\"track\"><div class=\"fill\" style=\"width:57%\"></div></div><div class=\"num\">4</div></div>\n    <div class=\"st\"><div class=\"lb\">です／のです<span>敬体，只 2 次</span></div><div class=\"track\"><div class=\"fill\" style=\"width:29%\"></div></div><div class=\"num\">2</div></div>\n    <div class=\"st\"><div class=\"lb\">〜て（不收尾）<span>把话往下推</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:43%\"></div></div><div class=\"num\">3</div></div>\n  </div>\n\n  <table>\n    <tr><th>位置</th><th>人称</th><th>在该段里的作用</th></tr>\n    <tr><td class=\"k\">A 段（1–4）</td><td class=\"jp\">僕 × 3</td><td>一个人走。第 4 句「淋しい人になりにけり」是一句文语，等于自己给自己下了判词</td></tr>\n    <tr><td class=\"k\">B 段（5–8）</td><td class=\"jp\">僕 × 2</td><td>还是一个人。手很冷，路是新的，灯是白的，最后一句问「在找什么」</td></tr>\n    <tr><td class=\"k\">S 段（9–12）</td><td class=\"jp\">僕ら</td><td><b>第一次变成「我们」</b>。一个人走变成一群人绕——注意这里没有交代「谁」加入了，人称自己变的</td></tr>\n    <tr><td class=\"k\">C 段（13–16）</td><td class=\"jp\">僕 → 僕ら</td><td>前半还是「僕を揺らす」，最后一句突然「気まぐれな僕ら」——<b>在同一个段落里完成了切换</b></td></tr>\n    <tr><td class=\"k\">D 段（17–18）</td><td class=\"jp\">（无人称）</td><td>两个问句，主语消失。像是站在原地的旁白</td></tr>\n    <tr><td class=\"k\">S′／E（19–26）</td><td class=\"jp\">僕ら × 2</td><td>再也没有回到「僕」。<b>一个人走完了，剩下的路是「我们」在走</b></td></tr>\n  </table>\n\n  <div class=\"note\">\n    <b>为什么这个切换这么重要：</b>「僕ら」不是「僕」的复数那么简单。它带一层<b>「我和你，还有别的同类」</b>的温度，\n    常用在集体宣言里（僕らは今…）。一个人说「僕ら」的时候，其实是在<b>把自己也算进一群看不见的人里</b>——\n    这是日语歌里最常用的一种「假装有人陪」的说法。副歌之所以听起来像合唱，不是编曲，是这一个词。\n  </div>\n\n  <p class=\"lede\">\n    另一个细节：全曲几乎都是常体（だ／だろ／た），只有两句用了敬体——\n    第 3 句「月は悲しみです」和第 5 句「手の平を見たのです」。\n    在一整首对自己说话的歌里突然客气一下，<b>等于把「悲しみ」这件事摆到台面上，当成一个正式的结论说出来</b>。\n    而这两句都出现在前半，也就是他最孤独的时候。\n  </p>\n</section>\n\n\u003C!-- ============ 06 ============ -->\n<section class=\"sec\" id=\"d6\">\n  <div class=\"sec-h\"><span class=\"n\">06</span><h3>主题：around 的三层</h3><span class=\"jp\">主題</span></div>\n\n  <p class=\"lede\">\n    「绕」在这首歌里有三层，一层比一层深。\n  </p>\n\n  <table>\n    <tr><th>层</th><th>怎么绕的</th><th>歌词依据</th></tr>\n    <tr>\n      <td class=\"k\">空间</td>\n      <td>在同一块地上绕圈</td>\n      <td class=\"jp\">この地で　この地で<i>三次一模一样</i></td>\n    </tr>\n    <tr>\n      <td class=\"k\">时间</td>\n      <td>一直在同一个夜里</td>\n      <td class=\"jp\">新しい夜 → 夜の明かり → 夜の明かり<i>夜没有过去</i></td>\n    </tr>\n    <tr>\n      <td class=\"k\">句法</td>\n      <td>同一副骨架反复用</td>\n      <td class=\"jp\">疲れを忘れて ／ この地で この地で ／ また歩き始める<i>各 3 次</i></td>\n    </tr>\n  </table>\n\n  <div class=\"good\">\n    <b>请注意「この地で」被说了两遍。</b>「この地で（在这里）」＋「この地で（就在这里）」——同一个词连说两次，\n    中间没有任何连接，只是重复。日语里这种叠用不是为了加强语气，是为了表现<b>「没走远」</b>。\n    如果只写一次，读者会觉得他在某处；写两次，读者才感觉到<b>他一直在同一个地方，而且知道自己在同一个地方。</b>\n  </div>\n\n  <p class=\"lede\">\n    标题也是三层：<b>アルク（歩く）</b>是动作，<b>アラウンド（around）</b>是轨迹，合起来是一个<b>「有动作、有轨迹、但没终点」</b>的词。\n    这正好对应全曲的收尾——不是「找到了」，而是「知らない場所を知るようになる」（开始知道那些不知道的地方）。\n    <b>他到最后也没找到东西，只是终于承认自己在找。</b>\n  </p>\n\n  <h4 style=\"font-size:13px;letter-spacing:.14em;color:var(--violet);margin:24px 0 8px;\">那桥段 C 是干什么的</h4>\n  <p class=\"lede\">\n    C 段是全曲唯一出现「君」的地方：君の話、君と揺れる。前面 12 句他一个人走，后面 8 句是我们绕，\n    <b>只有这 4 句里有一个具体的对方。</b>而这一段偏偏是最含糊的：何かを確かめて（确认了些什么）、\n    すぐに忘れ（马上又忘了）、離ればなれ（各奔东西）。\n    <b>「绕」的真正原因就在这四句里：他绕的不是那块地，是一段说不清的关系。</b>\n  </p>\n</section>\n\n\u003C!-- ============ 07 ============ -->\n<section class=\"sec\" id=\"d7\">\n  <div class=\"sec-h\"><span class=\"n\">07</span><h3>跟读：一口气一句</h3><span class=\"jp\">読み方</span></div>\n\n  <p class=\"lede\">\n    这首歌的原句里到处是<b>行内空格</b>，那不是排版，是作者给的呼吸点。念的时候不要吞掉它。\n  </p>\n\n  <table>\n    <tr><th>要点</th><th>例子</th><th>做法</th></tr>\n    <tr>\n      <td class=\"k\">行内空格</td>\n      <td class=\"jp\">僕は歩く　つれづれな日</td>\n      <td>空格＝半拍停顿。「僕は歩く」先落地，再说「つれづれな日」。两句中间停住，不要连成一口气</td>\n    </tr>\n    <tr>\n      <td class=\"k\">同词重复</td>\n      <td class=\"jp\">嘆いて　嘆いて ／ この地で　この地で</td>\n      <td>第一遍正常，第二遍<b>更轻、更低</b>。第二遍不是加强，是回声</td>\n    </tr>\n    <tr>\n      <td class=\"k\">长句断法</td>\n      <td class=\"jp\">僕は歩く　ひとり見上げた月は悲しみです</td>\n      <td>三个短语一口气：［僕は歩く］［ひとり見上げた月は］［悲しみです］。最后「です」要念满，敬体的重量全在这一个字</td>\n    </tr>\n    <tr>\n      <td class=\"k\">文语收尾</td>\n      <td class=\"jp\">淋しい人になりにけり</td>\n      <td>「けり」是咏叹，念完要停住，不要拖长——它是全曲唯一一处「古典的收笔」</td>\n    </tr>\n    <tr>\n      <td class=\"k\">长音</td>\n      <td class=\"jp\">アルクアラウンド</td>\n      <td>八拍：a-ru-ku-a-ra-u-n-do。最后那个「ンド」不能吞，它是整首歌的名字敲下去的地方</td>\n    </tr>\n    <tr>\n      <td class=\"k\">副歌的三行一口气</td>\n      <td class=\"jp\">疲れを忘れて／この地で　この地で／また歩き始める</td>\n      <td>三行是一句，中间不要停。这一口气念完，你才会感觉到「他又走了一圈」</td>\n    </tr>\n  </table>\n\n  <div class=\"note\">\n    <b>练法（三步，每步 3 遍）：</b><br>\n    ① 只念假名（r 行），先不管意思，把行内空格和叠句的轻重念对；<br>\n    ② 看汉字念，确认「つれづれ／しらしらと／つらつらと」三个词不会串（它们长得太像）；<br>\n    ③ 只跟副歌——三段副歌共 12 句，其中 9 句完全一样，<b>跟会一段等于会三段</b>。\n  </div>\n</section>\n\n\u003C!-- ============ 08 ============ -->\n<section class=\"sec\" id=\"d8\">\n  <div class=\"sec-h\"><span class=\"n\">08</span><h3>改词练习：把骨架换成你自己的</h3><span class=\"jp\">練習</span></div>\n\n  <p class=\"lede tight\">\n    最有效的记忆方式不是背原句，是<b>用同一个骨架造自己的句子</b>。八题，先自己写，再看答案。\n    写不出来就回去看第 04 节对应的卡片。\n  </p>\n\n  <div class=\"q\">\n    <div class=\"no\">Q1 ／ 到处找</div>\n    <div class=\"ask\">「一整天到处找手机。」用「〜回る」。</div>\n    <div class=\"stem\">一日中、携帯を（　　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>一日中、携帯を探し回った。</b>（いちにちじゅう、けいたいをさがしまわった）</p>\n      <p>「探し回る」＝到处找。注意这里用过去式「回った」，因为结果已经定了；如果是「正在到处找」，就说「探し回っている」。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q2 ／ 开始</div>\n    <div class=\"ask\">「又开始下雨了。」用「〜始める」。</div>\n    <div class=\"stem\">また雨が（　　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>また雨が降り始めた。</b>（またあめがふりはじめた）</p>\n      <p>如果想强调「自然开始、不是谁让它开始」，可以说「降り始めた」；如果主语的意志更强（比如「开始跑」），就用「走り始める」。这首歌最后一句选的是「始まる」（自动词），不是「始める」——记住这个区别。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q3 ／ 自他对</div>\n    <div class=\"ask\">「风摇着窗。」→「窗在风里摇。」两句都用「揺らす/揺れる」。</div>\n    <div class=\"stem\">風が窓を（　　）／ 窓が風に（　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>風が窓を揺らす。</b>（かぜがまどをゆらす）／ <b>窓が風に揺れる。</b>（まどがかぜにゆれる）</p>\n      <p>判断口诀：句子里有「を」的用它动词（揺らす），主语自己动的用自动词（揺れる）。这首歌第 13、14 句就是这个对仗：先是「你摇我」（揺らす），再是「我和你一起摇」（揺れる）。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q4 ／ 还没…的状态</div>\n    <div class=\"ask\">「连理由都不知道，他就走了。」用「〜ぬまま」。</div>\n    <div class=\"stem\">理由も（　　　）、彼は去った</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>理由もわからぬまま、彼は去った。</b>（りゆうもわからぬまま、かれはさった）</p>\n      <p>「ぬ」＝「ない」的文语形，接在未然形后面：わから＋ぬ。日常会话里更常说「わからないままで」，书面或歌词里才用「ぬまま」。这首歌两次都用它收句。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q5 ／ 状态渐变</div>\n    <div class=\"ask\">「慢慢能听懂日语了。」用「〜ようになる」。</div>\n    <div class=\"stem\">少しずつ日本語が（　　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>少しずつ日本語がわかるようになった。</b>（すこしずつにほんごがわかるようになった）</p>\n      <p>「わかる」是状态动词，直接说「わかった」是「懂了（瞬间）」；加「ようになる」才表示「慢慢变得能懂」。这首歌放它在倒数第四句，落点就是「渐变」而不是「顿悟」。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q6 ／ 中顿</div>\n    <div class=\"ask\">把「我忘了疲劳，找着意义，又走了起来」写成一句，用两个て形连起来。</div>\n    <div class=\"stem\">疲れを（　　）、意味を（　　）、また歩き始めた</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>疲れを忘れて、意味を探し求めて、また歩き始めた。</b>（つかれをわすれて、いみをさがしもとめて、またあるきはじめた）</p>\n      <p>两句都用「て形」收尾不收句，读起来一口气。注意「探し求める」本身是复合动词（探す＋求める），重音在「も」。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q7 ／ 使役 vs 自动</div>\n    <div class=\"ask\">「让这件事结束」和「这件事自己开始了」，分别怎么表达？</div>\n    <div class=\"stem\">この話を（　　　）／ この話が（　　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>この話を終わらせる。</b>（おわらせる，使役形·他动词）／ <b>この話が始まる。</b>（はじまる，自动词）</p>\n      <p>「終わらせる」＝我让它结束（我有权力、也有责任）；「始まる」＝它自己开始（我没有控制权）。这首歌最末一句把前者换成后者，就是<b>把控制权交出去</b>——这是全曲唯一一次态度变化。</p>\n    </div></details>\n  </div>\n\n  <div class=\"q\">\n    <div class=\"no\">Q8 ／ 两义的拟态词</div>\n    <div class=\"ask\">「つらつら」有两个几乎相反的意思，各造一句。</div>\n    <div class=\"stem\">つらつら（　　）／ つらつら（　　）</div>\n    <details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">\n      <p><b>つらつら考える。</b>（＝漫不经心地想／也可读作「仔细地想」，靠上下文定）<br>\n      <b>つらつらと書き連ねる。</b>（＝滔滔不绝地写／漫无目的地写）</p>\n      <p>这个词的两种意思方向相反：一是「漫不经心、随随便便」，二是「仔细、反复」。这首歌第 15、16 句连用两次，<b>两遍各取一义都读得通</b>——所以不必定死，知道它有两层就行。</p>\n    </div></details>\n  </div>\n</section>\n\n\u003C!-- ============ 09 ============ -->\n<section class=\"sec\" id=\"d9\">\n  <div class=\"sec-h\"><span class=\"n\">09</span><h3>可迁移清单：二十条，直接背</h3><span class=\"jp\">持ち帰り</span></div>\n\n  <p class=\"lede tight\">\n    全部出自本曲。左边是句型，中间是你以后能套的场景，右边是曲中原句（方便回去对）。\n  </p>\n\n  <table>\n    <tr><th>#</th><th>句型</th><th>意思 / 能用在</th><th>曲中出处</th></tr>\n    <tr><td class=\"k\">01</td><td class=\"jp\">ます形＋回る</td><td>到处、反复地做</td><td class=\"jp\">歩き回る</td></tr>\n    <tr><td class=\"k\">02</td><td class=\"jp\">ます形＋始める</td><td>主动开始做</td><td class=\"jp\">歩き始める</td></tr>\n    <tr><td class=\"k\">03</td><td class=\"jp\">〜ぬまま</td><td>在还没…的状态下（文语）</td><td class=\"jp\">わからぬまま</td></tr>\n    <tr><td class=\"k\">04</td><td class=\"jp\">〜ようになる</td><td>慢慢变得会…</td><td class=\"jp\">知るようになる</td></tr>\n    <tr><td class=\"k\">05</td><td class=\"jp\">て形中顿</td><td>话不断句，往下推</td><td class=\"jp\">疲れを忘れて</td></tr>\n    <tr><td class=\"k\">06</td><td class=\"jp\">揺らす／揺れる</td><td>我摇它／它自己摇</td><td class=\"jp\">僕を揺らす／君と揺れる</td></tr>\n    <tr><td class=\"k\">07</td><td class=\"jp\">終わらせる／始まる</td><td>我让它结束／它自己开始</td><td class=\"jp\">今始まる</td></tr>\n    <tr><td class=\"k\">08</td><td class=\"jp\">〜のか</td><td>自问、反问（句尾降调）</td><td class=\"jp\">何を探し回るのか</td></tr>\n    <tr><td class=\"k\">09</td><td class=\"jp\">〜と（文语副词）</td><td>拟态词＋と，念完停半拍</td><td class=\"jp\">しらしらと／つらつらと</td></tr>\n    <tr><td class=\"k\">10</td><td class=\"jp\">〜です／のです</td><td>常体里突然客气＝把话摆上台面</td><td class=\"jp\">月は悲しみです</td></tr>\n    <tr><td class=\"k\">11</td><td class=\"jp\">ます形＋たて</td><td>刚刚…（还带着新鲜感）</td><td class=\"jp\">覚えたてのこの道</td></tr>\n    <tr><td class=\"k\">12</td><td class=\"jp\">〜ると（条件）</td><td>一…就…（自然承接）</td><td class=\"jp\">声を聞くと惹かれ</td></tr>\n    <tr><td class=\"k\">13</td><td class=\"jp\">つれづれ（徒然）</td><td>无事可做、闲得发慌（文语）</td><td class=\"jp\">つれづれな日</td></tr>\n    <tr><td class=\"k\">14</td><td class=\"jp\">しらしらと</td><td>天刚亮、白得还没暖起来</td><td class=\"jp\">夜の明かり　しらしらと</td></tr>\n    <tr><td class=\"k\">15</td><td class=\"jp\">つらつらと</td><td>漫不经心／也可作仔细（两义）</td><td class=\"jp\">すぐに忘れ つらつらと</td></tr>\n    <tr><td class=\"k\">16</td><td class=\"jp\">うねり</td><td>涌浪、起伏；引申为时代的浪</td><td class=\"jp\">うねりの中を</td></tr>\n    <tr><td class=\"k\">17</td><td class=\"jp\">気まぐれ</td><td>反复无常、心血来潮</td><td class=\"jp\">気まぐれな僕ら</td></tr>\n    <tr><td class=\"k\">18</td><td class=\"jp\">離ればなれ</td><td>各奔东西、散开</td><td class=\"jp\">離ればなれ</td></tr>\n    <tr><td class=\"k\">19</td><td class=\"jp\">探し求める</td><td>寻找并追求（复合动词）</td><td class=\"jp\">意味を探し求め</td></tr>\n    <tr><td class=\"k\">20</td><td class=\"jp\">〜になりにけり</td><td>文语过去＋咏叹，古典收笔</td><td class=\"jp\">淋しい人になりにけり</td></tr>\n  </table>\n\n  <div class=\"warn\">\n    <b>三个最容易串的，单独盯住：</b><br>\n    つれづれ → <b>徒然</b>，写「つれづれ」不写「つれずれ」（づ 是浊音）<br>\n    しらしらと → <b>白々と</b>（しらじら 是「明知故问」的白々しい，别混）<br>\n    解らぬ → 读 <b>わからぬ</b>，不是「げらぬ」；「解」在这里是「理解」的意思<br>\n    这三个都是「看着眼熟、一开口就错」的类型。歌里出现＝白送的分，别丢。\n  </div>\n</section>\n\n<div class=\"card ok\">\n  <h2>最后一句：这首歌到底在讲什么</h2>\n  <p>不是「我在找不到的东西」。是——</p>\n  <p><b>一个人走了一夜，从「走路绕圈」变成「在水里绕圈」，最后连「结束」都改口叫「开始」；而唯一一次没改的那句，是「また歩き始める」。</b></p>\n  <p>他绕的不是那块地。「この地で　この地で」说了三遍，可他从没离开过；问到「在找什么」的时候，他答的是「我也不知道」。<b>桥段里出现的那 4 句「君」才是圆心。</b></p>\n  <p>所以最后不是「终于找到了」，是「知らない場所を知るようになる」——<b>他终于知道自己一直在找，这就是全部的答案。</b>\n  走路的人不需要终点，他需要的是承认自己还在走。而「また歩き始める」这句，三次一字没改——\n  <b>这是全曲唯一拒绝变化的地方，也是它唯一想说的话。</b></p>\n</div>"

   "cardsTopHtml": "<div class=\"card hot\">\n<h2>先说清楚：这首歌唱的不是音乐，是一个人决定继续唱</h2>\n<p>表面上是「鸟飞过城市」的一首歌，实际上从头到尾只有一个人在房间里自问自答：他像鸟一样漂走了，<b>想不起故乡、想不起该记住的人</b>，最后只剩下「继续唱」这一件事。</p><p>65 句歌词（含 10 行片假名念白）里有三个坑，提前排掉读起来会顺很多：</p><p>① <b>括号里的片假名不是音效，是完整的日语句子</b>——「カワハナガレル」＝川は流れる（河在流）、「ヨルハナガレル」＝夜は流れる（夜在流）、「マダミエテナイ」＝まだ見えていない（还看不见）。作者故意全写成片假名，让你听成一串音。</p><p>② <b>鳴く（鸟叫）与 泣く（人哭）同音</b>，都是 なく。第 9 句鸟在鳴いた，第 45 句旁白说人在泣いていた——全曲的双关都压在这一点上。</p><p>③ <b>「消えた」与「触れた」只差一个动词</b>：两段副歌结构完全一样，一个是消失，一个是触碰，都是过去式、都无法挽回。</p><p>建议用法：先只看主歌四段，你会发现它们其实是<b>两组镜像</b>（岩↔仲間、淋しい↔弱い）。把这一点抓住，副歌就成了答案，而不是装饰。</p>\n</div>\n\n<div class=\"card\">\n<h2>N4–N5 生存指南：这首歌里反复出现的 8 个套路</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">① 鳴く / 泣く：同音双关</div><div class=\"d\">鸣く＝鸟兽叫，泣く＝人哭，读音都是 <b>なく</b>。这首歌第 9 句是「鳥は高く鳴いた」，第 45 句旁白是「泣いていた」——字不同、音一样。听不出来的人只觉得重复，听出来的人会发现：那只鸟可能一直就是个人。</div><div class=\"ex\">高い声で鳴いた ／ ナイテイタ ナイテイタカラ</div></div>\n<div class=\"mini\"><div class=\"t\">② 消えた / 触れた：同一个过去式的两面</div><div class=\"d\">副歌 1 全用 <b>消えた</b>（消失了），副歌 2 全用 <b>触れた</b>（碰到了）。两个都是过去式：一个是「什么都没剩下」，一个是「留下了感觉」。结构一模一样，只换一个词。</div><div class=\"ex\">消えた ／ 触れた</div></div>\n<div class=\"mini\"><div class=\"t\">③ 片假名暗号：カワハナガレル</div><div class=\"d\">全曲最重要的玩法。括号里的全片假名是<b>第二个声部</b>（コーラス），每一句其实都是完整日语：カワハナガレル＝川は流れる、ヨルハナガレル＝夜は流れる、マダミエテナイ＝まだ見えていない、ナイテイタカラ＝泣いていたから。写成片假名＝听起来只是一串音，不参与叙事。</div><div class=\"ex\">（カワハナガレル） ／ （ヨルハナガレル）</div></div>\n<div class=\"mini\"><div class=\"t\">④ 〜ていた → 〜てた：口语缩略</div><div class=\"d\">流れ流れ<b>ていた</b> → 流れ流れ<b>てた</b>；鳴い<b>ていた</b> → 鳴い<b>てた</b>；待っ<b>ている</b> → 待っ<b>てる</b>。去掉 い，语速立刻变快、语气变随意。歌词用它让句子听起来像脱口而出。</div><div class=\"ex\">流れ流れてた鳥だって ／ 街で鳴いてたろ</div></div>\n<div class=\"mini\"><div class=\"t\">⑤ 〜だって：连…也／就算是…也</div><div class=\"d\">名词＋だって 有两种口气：<b>连…也</b>（鳥だって＝连鸟都）和<b>就算是…也</b>（夜だって＝就算是夜）。尾段连排三个：痛みや傷だって／夜だって／僕だって——一层层把自己也垒进去。</div><div class=\"ex\">鳥だって ／ 変わらないままの夜だって ／ 弱い僕だって</div></div>\n<div class=\"mini\"><div class=\"t\">⑥ 〜たまま：该变的东西没变</div><div class=\"d\">濡れた<b>まま</b>の髪（头发还湿着）、昨日の<b>まま</b>だった（衣服还是昨天那样）、変わらない<b>まま</b>の夜（夜一成不变）。同一个词从小物件一路放大到整夜，是全曲的结构词。</div><div class=\"ex\">濡れたままの髪で ／ 昨日のままだった</div></div>\n<div class=\"mini\"><div class=\"t\">⑦ ます形＋続ける：持续做</div><div class=\"d\">歌い＋続ける＝继续唱；歩き続ける、待ち続ける同理。注意 続ける 是<b>他动词</b>（自己决定继续），自動詞 続く 是「自己延续」——歌里用他动词，说明「继续」是他的意志，不是自然发生。</div><div class=\"ex\">歌い続けるよ ／ 続けるよ</div></div>\n<div class=\"mini\"><div class=\"t\">⑧ 〜ようだ：把判断说软</div><div class=\"d\">見ている<b>ようだ</b>＝好像在看。它不是事实陈述，是说话人的感觉：衣服当然不会看人，但他觉得它在看。全曲「物会看人」的恐怖感，就来自这一个助动词。</div><div class=\"ex\">だらしない僕を見ているようだ</div></div>\n</div>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>读音陷阱：这些字别读错</h2>\n<table class=\"sx\"><thead><tr><th>词</th><th>读音</th><th>易错点</th></tr></thead><tbody>\n<tr><td class=\"a\">川面</td><td class=\"b\">かわも</td><td class=\"c\">不读 かわづら；＝川の面（河面）</td></tr>\n<tr><td class=\"a\">頬</td><td class=\"b\">ほほ</td><td class=\"c\">也读 ほお；歌里更常用 ほほ</td></tr>\n<tr><td class=\"a\">独り言</td><td class=\"b\">ひとりごと</td><td class=\"c\">「言」读 ごと，不读 げん／こと</td></tr>\n<tr><td class=\"a\">群れ</td><td class=\"b\">むれ</td><td class=\"c\">鸟兽鱼成群；不是「ぐんれ」</td></tr>\n<tr><td class=\"a\">濡れる</td><td class=\"b\">ぬれる</td><td class=\"c\">下一段动词，湿了；不是「しめる」</td></tr>\n<tr><td class=\"a\">鳴く／泣く</td><td class=\"b\">なく</td><td class=\"c\">同音不同字：动物叫／人哭，全曲的双关就靠它</td></tr>\n<tr><td class=\"a\">過ぎ去る</td><td class=\"b\">すぎさる</td><td class=\"c\">過ぎる＋去る 的复合动词，多一层「不再回来」</td></tr>\n<tr><td class=\"a\">だらしない</td><td class=\"b\">だらしない</td><td class=\"c\">一个词写完「邋遢＋没出息」，没有汉字</td></tr>\n<tr><td class=\"a\">離ればなれ</td><td class=\"b\">はなればなれ</td><td class=\"c\">＝離れ離れ，第二词头浊化</td></tr>\n<tr><td class=\"a\">見下ろす</td><td class=\"b\">みおろす</td><td class=\"c\">見る＋下ろす；不要读成「みかくす」</td></tr>\n</tbody></table>\n</div>",
   "deepHtml": "<nav class=\"toc\"><div class=\"in\"><a href=\"#d1\"><span class=\"num\">01</span>骨架</a><a href=\"#d2\"><span class=\"num\">02</span>声部</a><a href=\"#d3\"><span class=\"num\">03</span>鸟</a><a href=\"#d4\"><span class=\"num\">04</span>消失</a><a href=\"#d5\"><span class=\"num\">05</span>谎言</a><a href=\"#d6\"><span class=\"num\">06</span>河与夜</a><a href=\"#d7\"><span class=\"num\">07</span>片假名</a><a href=\"#d8\"><span class=\"num\">08</span>歌名</a><a href=\"#d9\"><span class=\"num\">09</span>读法</a></div></nav>\n<div class=\"card ok\"><h2>先给结论：三分钟版</h2>\n<p class=\"lede\">逐句篇回答「这句在说什么」，这一篇回答<b>「整首在说什么」</b>。四个结论，你先拿走：</p>\n<div class=\"tldr\">\n<div class=\"it\"><div class=\"k\">一句话</div><div class=\"v\">一个人离开了故乡，想不起来了；他没有回去，也没有变好，只是决定<b>继续唱</b>。「ミュージック」不是背景音乐，是唯一的出路。</div></div>\n<div class=\"it\"><div class=\"k\">结构</div><div class=\"v\">65 行看成一圈：<b>鸟→街→群→沉默</b>（主歌四段）→ <b>消失</b>（副歌1）→ <b>房间</b>→ <b>夜与风</b> → <b>触碰</b>（副歌2）→ <b>季节</b> → <b>继续唱</b>。前四段与后四段是镜像，中间两段副歌是两个反向的答案。</div></div>\n<div class=\"it\"><div class=\"k\">藏起来的字</div><div class=\"v\">「<b>鳴く</b>」（鸟叫）在歌词里写了 5 次，「<b>泣く</b>」（人哭）一次都没写——它只以片假名 <b>ナイテイタ</b> 出现。看得见的是鸟叫，哭只存在于声音里。</div></div>\n<div class=\"it\"><div class=\"k\">转折</div><div class=\"v\">副歌 1 是「消えた」（消失），副歌 2 是「触れた」（碰到）。旁白先说「没在哭」，四行后自己承认「哭过，因为哭过」——<b>整首歌的谜底就在这次自打耳光</b>。</div></div>\n</div>\n</div>\n\n<section class=\"sec\" id=\"d1\">\n<div class=\"sec-h\"><span class=\"n\">01</span><h3>骨架：一圈镜像，两个反向答案</h3><span class=\"jp\">構成</span></div>\n<p class=\"lede\">65 行不是线性叙事，而是<b>两轮对称</b>夹住两段副歌。先看这张图，后面每一节都会回到它。</p>\n<div class=\"skwrap\">\n<svg class=\"sk\" viewBox=\"0 0 720 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"全曲结构：一圈镜像，两个反向的答案\">\n<line x1=\"60\" y1=\"330\" x2=\"700\" y2=\"330\" stroke=\"#3a2e5c\" stroke-width=\"1\" stroke-dasharray=\"4 6\"/>\n<g font-family=\"ui-sans-serif,system-ui\" font-size=\"11.5\" fill=\"#6f6889\">\n<text x=\"60\" y=\"350\">0:00</text><text x=\"350\" y=\"350\">2:00</text><text x=\"660\" y=\"350\">5:26</text>\n</g>\n<text x=\"60\" y=\"56\" font-family=\"ui-sans-serif,system-ui\" font-size=\"13\" fill=\"#5fe3f5\">副歌 1 往下沉（消失）</text>\n<text x=\"452\" y=\"56\" font-family=\"ui-sans-serif,system-ui\" font-size=\"13\" fill=\"#ff6fb5\">副歌 2 往上走（触碰）</text>\n<path d=\"M72 252 C112 232 122 204 150 192 C182 180 206 200 236 216 C266 232 288 240 312 246 C336 252 362 262 388 266\" stroke=\"#5fe3f5\" stroke-width=\"2.2\" fill=\"none\"/>\n<path d=\"M388 266 C414 270 432 258 458 250 C482 242 502 224 524 212 C548 198 574 184 598 176 C622 168 646 163 668 160\" stroke=\"#ff6fb5\" stroke-width=\"2.2\" fill=\"none\"/>\n<g font-family=\"ui-sans-serif,system-ui\" font-size=\"12\">\n<g><circle cx=\"72\" cy=\"252\" r=\"5.5\" fill=\"#5fe3f5\"/><text x=\"62\" y=\"238\" fill=\"#5fe3f5\" font-weight=\"700\">A</text><text x=\"52\" y=\"272\" fill=\"#8b84a6\" font-size=\"11.5\">鸟·岩</text></g>\n<g><circle cx=\"150\" cy=\"192\" r=\"5.5\" fill=\"#5fe3f5\"/><text x=\"140\" y=\"178\" fill=\"#5fe3f5\" font-weight=\"700\">B</text><text x=\"140\" y=\"212\" fill=\"#8b84a6\" font-size=\"11.5\">街</text></g>\n<g><circle cx=\"236\" cy=\"216\" r=\"5.5\" fill=\"#b48cf2\"/><text x=\"224\" y=\"202\" fill=\"#b48cf2\" font-weight=\"700\">A′</text><text x=\"222\" y=\"236\" fill=\"#8b84a6\" font-size=\"11.5\">群れ</text></g>\n<g><circle cx=\"312\" cy=\"246\" r=\"5.5\" fill=\"#b48cf2\"/><text x=\"300\" y=\"232\" fill=\"#b48cf2\" font-weight=\"700\">B′</text><text x=\"298\" y=\"266\" fill=\"#8b84a6\" font-size=\"11.5\">沉默</text></g>\n<g><circle cx=\"388\" cy=\"266\" r=\"7\" fill=\"#ff6fb5\"/><text x=\"377\" y=\"250\" fill=\"#ff6fb5\" font-weight=\"700\">S</text><text x=\"364\" y=\"286\" fill=\"#ff6fb5\" font-size=\"11.5\">消えた</text></g>\n<g><circle cx=\"458\" cy=\"250\" r=\"5.5\" fill=\"#b48cf2\"/><text x=\"446\" y=\"236\" fill=\"#b48cf2\" font-weight=\"700\">D</text><text x=\"444\" y=\"270\" fill=\"#8b84a6\" font-size=\"11.5\">房间</text></g>\n<g><circle cx=\"524\" cy=\"212\" r=\"7\" fill=\"#b48cf2\"/><text x=\"512\" y=\"198\" fill=\"#b48cf2\" font-weight=\"700\">S′</text><text x=\"500\" y=\"232\" fill=\"#ff6fb5\" font-size=\"11.5\">触れた</text></g>\n<g><circle cx=\"598\" cy=\"176\" r=\"5.5\" fill=\"#ff6fb5\"/><text x=\"586\" y=\"162\" fill=\"#ff6fb5\" font-weight=\"700\">E</text><text x=\"576\" y=\"196\" fill=\"#8b84a6\" font-size=\"11.5\">季节</text></g>\n<g><circle cx=\"668\" cy=\"160\" r=\"7\" fill=\"#ff6fb5\"/><text x=\"656\" y=\"146\" fill=\"#ff6fb5\" font-weight=\"700\">F</text><text x=\"644\" y=\"180\" fill=\"#8b84a6\" font-size=\"11.5\">继续唱</text></g>\n</g>\n</svg>\n</div>\n<table class=\"df\">\n<thead><tr><th>段</th><th>行数</th><th>内容</th><th>在整首里的功能</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">A</td><td>1–3</td><td class=\"jp\">流れ流れ／鳥は遠くの岩が…／高く空を飛んだ</td><td>视角交代：人在看鸟，其实在说自己</td></tr>\n<tr><td class=\"k\">B</td><td>4–6</td><td class=\"jp\">誰も知らない／知らない街を…／淋しい僕と…</td><td>第一次提问：它和我一样吗</td></tr>\n<tr><td class=\"k\">A′</td><td>7–9</td><td class=\"jp\">離ればなれ／群れの仲間が…／高い声で鳴いた</td><td>同型变奏：岩→仲間（地方→人）</td></tr>\n<tr><td class=\"k\">B′</td><td>10–12</td><td class=\"jp\">何も言わない／言わない街は静かに…／弱い僕と…</td><td>第二次提问：加了一层「沉默」</td></tr>\n<tr><td class=\"k\">C</td><td>13–16</td><td class=\"jp\">痛みや傷や嘘に…／疲れた川面／浮かび流れ／君が住む町で</td><td>视角从鸟落到「我们」，四行才成一句</td></tr>\n<tr><td class=\"k\">S</td><td>17–26</td><td class=\"jp\">消えた…（カワハナガレル）</td><td>答案一：消失</td></tr>\n<tr><td class=\"k\">D</td><td>27–29</td><td class=\"jp\">濡れたままの髪で…／脱ぎ捨てられた服／昨日のままだった</td><td>镜头切进房间，物件代替人说话</td></tr>\n<tr><td class=\"k\">D′</td><td>30–32</td><td class=\"jp\">何も言わない／壁にそれは寄りかかって／見ているようだ</td><td>物件开始看人，沉默升级成被注视</td></tr>\n<tr><td class=\"k\">C′</td><td>33–35</td><td class=\"jp\">…僕の独り言／疲れた夜と…／君の頬へ</td><td>「我们的话」缩成「我的嘟囔」，风往你那边吹</td></tr>\n<tr><td class=\"k\">S′</td><td>36–45</td><td class=\"jp\">触れた…（ヨルハナガレル）</td><td>答案二：触碰（并拆穿谎言）</td></tr>\n<tr><td class=\"k\">E</td><td>46–50</td><td class=\"jp\">振り返った季節に立って…／街で鳴いてたろ</td><td>开始回头看，第一次向对方求认同</td></tr>\n<tr><td class=\"k\">E′</td><td>51–55</td><td class=\"jp\">過ぎ去った季節を待って…／鳥も鳴いてたろ</td><td>同型复唱，只换两个动词</td></tr>\n<tr><td class=\"k\">F</td><td>56–60</td><td class=\"jp\">いつだって僕らを待ってる…／歌い続けるよ</td><td>从问句转成承诺（「我们」回来了）</td></tr>\n<tr><td class=\"k\">F′</td><td>61–65</td><td class=\"jp\">まだ見えないまただ待ってる…／続けるよ</td><td>承诺复唱，把「我」也拉进来收尾</td></tr>\n</tbody>\n</table>\n<div class=\"note\"><b>怎么用这张表</b>：把 A/B 与 A′/B′ 并排看，把 E 与 E′ 并排看，把 S 与 S′ 并排看——三组镜像就是整首歌的骨架。它们全部是<b>同型换词</b>，所以你在听的时候会有「这段听过」的错觉；差异就藏在那几个被换掉的词里。</div>\n</section>\n\n<section class=\"sec\" id=\"d2\">\n<div class=\"sec-h\"><span class=\"n\">02</span><h3>谁在说话：四个声部</h3><span class=\"jp\">声部</span></div>\n<p class=\"lede\">这首歌最容易被忽略的一点是——<b>它有四个说话的人</b>，而且作者故意不标注谁是谁。分不清声部，就会把「旁白」当成主唱的重复，整首的意思就断了。</p>\n<table class=\"df\">\n<thead><tr><th>声部</th><th>行数</th><th>怎么认</th><th>它说了什么</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">主唱「僕」</td><td>57</td><td>汉字段落，第一人称</td><td>回忆、提问、承诺——全部是<b>他</b>的视角</td></tr>\n<tr><td class=\"k\">旁白 <span class=\"jp\">（カタカナ）</span></td><td>8</td><td>整行括号＋全片假名</td><td>河在流／夜在流／还看不见／在哭——<b>解释性的真相</b></td></tr>\n<tr><td class=\"k\">鸟</td><td>5</td><td class=\"jp\">鳥・鳴いた・飛んだ</td><td>被观察的对象，也是他的替身</td></tr>\n<tr><td class=\"k\">它 <span class=\"jp\">それ</span></td><td>2</td><td class=\"jp\">それ・それが</td><td>房间里的衣服／影子，被拟人成「看着他的人」</td></tr>\n</tbody>\n</table>\n<div class=\"stats\">\n<div class=\"st\"><div class=\"lb\">僕<span>一个人</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:100%\"></div></div><div class=\"num\">9 行</div></div>\n<div class=\"st\"><div class=\"lb\">僕ら<span>我们</span></div><div class=\"track\"><div class=\"fill\" style=\"width:33%\"></div></div><div class=\"num\">3 行</div></div>\n<div class=\"st\"><div class=\"lb\">君<span>你</span></div><div class=\"track\"><div class=\"fill\" style=\"width:33%\"></div></div><div class=\"num\">3 行</div></div>\n<div class=\"st\"><div class=\"lb\">鳥<span>它</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:56%\"></div></div><div class=\"num\">5 行</div></div>\n</div>\n<p class=\"lede tight\">（统计按歌词原文的汉字／假名计，重复句也计入。）</p>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">人</span>「僕」→「僕ら」→「僕」<span class=\"lab\">人称</span></div>\n<div class=\"ex\">第 2–12 句：<b>僕</b>（一个人，看着鸟问「是不是和我一样」）</div>\n<div class=\"ex\">第 13 句：<b>僕ら</b>（习惯了痛、伤口和谎言的，我们）</div>\n<div class=\"ex\">第 33 句：<b>僕</b>の独り言（缩回一个人）</div>\n<div class=\"ex\">第 56 句：<b>僕ら</b>（又变回我们）</div>\n<div class=\"ex\">第 63 句：だらしなくて弱い<b>僕</b>だって（最后承认自己）</div>\n<div class=\"bd\">人称的三次变化不是笔误，是<b>距离感</b>：<b>僕</b>＝一个人在房间里；<b>僕ら</b>＝把自己也算进「所有受过伤的人」；再回到<b>僕</b>＝承认那其实只有自己。<b>每一次「僕ら」都出现在他撑不住的时候</b>——用「我们」给自己找同伴。</div>\n</div>\n<div class=\"warn\"><b>最容易读错的地方</b>：第 44 句「君が」后面没有谓语，第 45 句旁白接「（ナイテイタ ナイテイタカラ）」。这两行必须连着读，才是「你哭了」。单独看第 44 句，会以为主唱在叫对方；其实话被旁白抢走了。</div>\n</section>\n\n<section class=\"sec\" id=\"d3\">\n<div class=\"sec-h\"><span class=\"n\">03</span><h3>鸟：不是比喻，是替身</h3><span class=\"jp\">鳥</span></div>\n<p class=\"lede\">从第 1 句到第 12 句，主唱没有说过一句「我很孤独」。他全程在<b>看一只鸟</b>。这不是文学修辞，是这首歌最狠的一处设计：<b>所有关于自己的问题，都用「它」来问</b>。</p>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">问</span>四个问句，全在问鸟<span class=\"lab\">問い</span></div>\n<div class=\"ex\">第 2 句：鳥は遠くの<b>岩</b>が懐かしくなるのか</div>\n<div class=\"ex\">第 8 句：鳥は<b>群れの仲間</b>が懐かしくなるのか</div>\n<div class=\"ex\">第 6 句：淋しい<b>僕と同じ</b>だろうか</div>\n<div class=\"ex\">第 12 句：弱い<b>僕と同じ</b>だろうか</div>\n<div class=\"bd\">前两句问「它想不想」，后两句问「它和我一样吗」。<b>岩</b>是落脚的地方，<b>仲間</b>是同类的人——<b>他问的东西越来越近</b>：先想家，再想人，最后直接问「它是不是也像我这样」。这就是全曲的第一层推进，只靠换两个名词。</div>\n</div>\n<div class=\"card vi\"><h2>「空を飛ぶ」：飞的是鸟，还是他</h2>\n<p class=\"lede\">第 3 句只有一个动作：<b class=\"jp\">高く空を飛んだ</b>（高高地飞过天空）。注意它<b>没有主语</b>——前面一句的主语是「鳥は」，但句尾没有 か，语气从「它飞了」变成了一句陈述。日语可以这样省略主语：谁飞了，读者自己接。而这一段最像自述的，就是这句没有主语的「飞了」。</p>\n<p class=\"lede\">第 7 句「<b class=\"jp\">離ればなれ</b>」（天各一方）同样只有一个词、一行。前后是「牠怀念伙伴」和「牠高声鸣叫」——中间夹着的这四个假名，是<b>鸟群散开的那个瞬间</b>，也是他人生的那个瞬间。</p>\n</div>\n<div class=\"note\"><b>为什么是鸟，不是别的</b>：鸟会<b>飞走</b>，也会<b>叫</b>。飞走＝离开故乡；叫＝发出声音（＝唱歌）。整首歌最后落在「继续唱」，正好把「鸟会叫」这条线接上了——<b>他最后做的，就是那只鸟做过的事</b>。</div>\n</section>\n\n<section class=\"sec\" id=\"d4\">\n<div class=\"sec-h\"><span class=\"n\">04</span><h3>「消えた」到底消了什么</h3><span class=\"jp\">消失</span></div>\n<p class=\"lede\">副歌 1 只有两个词：<b>消えた</b>（消失了）和括号里的旁白。十行里「消えた」出现 6 次，剩下 4 行是旁白——<b>这是全曲词汇量最小、信息量最大的一段</b>。要先看懂它消的是什么，得回到 C 段那四行跨行句。</p>\n<div class=\"card cy\"><h2>C 段：一句话被拉成四行</h2>\n<p class=\"lede jp\">痛みや傷や嘘に慣れた僕らの言葉は／疲れた川面／浮かび流れ／君が住む町で</p>\n<p class=\"lede\">逐句看是四行，其实是一句：<b>「习惯了疼痛、伤口和谎言的我们的话，像疲惫的河面上漂着的东西，浮起来、流走，在你住的那座城——」</b>。谓语留到副歌才出现：<b>消えた</b>。</p>\n<p class=\"lede\">所以消掉的不是「人」，是<b>「话」</b>：那些说过的话、想说的话，一路漂到你住的地方，然后消失了。<b>你没收到，不代表我没说</b>——这是全曲最具体的一次失败。</p>\n</div>\n<table class=\"df\">\n<thead><tr><th>第</th><th>原文</th><th>含义</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">13</td><td class=\"jp\">痛みや傷や嘘に慣れた僕らの言葉は</td><td>主语：<b>话</b>。它先被「习惯」污染过（习惯了痛、伤、谎）</td></tr>\n<tr><td class=\"k\">14</td><td class=\"jp\">疲れた川面</td><td>比喻的载体：<b>河面</b>（时间／媒介），而且它「累了」</td></tr>\n<tr><td class=\"k\">15</td><td class=\"jp\">浮かび流れ</td><td>动作：浮起来 → 流走。<b>浮</b>＝曾经浮出过水面（被看见过一瞬间）</td></tr>\n<tr><td class=\"k\">16</td><td class=\"jp\">君が住む町で</td><td>地点：<b>你那儿</b>。全曲第一次出现「君」</td></tr>\n</tbody>\n</table>\n<div class=\"good\"><b>这一层读懂，副歌才不是复读</b>：副歌的 6 次「消えた」不是在重复一个词，是<b>在给上一句补上句号</b>——「我们的话漂到你那儿……」→「消失了。」一句完整的话，被硬生生拆成两段，中间隔了一个副歌。这就是它为什么必须重复六次：<b>它在把一件已经说完的事，反复确认给自己听</b>。</div>\n<div class=\"note\"><b>另一个细节</b>：C 段用的是「<b>僕ら</b>の言葉」，到 C′ 段（第 33 句）变成「<b>僕</b>の独り言」。同一句法、同一个动词，<b>主语从「我们」缩成「我」，宾语从「话」缩成「嘟囔」</b>——从「我们说过的话」退到「我一个人的自言自语」。这就是副歌之间那三行（D 段房间）真正的作用：他回家了，而家里只有他自己。</div>\n</section>\n\n<section class=\"sec\" id=\"d5\">\n<div class=\"sec-h\"><span class=\"n\">05</span><h3>副歌的谎言：先说没哭，再承认哭过</h3><span class=\"jp\">嘘</span></div>\n<p class=\"lede\">这是全曲最关键的一处，也是我认为整首歌的谜底所在。把副歌 2 的四行旁白连起来读：</p>\n<div class=\"card vi\"><h2>四行之内，自相矛盾</h2>\n<p class=\"lede jp\">（ナイテハイナイ ナイテハイナイ）→ 君が → （ナイテイタ ナイテイタカラ）</p>\n<p class=\"lede\">先否认：<b>并没有在哭</b>。四行后承认：<b>哭过——因为哭过</b>。同一个声部，先说没有，再说有。这不是错，是<b>人在撒谎之后自己拆穿</b>。</p>\n<p class=\"lede\">更狠的是：这句旁白抢在「你」开口之前说完。<b>它替「君」说话，又替「君」认错。</b>主唱从头到尾没有确认过对方在哭——他只知道「君が」（是你），剩下的全是旁白告诉他的。</p>\n</div>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">拆</span>「泣いていない」 vs 「泣いていた」<span class=\"lab\">否定</span></div>\n<div class=\"ex\">泣いて<b>いない</b>：没在哭（状态否认）</div>\n<div class=\"ex\">泣いて<b>はいない</b>：<b>并没有</b>在哭（辩解，带「你别误会」）</div>\n<div class=\"ex\">泣いて<b>いた</b>：当时在哭（过去进行，承认）</div>\n<div class=\"ex\">泣いていた<b>から</b>：因为哭过（把原因留在空中，不接下文）</div>\n<div class=\"bd\">四个形式的差别全在语法里：<b>は</b> 是辩解，<b>た</b> 是承认，<b>から</b> 是欲言又止。作者没有改一个字的内容，只改助词与时态，就把「撒谎 → 圆谎 → 崩掉」演完了。整首歌最像小说的地方就是这四行。</div>\n</div>\n<div class=\"warn\"><b>连带一层含义</b>：为什么第 40 句要否认？因为副歌 2 的主题是「<b>触れた</b>」——他碰到了她。一个人碰到另一个人，对方却在哭，这是最难接住的一刻。所以旁白先替他撒谎：<b>她没哭，我没有错</b>。四行之后撑不住了，才承认。<b>「触れた」不是温情，是触发</b>。</div>\n</section>\n\n<section class=\"sec\" id=\"d6\">\n<div class=\"sec-h\"><span class=\"n\">06</span><h3>河与夜：时间在流，只是换了容器</h3><span class=\"jp\">川と夜</span></div>\n<p class=\"lede\">旁白的 8 行里，有两对是同一个句式的换字：<b class=\"jp\">カワハナガレル</b>（川は流れる＝河在流）与 <b class=\"jp\">ヨルハナガレル</b>（夜は流れる＝夜在流）。这两句在整首歌里的位置是——副歌 1 与副歌 2 的<b>同一格</b>。</p>\n<table class=\"df\">\n<thead><tr><th>副歌 1</th><th>副歌 2</th><th>换了什么</th></tr></thead>\n<tbody>\n<tr><td class=\"jp\">カワハナガレル</td><td class=\"jp\">ヨルハナガレル</td><td><b>河 → 夜</b>。流过的东西从「眼前的水」变成「头顶的时间」</td></tr>\n<tr><td class=\"jp\">マダミエテナイ</td><td class=\"jp\">ナイテハイナイ</td><td><b>看不见 → 没在哭</b>。从「找不到」变成「不敢认」</td></tr>\n<tr><td class=\"jp\">マダミエナイ…カラ</td><td class=\"jp\">ナイテイタ…カラ</td><td><b>因为还看不见 → 因为哭过</b>。两个 から，一个推给别人，一个推给自己</td></tr>\n</tbody>\n</table>\n<div class=\"good\"><b>这组对位的意思是</b>：<b>河在地面上流，夜在时间里流</b>。消失的东西没有被找回，它只是被时间带走了——所以副歌 2 才能从「消失」升级成「触碰」：<b>能碰到，是因为他终于承认「有过」</b>（哭过）。整首歌的时间线，就是这一对旁白的换字。</div>\n<div class=\"note\"><b>「まだ見えない」的三次出现</b>：第 21 句旁白（还看不见）、第 26 句旁白（还看不见，因为还看不见）、第 62 句主唱自己（还没看见，就那么等着）。<b>同一句话从旁白嘴里，最后进到主唱嘴里</b>——这是全曲唯一一条「旁白的台词被主唱接管」的线。意思很明确：他不再听别人解释，自己认了「还没看见」。</div>\n</section>\n\n<section class=\"sec\" id=\"d7\">\n<div class=\"sec-h\"><span class=\"n\">07</span><h3>为什么是片假名：看得见的字与看不见的字</h3><span class=\"jp\">表記</span></div>\n<p class=\"lede\">这首歌有一个数字上的事实，比任何形容词都说明问题：<b>「鳴く」（鸟叫）在歌词里写了 5 次，「泣く」（人哭）一次都没写</b>。整首歌里唯一出现「哭」的地方，是片假名的 <b>ナイテイタ</b>。</p>\n<table class=\"df\">\n<thead><tr><th>假名</th><th>汉字原形</th><th>歌词里怎么写的</th><th>含义</th></tr></thead>\n<tbody>\n<tr><td class=\"jp\">ナイテイタ</td><td class=\"jp\">泣いていた</td><td><b>只有片假名</b>，没有汉字「泣」</td><td>哭过（人）</td></tr>\n<tr><td class=\"jp\">ナイテハイナイ</td><td class=\"jp\">泣いてはいない</td><td>同上</td><td>并没有在哭（否认）</td></tr>\n<tr><td class=\"jp\">鳴いた</td><td class=\"jp\">鳴いた</td><td><b>汉字</b>，出现在第 9 句</td><td>叫了（鸟）</td></tr>\n</tbody>\n</table>\n<div class=\"card vi\"><h2>汉字分配＝意义分配</h2>\n<p class=\"lede\">日语里 鳴く（动物叫）和 泣く（人哭）同音，都是 <b>なく</b>。作者做了一个极其克制的选择：<b>鸟叫用汉字写出来，人哭只用片假名藏在旁白里</b>。</p>\n<p class=\"lede\">于是听众听到的是同一个音，看到的却是两种东西：<b>你看得见鸟叫，你看不见有人哭</b>。这一点不需要任何解释，光是「哪里出现了汉字」就已经说明了——<b>悲伤在这首歌里是被消音的</b>。</p>\n<p class=\"lede\">同一个逻辑也解释了那 8 行全片假名旁白：<b>片假名＝只有声音、没有字面</b>。写成汉字，它就成了「一句话」；写成片假名，它才是「一团声音」。作者要的就是它在背景里飘着，直到你忽然听懂。这是日语歌词特有的可能性——中文写不出来，因为中文没有两套完全等同于「同一串音、不同字面」的表记。</p>\n</div>\n<div class=\"note\"><b>顺带一个读音细节</b>：旁白「マダミエテナイ」＝まだ見え<b>て</b>いない（带 て），「マダミエナイ」＝まだ見えない（不带 て）。前者是「到现在还没看见」（还有余地），后者是「就是看不见」（断了）。副歌从前者走到后者，两个片假名之差，态度变了。</div>\n</section>\n\n<section class=\"sec\" id=\"d8\">\n<div class=\"sec-h\"><span class=\"n\">08</span><h3>歌名「ミュージック」的三层意思</h3><span class=\"jp\">題名</span></div>\n<p class=\"lede\">歌名叫《ミュージック》——英文 music 的音译，不是「音楽」。这个选择本身就带着距离感：<b>它不是母语的词，是一句外来语</b>，像一个人嘴里念出来的、不太确定的东西。</p>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">层</span>三层意思，从具体到抽象<span class=\"lab\">題</span></div>\n<div class=\"ex\"><b>① 字面</b>：这首歌本身是一首音乐作品，标题在说「这就是音乐」——像一张自指的标签。</div>\n<div class=\"ex\"><b>② 行为</b>：全曲最后一个动作是「歌い続けるよ」（我会继续唱下去）。<b>ミュージック ＝ 继续唱这件事</b>，不是产品，是行为。</div>\n<div class=\"ex\"><b>③ 出路</b>：他丢掉了故乡、记忆、话，甚至「看见」的能力；剩下唯一还能做的，就是发出声音。<b>ミュージック 是失败之后唯一没被拿走的东西</b>。</div>\n<div class=\"bd\">所以歌名不是装饰，是<b>答案提前写在封面上</b>。整首歌绕了一大圈（鸟、街、房间、夜、你），最后回到标题：<b>还剩什么？还剩音乐。</b></div>\n</div>\n<div class=\"card ok\"><h2>为什么结尾必须是「続けるよ」</h2>\n<p class=\"lede\">最后 10 行（F 与 F′）是两段几乎相同的复唱，只在中间三行换了名词：<b>痛みや傷 → まだ見えないまま／夜 → だらしなくて弱い僕</b>。而两句「歌い続けるよ」一字不改。</p>\n<p class=\"lede\">结尾最妙的是最后一行的省略：<b class=\"jp\">続けるよ</b>——「歌い」没了。他不再说明继续什么，因为已经不必说了。<b>一个动词，两个假名，就是整首歌的句号。</b></p>\n<p class=\"lede\">注意这不是「振作起来」的结局：<b>他还是だらしなくて弱い</b>（第 63 句自己承认），<b>还是看不见</b>（第 62 句），<b>夜还是没变</b>（第 58 句）。他没有变好，只是决定继续唱。<b>这是全曲唯一一次主动的选择，也是它比「加油」真诚的地方。</b></p>\n</div>\n</section>\n\n<section class=\"sec\" id=\"d9\">\n<div class=\"sec-h\"><span class=\"n\">09</span><h3>读法路线与自测</h3><span class=\"jp\">読み方</span></div>\n<p class=\"lede\">这首歌不适合从头到尾逐句读（会遇到 6 次「消えた」和 5 次「触れた」）。建议按<b>三条线</b>走，每条线只读 6–10 行。</p>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">路</span>三条读法线<span class=\"lab\">ルート</span></div>\n<div class=\"ex\"><b>线一 · 鸟线</b>（第 1–12 句）：只看鸟的四次提问，注意岩→仲間、淋しい→弱い两次换词。</div>\n<div class=\"ex\"><b>线二 · 消失线</b>（第 13–26 句）：一口气读完 C 段四行＋副歌，确认「消えた」的主语是<b>话</b>。</div>\n<div class=\"ex\"><b>线三 · 谎言线</b>（第 33–45 句）：从「僕の独り言」读到「ナイテイタ」，体会四行之内自打耳光。</div>\n<div class=\"bd\">三条线走完，再读第 46–65 句。<b>前面的疑问在这里全部变成承诺</b>，你会发现结尾那 20 行一点都不突兀——它只是把三条线合上了。</div>\n</div>\n<div class=\"q\"><span class=\"no\">Q1</span>「消えた」的主语是什么？<span class=\"ask\">为什么不是「我消失了」？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">主语是第 13 句的「<b>僕らの言葉</b>」（我们的话）。它在第 14–16 句被比作河面上漂浮的东西，漂到「君が住む町」——然后第 17 句才出现谓语「消えた」。所以消失的是<b>话</b>，不是人。这也解释了为什么副歌之后他还在唱歌：人没消失，话消失了。</div></details>\n<div class=\"q\"><span class=\"no\">Q2</span>为什么「鳴く」写汉字，「泣く」只写片假名？<span class=\"ask\">作者在想什么？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">两词同音（なく）。汉字出现了 5 次，全是鸟；人哭的那两次（ナイテイタ／ナイテハイナイ）只用片假名，没有汉字「泣」。<b>看得见鸟叫，看不见有人哭</b>——悲伤被消音，这就是全曲最核心的表达。片假名在这里不是风格，是<b>遮蔽</b>。</div></details>\n<div class=\"q\"><span class=\"no\">Q3</span>「触れた」和「消えた」是什么关系？<span class=\"ask\">为什么副歌要换这一个词？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">两段副歌结构完全一样，只有动词换了。<b>消えた</b>＝什么都没剩下；<b>触れた</b>＝留下了感觉。两个都是过去式、都无法挽回，但方向相反：一个往下沉，一个往上走。换词的位置正好对应旁白从「还看不见」变成「哭过，因为哭过」——<b>承认了「有过」，才碰得到。</b></div></details>\n<div class=\"q\"><span class=\"no\">Q4</span>第 44–45 句为什么会自相矛盾？<span class=\"ask\">是谁在撒谎？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">第 40 句旁白「泣いてはいない」（并没有在哭），第 45 句旁白「泣いていたから」（哭过，因为哭过）。同一个声部先否认后承认。撒谎的是<b>旁白＝主唱自己的内心</b>：他先替对方辩解（她没哭，我没做错什么），四行后撑不住才认。语法上只差一个「は」和一个「た」，情绪上是从辩解到崩盘。</div></details>\n<div class=\"q\"><span class=\"no\">Q5</span>结局算「积极」吗？<span class=\"ask\">「歌い続けるよ」是哪一种继续？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">不算振作。紧挨着的三句分别是：<b>まだ見えないまま</b>（还是看不见）、<b>だらしなくて弱い僕だって</b>（就算是这么没出息的我也）、<b>変わらないままの夜だって</b>（就算夜一成不变）。他没有变好，只是<b>决定继续唱</b>。<b>続ける</b> 是他动词——「继续」这个动作是他自己做的，不是事情自己延续下去。这是全曲唯一一次主动。</div></details>\n<div class=\"good\"><b>最后一句</b>：这首歌表面在写鸟，其实在写一个「说不出、回不去、也哭不出来」的人。它没有给他任何转机——只是把麦克风递回他手里，然后停在那里。</div>\n</section>",

   "byline": "結束バンド ／ 作詞・作曲：<code>後藤正文</code>（ASIAN KUNG-FU GENERATION） ／ 編曲：<code>三井律郎</code> ／ 2022-12-25（原曲 2008-02-06）<br>目标水平：<code>JLPT N4–N5</code> ／ 全曲逐句拆词 + 句法结构 + 重复句对照",
   "footer": "逐句拆解仅供日语学习参考 · 歌词著作权归 後藤正文 / ASIAN KUNG-FU GENERATION 及原权利人所有<br>歌词据 <a href=\"https://www.uta-net.com/song/330460/\">歌ネット</a> 与 <a href=\"https://utaten.com/lyric/jb10802506/\">UtaTen</a> 两站交叉核对 · 中文译文与解析为本站原创",
   "nav": "転がる岩、君に朝が降る",
   "cardsTopHtml": "<div class=\"card hot\">\n<h2>先说清楚：这首歌问了两遍，一次也没答上来</h2>\n<p>表面上是「石头滚、天亮」的一首歌，实际上是一次<b>没有答案的自问</b>：他从头到尾都在问「我弄错了什么／我弄丢了什么」，问了两次，得到的回答是同一句「连那个我都不知道」。最后他没有找到答案，只是把要跑的地方变大了。</p><p>32 句歌词里有三个坑，提前排掉读起来会顺很多：</p><p>① <b>全曲只改了一个名词</b>——第 14 句「凍てつく<b>地面</b>を」、第 32 句「凍てつく<b>世界</b>を」。从脚下的一块地，扩到整个外部世界。同一个动作，尺度变了，含义就变了。</p><p>② <b>两次提问是同型的</b>：第 8 句「何を<b>間違った</b>？」、第 26 句「何を<b>なくした</b>？」；而两次的回答也没变——「それさえもわからないんだ」。问题从「弄错」变成「弄丢」，答案一字不改。</p><p>③ <b>「理由」读作 わけ</b>，不是 りゆう。第 15 句「理由もないのに」＝明明没有任何理由。这个读法只在歌里成立，原曲的歌词页专门给它标了假名。</p><p>建议用法：先只看两段主歌，把「想改变世界 → 结果连自己都找不到北」这条线下沉；再看三段副歌，它们几乎一模一样，只有<b>末尾那一个名词</b>在变。这首歌的力气全在那一个词上。</p>\n</div>\n\n<div class=\"card\">\n<h2>N4–N5 生存指南：这首歌里反复出现的 8 个套路</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">① 〜のに：明明…却</div><div class=\"d\">「持ってない<b>のに</b>胸が痛んだ」＝明明没有，胸口却疼。のに 前后<b>必须是相反</b>的两件事，它自带说话人的不服气。全曲出现三次（第 11、15 句与副歌 3 的重复），是这首歌情绪的底噪。</div><div class=\"ex\">初めから持ってないのに胸が痛んだ ／ 理由もないのに朝が来る</div></div>\n<div class=\"mini\"><div class=\"t\">② 〜ように：比况，不是「为了」</div><div class=\"d\">「転がる<b>ように</b>走り出した」＝像滚一样跑起来。「ように」在这里是<b>比喻</b>，不是「为了」。要表目的得用「ために」或「〜ように」＋可能形（走れるように）。同样四个假名，两种意思，看后面接什么。</div><div class=\"ex\">転がるように走り出した</div></div>\n<div class=\"mini\"><div class=\"t\">③ なくす / なくなる：弄丢 vs 没了</div><div class=\"d\">なくす＝（我）把它弄丢了（他动词）；なくなる＝它没了／人去世（自动词）。第 26 句问的是「何をなくした？」——用他动词，<b>责任在自己</b>：不是「丢了」，是「被我弄丢了」。</div><div class=\"ex\">何をなくした？ ／ 戦争をなくす</div></div>\n<div class=\"mini\"><div class=\"t\">④ 動詞＋出す：从里往外</div><div class=\"d\">暴く（揭发）→ 暴き出す（揭出来）、走る（跑）→ 走り出す（跑起来）。「出す」加在动词后，表示动作<b>从内部朝外发生、或突然开始</b>。全曲两个关键词都是这个构造。</div><div class=\"ex\">暴き出す朝 ／ 走り出した</div></div>\n<div class=\"mini\"><div class=\"t\">⑤ 〜やしない：强烈的否定</div><div class=\"d\">「泣け<b>やしない</b>」＝根本哭不出来。动词可能形＋やしない，是口语里最硬的否定之一，带「想也想不成」的无力感。和「泣けない」相比，它多一层<b>情绪</b>。</div><div class=\"ex\">泣けやしない</div></div>\n<div class=\"mini\"><div class=\"t\">⑥ 〜さえも：连…都</div><div class=\"d\">「それ<b>さえも</b>わからない」＝连那个都不知道。さえ＝连（极端举例），も＝也。两个助词叠在一起，把「不知道」推到最底层：<b>不只是不懂，是连该懂的那点都不懂</b>。</div><div class=\"ex\">それさえもわからないんだ</div></div>\n<div class=\"mini\"><div class=\"t\">⑦ 移动动词经过的地方用「を」</div><div class=\"d\">「丘<b>を</b>越える」「角<b>を</b>曲がる」「地面<b>を</b>転がる」——凡是<b>穿过、经过</b>某个场所，助词都用 を，不是 に。这是 N4 阶段最容易错的一条。</div><div class=\"ex\">あの丘を越えた ／ 角を曲がって ／ 凍てつく地面を転がる</div></div>\n<div class=\"mini\"><div class=\"t\">⑧ 小さな vs 小さい</div><div class=\"d\">小さい 是形容词，能作谓语（車が小さい）；小さな 是<b>连体词</b>，只能放在名词前（小さな車）。歌词选了 小さな，句子更短、更快，也更像回忆里的一个画面。</div><div class=\"ex\">赤い小さな車</div></div>\n</div>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>读音陷阱：这些字别读错</h2>\n<table class=\"sx\"><thead><tr><th>词</th><th>读音</th><th>易错点</th></tr></thead><tbody>\n<tr><td class=\"a\">理由</td><td class=\"b\">わけ</td><td class=\"c\">歌里读 わけ，不读 りゆう。原曲歌词页专门标了假名</td></tr>\n<tr><td class=\"a\">術</td><td class=\"b\">すべ</td><td class=\"c\">不读 じゅつ。術がない＝没办法</td></tr>\n<tr><td class=\"a\">大逸れた</td><td class=\"b\">おおそれた</td><td class=\"c\">不是「恐れた（害怕）」；＝说大话的、不知分寸的</td></tr>\n<tr><td class=\"a\">凍てつく</td><td class=\"b\">いてつく</td><td class=\"c\">冻透、冻僵；别读成 こごてつく</td></tr>\n<tr><td class=\"a\">地面</td><td class=\"b\">じめん</td><td class=\"c\">不读 ちめん</td></tr>\n<tr><td class=\"a\">角</td><td class=\"b\">かど</td><td class=\"c\">拐角；「つの」是犄角</td></tr>\n<tr><td class=\"a\">芽生える</td><td class=\"b\">めばえる</td><td class=\"c\">芽＋生える，发芽；也用于抽象的「希望萌芽」</td></tr>\n<tr><td class=\"a\">暴き出す</td><td class=\"b\">あばきだす</td><td class=\"c\">暴く＝揭发，不读 ぼうく</td></tr>\n<tr><td class=\"a\">何処</td><td class=\"b\">どこ</td><td class=\"c\">文学表记，日常写 どこ</td></tr>\n<tr><td class=\"a\">此処</td><td class=\"b\">ここ</td><td class=\"c\">文学表记，日常写 ここ</td></tr>\n<tr><td class=\"a\">嗚呼</td><td class=\"b\">ああ</td><td class=\"c\">文学表记，日常不写汉字</td></tr>\n<tr><td class=\"a\">俳優</td><td class=\"b\">はいゆう</td><td class=\"c\">不读 はいゆ</td></tr>\n</tbody></table>\n</div>"
