   "cardsTopHtml": "<div class=\"card hot\">\n<h2>先说清楚：这是一份用流行语写的病历</h2>\n<p>表面上是一首「疯女孩跳舞」的嗨歌，实际上是一份<b>失败清单</b>：神经、学业、面试、手机、密码——全部出问题，而且每一句都用「说明书」或「广告」的语气说出来。全曲的发泄方式不是哭，是<b>把痛苦翻译成流行语</b>。</p><p>61 行歌词里有五个坑，提前排掉会顺很多：</p><p>① <b>三处「机器在说话」的括号</b>——第 16 句（自律神経に問題があるかもしれません）、第 28 句（この電話番号は現在使われておりません）、第 44 句（暗証番号をもう一度お確かめください）。三句都没有主语、都不容商量，是「系统在对你说：你不合格」。</p><p>② <b>四字熟語和网络口语打架</b>：諸行無常／一蓮托生／一問一答 挨着 ヤバイ／スク水／無理ゲー／情弱。第 12 句「そう仰せにては候えども」是全场最狠的一句——<b>用最恭敬的古语说最不听话的话</b>。</p><p>③ <b>副歌是一张免罪符</b>：どうせ100年後の今頃には みんな死んじゃってんだから。因为大家都会死，所以现在怎么活都不算错。这个理由是<u>全曲唯一的逻辑</u>，也是它最危险的地方。</p><p>④ <b>结尾不是新答案</b>：第 60–61 句与第 26–27 句一字不差。整首歌唱了两轮问句、三次「踊りましょう」，最后回到同一个「月の向こうまで」——<b>闭环，什么都没解决</b>。</p><p>⑤ <b>难度偏高是这首歌的实情</b>：全曲 61 行里有 21 行是 N2、32 行是 N3，只有 3 行是 N4。生词密度远高于其他曲目——建议先读带 <b>N4</b> 徽章的三行建立语感，再硬啃主歌。</p><p>建议用法：先读主歌两段（第 1–20 句、第 29–48 句），它们是同一件失败的两套说法——一套是「病症」，一套是「东京成功学」。再读三段副歌，注意每次「さあさあ」前面刚发生了什么。这首歌的力气不在词藻，在<b>它从不用正经语气说正经事</b>。</p>\n</div>\n\n<div class=\"card\">\n<h2>先把这 8 个套路拿下：这首歌真正的语法骨架</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">① 〜てしまう / 〜ちゃう：做完＋懊悔</div><div class=\"d\">死んでしまう → 死んじゃう → 死んじゃって。ちゃう 是 てしまう 的口语形，带「不小心做了」「做了也没用」两种味道。第 24 句「死んじゃってんだから」一句里塞了 4 个口语变化，唱出来只有七个音。</div><div class=\"ex\">みんな死んじゃってんだから ／ イっちゃって</div></div>\n<div class=\"mini\"><div class=\"t\">② 〜に合わせて：合着…的拍子</div><div class=\"d\">「リズムに合わせて」＝跟着节奏。全曲用了两次：第 9 句配「諸行無常」（佛经），第 37 句配「スラップベース」（放克）。<b>同一个句型，一次配宇宙，一次配乐器</b>——这是全曲最妙的平行。</div><div class=\"ex\">諸行無常のリズムに合わせて ／ スラップベースの刻みに合わせて</div></div>\n<div class=\"mini\"><div class=\"t\">③ 〜たがる：别人「想」做</div><div class=\"d\">する → したがる。「ドヤ顔したがる」＝（那些人）总想摆出得意的脸。日语里 たい 只能说自己，说别人要用 たがる——<b>这一换，就把「炫耀」说成了别人的毛病</b>。</div><div class=\"ex\">ドヤ顔したがる東京バイアス</div></div>\n<div class=\"mini\"><div class=\"t\">④ 受身＋て形：我不是主动的</div><div class=\"d\">「手招きされて尻尾振ってる」＝被招手就摇尾巴。「される」让「我」没有选择权，下一句的动作就成了条件反射。全曲的「我」几乎都是被动的。</div><div class=\"ex\">手招きされて尻尾振ってる ／ 愛され給うて</div></div>\n<div class=\"mini\"><div class=\"t\">⑤ 〜させたら：让…的话</div><div class=\"d\">分泌する → 分泌させる（使役）→ させたら（假定）。「脑汁分泌させたら」＝如果让它分泌的话。<b>快感不是自己来的，是被弄出来的</b>——这个「させ」是全曲的姿态。</div><div class=\"ex\">脳汁分泌させたら</div></div>\n<div class=\"mini\"><div class=\"t\">⑥ 〜ば：假定与「一…就」</div><div class=\"d\">上げれば（提高的话）、唄えば（一唱的话）。第 10 句的条件被第 12 句推翻，第 38 句的条件直接把「三个日本符号」变成了开关。</div><div class=\"ex\">女子力上げれば ／ ゲイシャが唄えば</div></div>\n<div class=\"mini\"><div class=\"t\">⑦ 体言止め：名词并置</div><div class=\"d\">「面接ばっくれ交渉決裂」「携帯紛失 精神壊滅」「二次会 焼肉 五反田」——名词之间不加助词，像新闻标题、像群聊通知。<b>助词一删，事情就变成了清单</b>，情绪反而更冷。</div><div class=\"ex\">携帯紛失 精神壊滅 ／ 二次会 焼肉 五反田</div></div>\n<div class=\"mini\"><div class=\"t\">⑧ カタカナ 的双重用途</div><div class=\"d\">①把俗语写成片假名来避开审查、保留发音（イく）；②把日本的刻板印象写成片假名，表示「这是外国人眼里的日本」（ハラキリ・フジヤマ・ゲイシャ）。同一手法，两个方向。</div><div class=\"ex\">月の向こうまでイっちゃって ／ ハラキリ フジヤマ ゲイシャ</div></div>\n</div>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>读音陷阱：这些字别读错</h2>\n<table class=\"sx\"><thead><tr><th>词</th><th>读音</th><th>易错点</th></tr></thead><tbody>\n<tr><td class=\"a\">脳漿</td><td class=\"b\">のうしょう</td><td class=\"c\">不是 のうしょ。指脑脊液，不是「脑」</td></tr>\n<tr><td class=\"a\">炸裂</td><td class=\"b\">さくれつ</td><td class=\"c\">不读 さくれち；＝爆开</td></tr>\n<tr><td class=\"a\">自問自答</td><td class=\"b\">じもんじとう</td><td class=\"c\">四字熟语：自己问自己答</td></tr>\n<tr><td class=\"a\">無限苦言</td><td class=\"b\">むげんくげん</td><td class=\"c\">苦言＝忠告、不中听的话；这里被「無限」放大</td></tr>\n<tr><td class=\"a\">挫傷</td><td class=\"b\">ざしょう</td><td class=\"c\">挫伤（医学）；不是 ざっしょう</td></tr>\n<tr><td class=\"a\">暗礁に乗り上げる</td><td class=\"b\">あんしょうにのりあげる</td><td class=\"c\">惯用：触礁＝事情卡住，不读 あんしょう 为「あんしょう」以外的音</td></tr>\n<tr><td class=\"a\">前頭葉</td><td class=\"b\">ぜんとうよう</td><td class=\"c\">脑的额叶；不要读成 まえがしら</td></tr>\n<tr><td class=\"a\">吐瀉物</td><td class=\"b\">としゃぶつ</td><td class=\"c\">吐＝吐、瀉＝泻；注意不是 としゃもの</td></tr>\n<tr><td class=\"a\">妄想デフラグ</td><td class=\"b\">もうそうでふらぐ</td><td class=\"c\">デフラグ＝磁盘碎片整理；电脑术语</td></tr>\n<tr><td class=\"a\">御託</td><td class=\"b\">ごたく</td><td class=\"c\">「御託を並べる」＝说废话，固定搭配</td></tr>\n<tr><td class=\"a\">凹凸</td><td class=\"b\">おうとつ</td><td class=\"c\">这里指身体；不读 でこぼこ（口语另读）</td></tr>\n<tr><td class=\"a\">一蓮托生</td><td class=\"b\">いちれんたくしょう</td><td class=\"c\">佛教语，＝同舟共济；注意「托」不写「託」</td></tr>\n<tr><td class=\"a\">道化師</td><td class=\"b\">どうけし</td><td class=\"c\">＝ピエロ；不读 みちばけし</td></tr>\n<tr><td class=\"a\">触覚</td><td class=\"b\">しょっかく</td><td class=\"c\">触角（昆虫）；不要读成 しょくかく</td></tr>\n<tr><td class=\"a\">刻み</td><td class=\"b\">きざみ</td><td class=\"c\">节奏的切分；动词是 刻む</td></tr>\n<tr><td class=\"a\">情弱</td><td class=\"b\">じょうじゃく</td><td class=\"c\">「情報弱者」的省略，网络贬义</td></tr>\n<tr><td class=\"a\">ガラケー</td><td class=\"b\">がらけー</td><td class=\"c\">＝ガラパゴス携帯，功能机；不是「翻盖机」的正式说法</td></tr>\n<tr><td class=\"a\">暗証番号</td><td class=\"b\">あんしょうばんごう</td><td class=\"c\">密码；不要读成 あんじょう</td></tr>\n<tr><td class=\"a\">従順</td><td class=\"b\">じゅうじゅん</td><td class=\"c\">顺从；不读 しょうじゅん</td></tr>\n<tr><td class=\"a\">麻縄</td><td class=\"b\">あさなわ</td><td class=\"c\">麻绳；日语里多指捆绑用绳</td></tr>\n<tr><td class=\"a\">生まれ変わる</td><td class=\"b\">うまれかわる</td><td class=\"c\">转生；不是「重生一次」的字面义</td></tr>\n<tr><td class=\"a\">古くさい</td><td class=\"b\">ふるくさい</td><td class=\"c\">老土、过时（带「有味道」的贬义）</td></tr>\n</tbody></table>\n</div>",
   "deepHtml": "<nav class=\"toc\"><div class=\"in\"><a href=\"#d1\"><span class=\"num\">01</span>骨架</a><a href=\"#d2\"><span class=\"num\">02</span>声部</a><a href=\"#d3\"><span class=\"num\">03</span>括弧</a><a href=\"#d4\"><span class=\"num\">04</span>古今</a><a href=\"#d5\"><span class=\"num\">05</span>身体</a><a href=\"#d6\"><span class=\"num\">06</span>百年</a><a href=\"#d7\"><span class=\"num\">07</span>道具</a><a href=\"#d8\"><span class=\"num\">08</span>闭环</a><a href=\"#d9\"><span class=\"num\">09</span>读法</a></div></nav>\n<div class=\"card ok\"><h2>先给结论：三分钟版</h2>\n<p class=\"lede\">逐句篇回答「这句在说什么」，这一篇回答<b>「整首是怎么搭起来的」</b>。四个结论，你先拿走：</p>\n<div class=\"tldr\">\n<div class=\"it\"><div class=\"k\">一句话</div><div class=\"v\">这不是「疯女孩跳舞」，是一份<b>病历</b>：一个人把自己的故障写成清单，再给这份清单配一首舞曲。全曲从头到尾没有求救，只有<b>报告</b>——报告到最后一格，她才开始喊「抱紧我」。</div></div>\n<div class=\"it\"><div class=\"k\">结构</div><div class=\"v\">61 行＝<b>两份各 20 行的清单</b>（主歌 1「症状」／主歌 2「成功学」）＋<b>三段副歌</b>＋<b>一行断电</b>（第 28 句的电话录音）。两份清单是同一个人写的，只是一个写身体，一个写东京。</div></div>\n<div class=\"it\"><div class=\"k\">没有问句</div><div class=\"v\">全曲 61 行<b>一个问号都没有</b>。所有句子都是宣言（「私は〜」）、命令（「殴って」「抱きしめて」）或说明书（「※…ください」）。<b>她从头到尾没在问任何人任何事</b>——这才是「脑浆炸裂」的真正意思。</div></div>\n<div class=\"it\"><div class=\"k\">闭环</div><div class=\"v\">61 行里只有 <b>56 行是新的</b>：第 49–52 句逐字重复第 21–24 句，第 56 句重复第 50 句。最后两句（60–61）又和第 26–27 句一字不差。<b>歌不是走到结尾，是绕回了原处</b>。</div></div>\n</div>\n</div>\n\n<section class=\"sec\" id=\"d1\">\n<div class=\"sec-h\"><span class=\"n\">01</span><h3>骨架：两份清单，一次断电</h3><span class=\"jp\">構成</span></div>\n<p class=\"lede\">这首歌的段落不是「主歌—副歌」的循环，而是<b>两块对称的板</b>夹住一根轴。先把板块画出来，后面每一节都会回到它。</p>\n<div class=\"skwrap\">\n<svg class=\"sk\" viewBox=\"0 0 720 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"全曲结构：两份各二十行的清单，中间一行断电\">\n<line x1=\"40\" y1=\"200\" x2=\"700\" y2=\"200\" stroke=\"#3a2e5c\" stroke-width=\"1\" stroke-dasharray=\"4 6\"/>\n<text x=\"40\" y=\"56\" font-family=\"ui-sans-serif,system-ui\" font-size=\"13\" fill=\"#5fe3f5\">主歌 1：症状（第 1–20 句）</text>\n<text x=\"360\" y=\"56\" font-family=\"ui-sans-serif,system-ui\" font-size=\"13\" fill=\"#ff6fb5\">主歌 2：东京成功学（第 29–48 句）</text>\n<g font-family=\"ui-sans-serif,system-ui\" font-size=\"12\">\n<rect x=\"40\" y=\"170\" width=\"210\" height=\"30\" rx=\"6\" fill=\"rgba(95,227,245,.14)\" stroke=\"#5fe3f5\" stroke-width=\"1.2\"/>\n<rect x=\"250\" y=\"170\" width=\"70\" height=\"30\" rx=\"6\" fill=\"rgba(180,140,242,.16)\" stroke=\"#b48cf2\" stroke-width=\"1.2\"/>\n<rect x=\"330\" y=\"160\" width=\"18\" height=\"50\" rx=\"4\" fill=\"rgba(255,255,255,.06)\" stroke=\"#8b84a6\" stroke-width=\"1\"/>\n<rect x=\"348\" y=\"170\" width=\"210\" height=\"30\" rx=\"6\" fill=\"rgba(255,111,181,.14)\" stroke=\"#ff6fb5\" stroke-width=\"1.2\"/>\n<rect x=\"558\" y=\"170\" width=\"70\" height=\"30\" rx=\"6\" fill=\"rgba(180,140,242,.16)\" stroke=\"#b48cf2\" stroke-width=\"1.2\"/>\n<rect x=\"628\" y=\"170\" width=\"62\" height=\"30\" rx=\"6\" fill=\"rgba(255,255,255,.08)\" stroke=\"#8b84a6\" stroke-width=\"1.2\"/>\n<text x=\"145\" y=\"190\" fill=\"#5fe3f5\" text-anchor=\"middle\" font-weight=\"700\">20 行</text>\n<text x=\"285\" y=\"190\" fill=\"#b48cf2\" text-anchor=\"middle\" font-weight=\"700\">副歌 1</text>\n<text x=\"339\" y=\"152\" fill=\"#8b84a6\" text-anchor=\"middle\" font-weight=\"700\">⚡</text>\n<text x=\"453\" y=\"190\" fill=\"#ff6fb5\" text-anchor=\"middle\" font-weight=\"700\">20 行</text>\n<text x=\"593\" y=\"190\" fill=\"#b48cf2\" text-anchor=\"middle\" font-weight=\"700\">副歌 2</text>\n<text x=\"659\" y=\"190\" fill=\"#8b84a6\" text-anchor=\"middle\" font-weight=\"700\">大サビ</text>\n<text x=\"145\" y=\"226\" fill=\"#8b84a6\" font-size=\"11.5\" text-anchor=\"middle\">神经·学业·面试·手机</text>\n<text x=\"285\" y=\"226\" fill=\"#8b84a6\" font-size=\"11.5\" text-anchor=\"middle\">跳舞的理由</text>\n<text x=\"339\" y=\"242\" fill=\"#8b84a6\" font-size=\"11\" text-anchor=\"middle\">第28句</text>\n<text x=\"453\" y=\"226\" fill=\"#8b84a6\" font-size=\"11.5\" text-anchor=\"middle\">律师·星巴克·偶像·甜点</text>\n<text x=\"593\" y=\"226\" fill=\"#8b84a6\" font-size=\"11.5\" text-anchor=\"middle\">从发抖到宇宙</text>\n<text x=\"659\" y=\"226\" fill=\"#8b84a6\" font-size=\"11.5\" text-anchor=\"middle\">脱掉身体</text>\n</g>\n</svg>\n</div>\n<table class=\"df\">\n<thead><tr><th>段</th><th>句</th><th>内容</th><th>在整首里的功能</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">01–03</td><td>1–20</td><td>病历清单：神经、学业、手机、面试</td><td>把自己<b>当病例</b>报告一遍，最后一行通向身体</td></tr>\n<tr><td class=\"k\">04</td><td>21–27</td><td>副歌 1：抱紧我／分泌／月亮</td><td>给上面二十行配一个<b>跳舞的理由</b></td></tr>\n<tr><td class=\"k\">05</td><td>28</td><td>电话录音：此号码已停用</td><td><b>唯一的轴</b>：全曲在这里断电，然后换一个人写</td></tr>\n<tr><td class=\"k\">06–08</td><td>29–48</td><td>东京清单：律师、偶像、甜点、绳索</td><td>把「病」换成「成功」，<b>同一个人的另一套话术</b></td></tr>\n<tr><td class=\"k\">09</td><td>49–55</td><td>副歌 2：一样的三句＋新的三句</td><td>重复前四句，<b>只把终点从月亮换到宇宙</b></td></tr>\n<tr><td class=\"k\">10</td><td>56–61</td><td>大サビ：一百年后的我</td><td>唯一一次「希望」，<b>但它建在同一个百年上</b></td></tr>\n</tbody>\n</table>\n<div class=\"note\"><b>为什么说这是两块板</b>：主歌 1 和主歌 2 各 20 行，句数完全相等；副歌 1 和副歌 2 各 7 行，前三句一字不改。作者不是随手排段落——<b>他是把一首歌写成了一张对折的纸</b>，折痕就是第 28 句那句「此号码已停用」。</div>\n</section>\n\n<section class=\"sec\" id=\"d2\">\n<div class=\"sec-h\"><span class=\"n\">02</span><h3>谁在说话：四个声部，一个「私」</h3><span class=\"jp\">声部</span></div>\n<p class=\"lede\">这首歌最容易听错的一点：它听起来像一个人在吼，其实是<b>四种语气轮流上场</b>，而且作者从不标注谁是谁。分不清，就会觉得它只是吵。</p>\n<table class=\"df\">\n<thead><tr><th>声部</th><th>怎么认</th><th>它说了什么</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">① 患者</td><td>医学、电脑词（前頭葉／吐瀉物／デフラグ）</td><td>报告故障：哪块坏了、什么症状、几点开始</td></tr>\n<tr><td class=\"k\">② 观察者</td><td>东京词（スタバ／ドヤ顔／五反田／量産）</td><td>嘲讽别人，也嘲讽自己：这一切都是表演</td></tr>\n<tr><td class=\"k\">③ 系统</td><td>整行都在括弧里，带 ※</td><td>不解释、不商量：<b>你不合格</b></td></tr>\n<tr><td class=\"k\">④ 叫喊者</td><td>副歌，命令形，短句</td><td>抱紧我／让脑汁分泌／带我去月亮</td></tr>\n</tbody>\n</table>\n<div class=\"stats\">\n<div class=\"st\"><div class=\"lb\">私<span>第一人称</span></div><div class=\"track\"><div class=\"fill c\" style=\"width:100%\"></div></div><div class=\"num\">7 次</div></div>\n<div class=\"st\"><div class=\"lb\">僕<span>另一个第一人称</span></div><div class=\"track\"><div class=\"fill\" style=\"width:2%\"></div></div><div class=\"num\">0 次</div></div>\n<div class=\"st\"><div class=\"lb\">命令·请求<span>殴って／縛って／抱きしめて</span></div><div class=\"track\"><div class=\"fill\" style=\"width:57%\"></div></div><div class=\"num\">4 次</div></div>\n<div class=\"st\"><div class=\"lb\">问号<span>全曲</span></div><div class=\"track\"><div class=\"fill\" style=\"width:2%\"></div></div><div class=\"num\">0 个</div></div>\n</div>\n<p class=\"lede tight\">（统计按歌词原文计，重复句也计入。）</p>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">代</span>全曲只用「私」，一次都没用「僕」<span class=\"lab\">人称</span></div>\n<div class=\"ex\">「私」出现 7 次：第 19、21、25、47、49、53 句与第 57 句</div>\n<div class=\"ex\">「僕」「あたし」「俺」：<b>0 次</b></div>\n<div class=\"bd\">这不是小事——<b>「僕」和「私」在日语里的自我形象完全不同</b>：「僕」是男孩的、偏软的、可以示弱的（同为サカナクション的《ミュージック》通篇用「僕」）；「私」是<b>正式、成年、把自己当主体</b>的。这首歌选了「私」——所以就算内容全是失控，<b>语法上她一直在用「大人」的口吻报告自己</b>。这正是「病历」的语体：患者不用撒娇的口吻，用陈述的口吻。</div>\n</div>\n<div class=\"warn\"><b>最容易被误读的一句</b>：第 18 句「結局♂♀凹凸擦って気持ち良くなりたいだけなら」——主语其实不是「我」，是<b>「你」（所有听歌的人）</b>。她在替对方总结动机：如果你们只想图舒服，那就直说。所以第 19 句立刻接「その棒のようなもので私を殴って」：<b>既然只是身体，那就别装了，直接来</b>。这两句必须连着读，否则会以为她在自白。</div>\n</section>\n\n<section class=\"sec\" id=\"d3\">\n<div class=\"sec-h\"><span class=\"n\">03</span><h3>三处括弧：机器从不说「我」</h3><span class=\"jp\">機械</span></div>\n<p class=\"lede\">全曲有三行是<b>整行都在括号里</b>的，而且都带 ※。它们的共同点不是「旁白」，是<b>没有主语</b>——这三句都不是人在说话，是系统在说话。</p>\n<table class=\"df\">\n<thead><tr><th>第</th><th>原句</th><th>说话的东西</th><th>它在拒绝什么</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">16</td><td class=\"jp\">(※自律神経に問題があるかもしれません)</td><td>诊断书</td><td>拒绝给出确定答案：<b>「也许」</b>，所以谁都不用负责</td></tr>\n<tr><td class=\"k\">28</td><td class=\"jp\">（※この電話番号は…現在使われておりません）</td><td>电话自动应答</td><td>拒绝接通：<b>这个号不存在了</b>，你没有可以找的人</td></tr>\n<tr><td class=\"k\">44</td><td class=\"jp\">（※暗証番号をもう一度お確かめください）</td><td>系统弹窗</td><td>拒绝通过：<b>你输错了</b>，而且不告诉你是哪里错</td></tr>\n</tbody>\n</table>\n<div class=\"good\"><b>三句连起来是一条流水线</b>：先是「也许有病」（不必确诊），再是「号码已停用」（没有对象），最后是「请再输一次」（无法通过）。<b>从身体 → 到关系 → 到身份，三层全部判定「不合格」</b>，然后副歌才开始喊「抱紧我」。这不是随机的三句玩笑，是<b>把人一步步注销掉</b>的三个程序。</div>\n<div class=\"note\"><b>语法上的共同点</b>：三句都是<b>受身或无人称</b>——「使われておりません」（被使用）、「問題がある」（有：不说是谁有）、「お確かめください」（请确认：不说是谁会确认）。<b>主语一消失，责任就消失</b>。这正是服务业日语最可怕的礼貌：它对你说话，但从不出现。</div>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">礼</span>为什么这些机器话都用敬语<span class=\"lab\">敬語</span></div>\n<div class=\"ex\">かもしれません（也许）— 留余地，是礼貌</div>\n<div class=\"ex\">お確かめください（请确认）— 是敬语命令，不是请求</div>\n<div class=\"ex\">〜ておりません（没有…）— 謙譲语的否定</div>\n<div class=\"bd\">日语里<b>越礼貌，越不商量</b>。「お確かめください」不会因为你说「我忘了」而改变，它只重复一遍。作者把这套语气放进歌词，效果就是<b>冷</b>：不是骂你，是<b>按流程处理你</b>。全曲的暴力和这里的礼貌，是同一件事的两面。</div>\n</div>\n</section>\n\n<section class=\"sec\" id=\"d4\">\n<div class=\"sec-h\"><span class=\"n\">04</span><h3>古语与网络语：同一行里的八百年</h3><span class=\"jp\">古今</span></div>\n<p class=\"lede\">这首歌最出名的技术，是<b>把两种隔了八百年的日语塞进同一句</b>。相邻两行，一行是「用最恭敬的古语说最不听话的话」，下一行是「用 2012 年的网络黑话报告失业」。</p>\n<table class=\"df\">\n<thead><tr><th>第</th><th>原文</th><th>写法</th><th>年代／语体</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">9</td><td class=\"jp\">諸行無常のリズムに合わせて</td><td>四字熟语＋片假名</td><td>佛教（8 世纪）＋西洋音乐（20 世纪）</td></tr>\n<tr><td class=\"k\">11</td><td class=\"jp\">ゆるふわ草食 愛され給うて</td><td>网络词＋文语补助动词</td><td>2010 年代＋中世（給ふ）</td></tr>\n<tr><td class=\"k\">12</td><td class=\"jp\">そう仰せにては候えども</td><td>候文（武士书信体）</td><td>中世〜近世（16 世纪前後）</td></tr>\n<tr><td class=\"k\">13</td><td class=\"jp\">就職できない無理ゲーパスして</td><td>网络黑话</td><td>2010 年代</td></tr>\n<tr><td class=\"k\">33</td><td class=\"jp\">量産アイドル一蓮托生</td><td>工业词＋佛教语</td><td>20 世纪＋13 世纪</td></tr>\n<tr><td class=\"k\">42</td><td class=\"jp\">ググって情弱ウイルス感染</td><td>造词动词＋网络贬义</td><td>21 世纪＋21 世纪</td></tr>\n</tbody>\n</table>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">候</span>第 12 句到底难在哪<span class=\"lab\">候文</span></div>\n<div class=\"ex\">そう仰せにては候えども</div>\n<div class=\"ex\">＝「そのようにおっしゃるのでございますが」</div>\n<div class=\"bd\">逐字拆：<b>仰せ</b>（「言う」的尊敬名词）＋<b>にては</b>（＝であっては）＋<b>候えども</b>（＝ございますけれども）。整句是武士书信体的「虽说是这样吩咐」。<b>问题在于内容</b>：上一句刚说「软萌地被爱着」，这一句用最恭敬的语法把它推翻了——<b>「您说得对，但是我不」</b>。日语里「恭敬」和「拒绝」可以同时成立，这一句是教科书级的示范。</div>\n</div>\n<div class=\"warn\"><b>别把这首当「堆词」看</b>：如果只是把古语和网络语混在一起，那叫混乱。这首歌的做法是<b>让两者互相拆台</b>——四字熟语一出现，后面的网络词就显得轻浮；网络词一出现，四字熟语就显得假。每一行都在<b>同时嘲笑两个时代</b>。听不懂词义也能听出这个落差，这就是它火的原因。</div>\n</section>\n\n<section class=\"sec\" id=\"d5\">\n<div class=\"sec-h\"><span class=\"n\">05</span><h3>身体：从「脑」换到「身体」的半场</h3><span class=\"jp\">身体</span></div>\n<p class=\"lede\">前半二十行讲的全是<b>头</b>：前頭葉、自律神経、妄想、脳漿。到了第 19 句突然换了器官——「その棒のようなもので私を殴って」。<b>从这一行起，全曲的舞台从脑移到了身体</b>，而且再也没回去。</p>\n<table class=\"df\">\n<thead><tr><th>半场</th><th>关键词</th><th>身体在场的方式</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">前半 1–18</td><td class=\"jp\">前頭葉／吐瀉物／自律神経／妄想</td><td>身体是<b>出故障的机器</b>：报告症状，不提欲望</td></tr>\n<tr><td class=\"k\">转向 19–20</td><td class=\"jp\">殴って／紅い華</td><td>第一次出现「被打」，疼痛<b>被写成花</b></td></tr>\n<tr><td class=\"k\">后半 45–48</td><td class=\"jp\">尻尾／麻縄／枕仕事</td><td>身体是<b>被使用的东西</b>：被绑、被拉开、被观看</td></tr>\n<tr><td class=\"k\">收尾 59</td><td class=\"jp\">古くさい身体は脱ぎ捨てて</td><td>身体变成<b>可以脱掉的外壳</b></td></tr>\n</tbody>\n</table>\n<div class=\"good\"><b>这条线的走向是「身体越来越可拆卸」</b>：一开始身体是会坏的机器（有故障），然后是被打的物体（有痛感），再是被绑的物件（被使用），最后是可以脱掉的外壳（可丢弃）。<b>每一次升级都在减少「我」和「身体」的绑定</b>——到第 59 句，她终于说出那句：「这具身体过期了，我想换一具」。</div>\n<div class=\"note\"><b>为什么「脑」要先出场</b>：日语里「脳」是器官，「脳漿」是里面流动的液体。选「脳漿」而不是「脳」，是为了让它<b>可以漏、可以炸</b>——不是坏掉，是溢出来。同理「炸裂」也不像「故障」，它是<b>从内部撑破</b>。所以歌名的第一个词就在说：这不是外力造成的损坏，是里面的东西太多了。</div>\n<div class=\"warn\"><b>注意「身体」这个词只出现 2 次</b>（第 47、59 句）。前半场一次都没用「身体」，用的是部位（前頭葉／手の平／顔面）。<b>零散地说部位，说明她还不认为那是「一个整体」</b>；直到被人绑起来，她才第一次说出「私の身体」——<b>是别人的手，让她确认了自己有一具身体</b>。</div>\n</section>\n\n<section class=\"sec\" id=\"d6\">\n<div class=\"sec-h\"><span class=\"n\">06</span><h3>一百年的算术：免罪符怎么用</h3><span class=\"jp\">百年</span></div>\n<p class=\"lede\">全曲的「理由」只有一个数字：<b>100 年後</b>。它出现三次，而且<b>每一次的功能都不一样</b>——这是全曲最精密的一处设计。</p>\n<table class=\"df\">\n<thead><tr><th>第</th><th>原句</th><th>副词</th><th>它在做什么</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">23–24</td><td class=\"jp\">どうせ100年後の今頃には／みんな死んじゃってんだから</td><td><b>どうせ</b>（反正）</td><td>用「都会死」<b>取消现在的一切责任</b>——这是免罪符</td></tr>\n<tr><td class=\"k\">51–52</td><td class=\"jp\">どうせ100年後の今頃には／みんな死んじゃってんだから</td><td><b>どうせ</b>（反正）</td><td>一字不改地再说一遍：<b>理由没变，问题也没解决</b></td></tr>\n<tr><td class=\"k\">57–58</td><td class=\"jp\">きっと100年後の私は／美少女に生まれ変わってるはずだからさ</td><td><b>きっと</b>（一定）</td><td>同一个百年，<b>从「反正没意义」翻成「反正还有下次」</b></td></tr>\n</tbody>\n</table>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">算</span>为什么偏偏是「一百年」<span class=\"lab\">数字</span></div>\n<div class=\"ex\">够近：能想象自己的孙子那一代</div>\n<div class=\"ex\">够远：谁都无法反驳（没有人能拿出证据）</div>\n<div class=\"bd\">虚无主义需要一个<b>无法证伪的尺度</b>。「明天」太近，会被现实打脸；「一亿年」太远，听起来像玩笑。<b>「一百年」刚好是一个人能想象、但不能验证的距离</b>。所以它既能当借口（人都死了，何必认真），也能当希望（下辈子我会变漂亮）。<b>同一个数字，两种用法，中间只差一个副词。</b></div>\n</div>\n<div class=\"note\"><b>这正是全曲最危险的地方</b>：她不是不知道这是自欺——她把这套算术<b>唱了两遍</b>，然后才换成「きっと」。<b>先承认理由站不住（重复一遍），再拿它许愿</b>。这不是幼稚，是<b>清醒地选择相信</b>。听懂这一层，副歌的嗨就不是无脑嗨，是<b>明知是假还要跳</b>。</div>\n<div class=\"good\"><b>对照一句就够</b>：第 24 句「みんな死んじゃってんだから」（反正大家早就死了）——注意是<b>「死んじゃってんだ」</b>，完了＋解释语气，等于「已经死透了，没什么好说的」。这种把话说死的语法，用在「活下去的理由」上，本身就是反讽。</div>\n</section>\n\n<section class=\"sec\" id=\"d7\">\n<div class=\"sec-h\"><span class=\"n\">07</span><h3>道具与关系：换了四样东西，关系一次没变</h3><span class=\"jp\">道具</span></div>\n<p class=\"lede\">这首歌有两组完全对称的句子，隔了将近三十行。<b>把它们并排放，就能看出作者真正的结构感</b>：换道具，不换关系。</p>\n<table class=\"df\">\n<thead><tr><th>前半</th><th>后半</th><th>换掉了什么</th><th>没换的是什么</th></tr></thead>\n<tbody>\n<tr><td class=\"jp\">その棒のようなもので私を殴って（19）</td><td class=\"jp\">その麻縄で私の身体を縛って（47）</td><td>棒 → 麻绳；打 → 绑</td><td><b>「その」＋命令形</b>：还是同一句法，同一个请求</td></tr>\n<tr><td class=\"jp\">震える私を抱きしめて（25）</td><td class=\"jp\">今すぐ私を抱きしめて（53）</td><td>删掉「震える」，加上「今すぐ」</td><td><b>同一个动词</b>：抱紧我</td></tr>\n<tr><td class=\"jp\">月の向こうまでイっちゃって（27）</td><td class=\"jp\">月の向こうまでイっちゃって（61）</td><td>什么都没换</td><td><b>一字不差</b>：终点没动</td></tr>\n<tr><td class=\"jp\">私は脳漿炸裂ガール（21）</td><td class=\"jp\">私は脳漿炸裂ガール（49）</td><td>什么都没换</td><td><b>自我介绍也一样</b>：名字没变</td></tr>\n</tbody>\n</table>\n<div class=\"good\"><b>四组里有两组一字不改</b>。这不是偷懒，是<b>刻意的原地踏步</b>：结尾那句「月の向こうまでイっちゃって」和第 27 句完全相同，等于告诉你——<b>唱了六十一行，她还在同一个地方</b>。所谓「大サビ」的和解（一百年后变美少女）只维持了两行，最后又滑回原来的句子。</div>\n<div class=\"note\"><b>「その」的妙处</b>：第 19 句「<b>その</b>棒のようなもの」、第 47 句「<b>その</b>麻縄」——都用指示词「その」，但前文从来没提过棒子和绳子。<b>「その」指的东西根本不存在于歌词里</b>。这种用法让句子突然有了画面：她不是在接受什么，是在<b>指定</b>什么。命令形的对象是「你」，指示词的对象是「你以为存在的东西」。</div>\n</section>\n\n<section class=\"sec\" id=\"d8\">\n<div class=\"sec-h\"><span class=\"n\">08</span><h3>闭环：为什么最后两句必须一模一样</h3><span class=\"jp\">閉環</span></div>\n<p class=\"lede\">61 行里只有 56 行是新的。这个数字不是巧合，是作者算好的：<b>他让歌在最后一秒回到第 27 句</b>，于是「结束」变成了「重来」。</p>\n<table class=\"df\">\n<thead><tr><th>重复的位置</th><th>重复了什么</th><th>效果</th></tr></thead>\n<tbody>\n<tr><td class=\"k\">49–52 ＝ 21–24</td><td>副歌的前四句（报名、跳舞、一百年、都死了）</td><td>第二段副歌<b>不是新内容</b>，是同一段再播一次</td></tr>\n<tr><td class=\"k\">56 ＝ 50</td><td>「さあさあ狂ったように踊りましょう」</td><td>大サビ开头先<b>退回</b>口令，才敢许愿</td></tr>\n<tr><td class=\"k\">60–61 ＝ 26–27</td><td>「もっと激しく脳汁分泌させたら／月の向こうまでイっちゃって」</td><td>结局＝中段，<b>歌停在一个没有终点的动作上</b></td></tr>\n</tbody>\n</table>\n<div class=\"card vi\"><h2>歌名拆三层：脳漿・炸裂・ガール</h2>\n<p class=\"lede\"><b>脳漿</b>（のうしょう）：脑脊液，不是「脑」。选它，是为了「会流出来」。</p>\n<p class=\"lede\"><b>炸裂</b>（さくれつ）：从内部撑破，不是被砸坏。责任在内部。</p>\n<p class=\"lede\"><b>ガール</b>：英语外来语。一个用片假名写的「女孩」，和「私」并列——<b>她在用别人的词称呼自己</b>。</p>\n<p class=\"lede\">三层合起来是一句很冷的自我定义：<b>一个内部压强过高的、被叫做「女孩」的东西</b>。这不是中二自封，是<b>把自己当成一件会爆的容器</b>来命名。</p>\n</div>\n<div class=\"warn\"><b>别期待「升华」</b>：这首歌没有桥段式的顿悟，也没有「然后我明白了」。第 58 句的「下辈子变美少女」是全曲唯一一次许愿，但它靠的是<b>「はず」</b>（按理说）——一个不肯定的推断。两行之后，一切又回到原句。<b>它不给出口，这才是它的诚实。</b></div>\n</section>\n\n<section class=\"sec\" id=\"d9\">\n<div class=\"sec-h\"><span class=\"n\">09</span><h3>读法与自测</h3><span class=\"jp\">読み方</span></div>\n<p class=\"lede\">这首不适合顺着读完（61 行，生词密度全站最高，21 行 N2）。建议<b>横向读</b>——不按顺序，按对照关系读，四条线每条 10 分钟。</p>\n<div class=\"gcard\"><div class=\"hd\"><span class=\"pat\">路</span>四条读数线<span class=\"lab\">ルート</span></div>\n<div class=\"ex\"><b>线一 · 病历</b>（1–20 句）：只找「报告」的语气。医学词、电脑词、说明书腔各数一遍。</div>\n<div class=\"ex\"><b>线二 · 断电</b>（28 句）：只读这一行，问自己——为什么它放在正中间？</div>\n<div class=\"ex\"><b>线三 · 东京</b>（29–48 句）：把「成功」的词全划出来（律师、星巴克、偶像、甜点），看它们在 48 句变成什么（绳索）。</div>\n<div class=\"ex\"><b>线四 · 对折</b>（19↔47、25↔53、27↔61、21↔49）：把四组句子并排，只看<b>哪里没变</b>。</div>\n<div class=\"bd\">四条线走完，你会发现这首歌<b>不是「越唱越嗨」，而是「越唱越原地」</b>——副歌三次喊的是同一句话，结尾两句和中间一模一样。<b>嗨的是节拍，不是内容</b>。这就是它被称为「神曲」的原因：听感极其兴奋，文本极其绝望。</div>\n</div>\n<div class=\"q\"><span class=\"no\">Q1</span>为什么全曲一个问号都没有？<span class=\"ask\">这说明了什么？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">61 行里没有一句是「提问」——全是宣言、命令、说明。「私は〜」是自我定义，「殴って／抱きしめて」是命令，「※…ください」是流程。问句意味着<b>期待对方回答</b>，而这首歌已经放弃对话：<b>她只报告、下指令、然后自我定义</b>。所以「脑浆炸裂」不是崩溃的瞬间，是<b>再也无法提问</b>的状态。</div></details>\n<div class=\"q\"><span class=\"no\">Q2</span>三处括弧为什么都用敬语？<span class=\"ask\">用平语不行吗？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">因为这三句是<b>系统</b>说的，不是人说的。系统不使用情绪，只使用流程；日语的流程语言就是敬语（お確かめください／〜ておりません）。<b>越礼貌越冷</b>：它不骂你，只是把你退回上一步。全曲最暴力的地方恰恰是最礼貌的三行。</div></details>\n<div class=\"q\"><span class=\"no\">Q3</span>「どうせ」和「きっと」能同时成立吗？<span class=\"ask\">作者是不是前后矛盾？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">不矛盾，这正是设计。第 23–24 句用「どうせ」取消意义，第 51–52 句原样重复（等于承认「这个理由我用过了」），第 57–58 句才换成「きっと」许愿。<b>先取消、再重复、最后许愿</b>——顺序说明她<b>知道自己站不住，还是选择相信</b>。如果是无脑乐观，就不需要先把免罪符唱两遍。</div></details>\n<div class=\"q\"><span class=\"no\">Q4</span>第 18 句的主语是谁？<span class=\"ask\">是她在自白吗？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">不是。「…だけなら」＝「如果只是想…的话」，这是<b>替对方总结动机</b>的句式。她在说：如果你们要的只是身体，那就直说。所以下一句立刻给指令——「用那根棒子打我」。<b>主语是「你」，不是「我」</b>。这两句是全曲的转折：从报告症状，转向处理关系。</div></details>\n<div class=\"q\"><span class=\"no\">Q5</span>结尾算希望吗？<span class=\"ask\">「美少女に生まれ変わってるはず」要信吗？</span></div>\n<details class=\"fold\"><summary>参考答案</summary><div class=\"bd\">不算。「はず」是<b>推断</b>，不是事实；而且它建在「一百年后大家都死了」这个前提上——那是第 24 句用来取消一切意义的同一个前提。<b>用虚无的算术许愿，等于承认愿望也没有依据</b>。两行之后，第 60–61 句就滑回原句，把这份希望撤销了。</div></details>\n<div class=\"good\"><b>最后一句</b>：这首歌表面是狂欢，实际是一份<b>不肯求救的病历</b>。它把痛苦写成清单、写成敬语、写成网络黑话，就是不写成「救救我」。唯一接近求救的，是副歌里那句「今すぐ私を抱きしめて」——而它用的是<b>命令形</b>。</div>\n</section>\n",

   "nav": "＊ハロー、プラネット。",
   "cardsTopHtml": "<div class=\"card hot\">\n<h2>先说清楚：这不是科幻情歌，是一台机器在灾后念自己的词汇表</h2>\n<p>表面上是「机器少女在末日里到处问好」的一首歌，其实是一台<b>不识字、不懂死亡、只在念词汇表的机器</b>：整首歌词几乎不写汉字，只用假名——所以听起来全是声音，看不到意思。</p><p>38 句歌词里有三个坑，排掉再读会顺很多：</p><p>① <b>全曲几乎不写汉字</b>。这是最大的形式选择：不是排版偷懒，是作者在演「一个不认识汉字的东西在念世界」。「空っぽ」「植木鉢」「雫」全写成假名，汉字要你自己补上——补上的那一刻，就是你听懂的那一刻。</p><p>② <b>七个「オハヨーハヨー」是同一个故障在重复</b>。它把「おはよう」说成「おはよー＋はよー」，像录音带卡了一下。问好的对象一路升级：床→鱼尾→谜语→记忆里的你→天使→果酱的大地→地球→宇宙→亚当与夏娃→你。</p><p>③ <b>时间顺序是倒着的</b>。全曲一直在说早安，到第 29 句才说「我看见你安静地睡着」——早安说完了，才轮到那个早上再也不会来的人。</p><p>建议用法：先只看第 1-6 句和第 29-32 句，把「醒来」和「睡着」这两头对上；中间的造语四连和七次早安，都是这两头之间的回声。</p>\n</div>\n\n<div class=\"card\">\n<h2>先把这 8 个套路拿下：这首歌真正的语言骨架</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">① 全曲不写汉字：假名就是设定</div><div class=\"d\">「うえきばちのめ」（植木鉢の芽）、「カラッポ」（空っぽ）、「シズク」（雫）——全用假名。汉字一补上，意思立刻变清楚；作者偏偏不给你。这不是风格，是<b>视角</b>：念这些词的东西不认识字。</div><div class=\"ex\">うえきばちのめ ／ カラッポ ／ シズク</div></div>\n<div class=\"mini\"><div class=\"t\">② 自他动词成对：つなぐ／つながる</div><div class=\"d\">つなぐ＝我去连（他动词），つながる＝它自己连上（自动词）。日语里这种成对动词很多，歌词常把两个并排，表示「我做了，它也自己发生了」。同じ套路还有 開ける／開く、回す／回る。</div><div class=\"ex\">つなぐつながる ／ まわるまわるよ</div></div>\n<div class=\"mini\"><div class=\"t\">③ 「〜てくる」＝朝我这边来</div><div class=\"d\">降ってきた（下过来了）、でてこない（不出来）。「〜てくる」带方向感，比「降った」「でない」多了「朝我这里」的一层，所以更失望、更有现场感。</div><div class=\"ex\">ふってきた ／ でてこない</div></div>\n<div class=\"mini\"><div class=\"t\">④ 打招呼的对象用「に」</div><div class=\"d\">「〜に オハヨーハヨー」＝对谁说早安。全曲七次，这就是七次「对着一个对象说话」。注意第 28 句换成了「キミは」——助词一换，从「我跟你说话」变成「你怎么样」。</div><div class=\"ex\">ベッドに ／ メモリのなかのキミに ／ キミは</div></div>\n<div class=\"mini\"><div class=\"t\">⑤ 「〜てしまう」＋否定＝但愿别…</div><div class=\"d\">サビついてしまわぬように＝但愿不要锈住。てしまう 是「做完／遗憾地变成」，加否定再加「ように」就变成祈祷。这是全曲唯一一次祈求，求的是「心别锈」。</div><div class=\"ex\">ココロ サビついて しまわぬように</div></div>\n<div class=\"mini\"><div class=\"t\">⑥ 终助词：の／や／よ 三种自言自语</div><div class=\"d\">「いきたいの」＝撒娇式的说明；「でてこないや」＝自己嘟囔的轻叹；「かなしいよ」＝把话丢给自己听。同一个句尾换一个字，说话人的姿态就完全变了——这首歌全靠这三个小词分层。</div><div class=\"ex\">さがしにいきたいの ／ でてこないや ／ かなしいよ</div></div>\n<div class=\"mini\"><div class=\"t\">⑦ 「〜たばかり」＝刚刚</div><div class=\"d\">うまれたばかりの「キミ」＝刚出生的你。ばかり 表示主观的「还新」，时间可长可短；和「〜たところ」（刚好在那时）不同。最后一句用它，等于说「你才刚刚开始」。</div><div class=\"ex\">うまれたばかりの“キミ”に</div></div>\n<div class=\"mini\"><div class=\"t\">⑧ 书写变形就是声音：ポタリ／コ　ン　ナ　ニ</div><div class=\"d\">拟声词「ポタリ」一滴一下，重复两次＝间隔；「こんなに→コンナニ→コ　ン　ナ　ニ」同一个词三种写法，假名之间的空格越来越宽＝声音在卡、信号在断。日语用<em>写法</em>演声音。</div><div class=\"ex\">ポタリ　ポタリ ／ コ　ン　ナ　ニ....</div></div>\n</div>\n</div>",
   "cardsBottomHtml": "<div class=\"card cy\">\n<h2>读音陷阱：这些词别读错</h2>\n<table class=\"sx\"><thead><tr><th>词</th><th>读音</th><th>易错点</th></tr></thead><tbody>\n<tr><td class=\"a\">植木鉢</td><td class=\"b\">うえきばち</td><td class=\"c\">「鉢」读 ばち，不读 はち；歌词里写成假名</td></tr>\n<tr><td class=\"a\">空っぽ</td><td class=\"b\">からっぽ</td><td class=\"c\">不是「あきっぽ」；「ぽ」是促音后的半浊音</td></tr>\n<tr><td class=\"a\">逆立ち</td><td class=\"b\">さかだち</td><td class=\"c\">「逆」在这里读 さか，不读 ぎゃく</td></tr>\n<tr><td class=\"a\">独りぼっち</td><td class=\"b\">ひとりぼっち</td><td class=\"c\">「ぼっち」不是「ぽっち」；浊音表强调</td></tr>\n<tr><td class=\"a\">尻尾</td><td class=\"b\">しっぽ</td><td class=\"c\">「尻」读 しり，但合起来促音化成 しっぽ</td></tr>\n<tr><td class=\"a\">謎々</td><td class=\"b\">なぞなぞ</td><td class=\"c\">叠词，第二个字不读 なぞ 以外的音</td></tr>\n<tr><td class=\"a\">瓦礫</td><td class=\"b\">がれき</td><td class=\"c\">「礫」读 れき，不读 つぶて</td></tr>\n<tr><td class=\"a\">飴玉</td><td class=\"b\">あめだま</td><td class=\"c\">「飴」あめ＋「玉」だま（浊化）</td></tr>\n<tr><td class=\"a\">雫</td><td class=\"b\">しずく</td><td class=\"c\">一个字读完，不读「したみず」</td></tr>\n<tr><td class=\"a\">日向ぼっこ</td><td class=\"b\">ひなたぼっこ</td><td class=\"c\">「日向」读 ひなた，不读 ひむき</td></tr>\n<tr><td class=\"a\">誘う</td><td class=\"b\">さそう</td><td class=\"c\">和「差す（撑伞）」同音，全曲的双关</td></tr>\n<tr><td class=\"a\">錆びる</td><td class=\"b\">さびる</td><td class=\"c\">「錆」读 さび；サビつく＝锈住、锈死</td></tr>\n</tbody></table>\n</div>"

   "cardsTopHtml": "<div class=\"card hot\">\n<h2>先说清楚：这不是中二病发作，这是一整首歌用谐音把「毒」藏进每一个词</h2>\n<p>表面上是「中二病少女暴走」，其实是一首歌<b>用谐音把「毒」藏在每一个字里</b>：孤独（こどく）里藏着毒，既読（きどく）也是毒，零下（れいか）等于劣化（れっか）。听不出来就只剩吵闹，听出来才发现整首歌都在说同一件事。</p><p>36 行歌词里有五个坑，排掉再读会顺很多：</p><p>① <b>同一个音，两种汉字</b>。愛／哀（都是 あい）、零下／劣化（れいか／れっか）、二進も三進も（算盘口诀）、成敗（不是成败，是处决）——全曲的表记游戏，中文翻不出来，只能标出来。</p><p>② <b>一波副歌只换一个词</b>。第一遍「血流不止」，第二遍换成「已读」；第一遍「吐き出せない（吐不出）」，第二遍「逃げ出せない（逃不掉）」；第一遍「喊」，最后一遍「灭」，最后又回到「喊」。</p><p>③ <b>括号行是第二个声音</b>。六行在括号里的不是主唱，是背景音或系统音，音量压得很低——它们是这首歌真正在说的事，只是不让你听清。</p><p>④ <b>命令形满天飞</b>。探せ／屈め／笑え／アガれ——全曲十几处命令，但说话人从没请求过任何东西，只下指令。被命令的「你」其实就是她自己。</p><p>⑤ <b>「めっ！」打断一切</b>。每次爆发都被一声训斥按住，包括最后一句——这首歌从头到尾没被允许说完。</p><p>建议用法：先读副歌那两句（第 14、16 句），把「あい」和「どく」两个音记住；再回头看主歌，你会发现每一行都在偷偷放这两个音。</p>\n</div>\n\n<div class=\"card\">\n<h2>先把这 8 个套路拿下：这首歌真正的语言骨架</h2>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"t\">① 同音双关：あい＝愛／哀</div><div class=\"d\">副歌的括号里写着「愛(愛)哀(哀)」——先唱一个「あい」，再标两种汉字。日语能做到这一点：<b>声音一样，意思相反</b>。第 16 句是「愛・哀」，第 28 句改成「愛・愛」——只在表记上把「哀」换成了「爱」，听感完全不变。</div><div class=\"ex\">愛(愛)哀(哀) ／ 愛(愛)愛(愛)</div></div>\n<div class=\"mini\"><div class=\"t\">② どく＝毒／独／既読</div><div class=\"d\">「孤独（こどく）」里藏着「どく」，「既読（きどく）」里也有「どく」。作者用这些词把「毒」铺满全曲——<b>不是出现很多次「毒」字，而是很多词里都带这个音</b>。</div><div class=\"ex\">孤独 ／ 既読 ／ ドクドク</div></div>\n<div class=\"mini\"><div class=\"t\">③ 文语动词＋ルル：造语的公式</div><div class=\"d\">流る（文语「流れる」）＋ルル、零る（こぼれる 的文语）＋ルル、欲しがる＋ルル、回る＋ルル、消える＋ルル。公式＝<b>文语／动词的终止形 ＋ ルル（结巴的重复）</b>。同一个公式造出五个词，全曲的「中毒感」就从这里来。</div><div class=\"ex\">流るルル ／ 零るルル ／ 欲しがルル ／ 回るルル ／ 消えるルル</div></div>\n<div class=\"mini\"><div class=\"t\">④ 命令形：日语最硬的句式</div><div class=\"d\">探せ／屈め／笑え／アガれ／叫べ／滅べ。命令形（〜え／〜ろ）在日语里很粗，对上级不能用。全曲命令形十几处，说明<b>说话人和听话人已经不在乎礼貌了</b>——而这两个人其实是同一个。</div><div class=\"ex\">探せよ探せ ／ 屈めよ屈め ／ 笑えよ笑え ／ アガれよアガれ</div></div>\n<div class=\"mini\"><div class=\"t\">⑤ 名词句：不用动词也能下判断</div><div class=\"d\">「校内猛毒だ」「クソゲーだ」「オーバードーズ刑だ」——A は B だ 的句型，把两样东西直接画等号。<b>省掉动词＝省掉过程</b>，所以听起来像判决，不像叙述。</div><div class=\"ex\">校内猛毒だ ／ 正味クソゲーだ ／ オーバードーズ刑だ</div></div>\n<div class=\"mini\"><div class=\"t\">⑥ て形：把三件事压成一句</div><div class=\"d\">ドクドク呑み込んで／苦しんで／泣いて／吐き出せない。「〜て」可以一直往下接，等于<b>把一整串经历串成一句话</b>，中间不给句号。日语歌词特别爱用这一招拉长呼吸。</div><div class=\"ex\">呑み込んで 苦しんで 泣いて 吐き出せない</div></div>\n<div class=\"mini\"><div class=\"t\">⑦ 可能形否定：できない 的两种意思</div><div class=\"d\">吐き出せない（身体上吐不出）／逃げ出せない（处境上逃不掉）。同样是「做不到」，<b>一个怪自己，一个怪环境</b>——第 11 句和第 24 句就差这一个动词。</div><div class=\"ex\">吐き出せないの ／ 逃げ出せないの</div></div>\n<div class=\"mini\"><div class=\"t\">⑧ 括号行：音量也是语法</div><div class=\"d\">六行歌词在括号里：(例外ない…)／(盛大KNIGHT…)／(ロンリィNIGHT…)／(愛をもっと)…括号内要么是背景和声，要么是系统音。<b>它们不太参与叙事，只负责泄漏真相。</b></div><div class=\"ex\">(愛をもっと) ／ (ロンリィNIGHT テッペン回って…)</div></div>\n</div>\n</div>",

function setOpen(line, open) {
  line.classList.toggle("open", !!open);
  const h = line.querySelector(".head");
  if (h) h.setAttribute("aria-expanded", open ? "true" : "false");
  const sec = line.closest(".sec");
  if (sec) syncSecTg(sec);
}
function syncSecTg(sec) {
  const tg = sec.querySelector(".sec-tg");
  if (!tg) return;
  const lines = [...sec.querySelectorAll(".line")];
  tg.textContent = lines.some(l => !l.classList.contains("open")) ? "展开本节" : "收起本节";
}

/* 曲目条：按住拖动 / 滚轮横扫。单击一律交给 chip 自己的 click，不做任何拦截 */
(() => {
  const THRESHOLD = 5;              /* 小于这个位移就当点击，不当拖拽 */
  let down = false, dragging = false, startX = 0, startY = 0, startLeft = 0, moved = 0;
  let swallowClick = false;

  chipsBox.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    down = true; dragging = false; moved = 0;
    startX = e.clientX; startY = e.clientY; startLeft = chipsBox.scrollLeft;
    swallowClick = false;
  });
  chipsBox.addEventListener("pointermove", (e) => {
    if (!down) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    moved = Math.max(moved, Math.abs(dx));
    /* 必须横向位移更大才算拖动，纵向滑动交还给页面滚动 */
    if (!dragging && Math.abs(dx) > THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
      dragging = true;
      chipsBox.classList.add("is-drag");
    }
    if (dragging) chipsBox.scrollLeft = startLeft - dx;
  });
  const end = () => {
    if (!down) return;
    down = false;
    if (dragging) { swallowClick = true; chipsBox.classList.remove("is-drag"); }
    dragging = false;
  };
  chipsBox.addEventListener("pointerup", end);
  chipsBox.addEventListener("pointercancel", end);
  chipsBox.addEventListener("pointerleave", end);
  /* 只有真的拖动过，才吃掉这次 click（在捕获阶段拦，避免误切歌） */
  chipsBox.addEventListener("click", (e) => {
    if (!swallowClick) return;
    swallowClick = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
  chipsBox.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    if (chipsBox.scrollWidth <= chipsBox.clientWidth) return;
    e.preventDefault();
    chipsBox.scrollLeft += e.deltaY;
  }, {passive: false});
})();

/* 曲目拖动条：位置/宽度跟随 scrollLeft，可拖、可点轨道跳转 */
(() => {
  const bar = document.getElementById("chipbar");
  const thumb = document.getElementById("chipthumb");
  if (!bar || !thumb) return;
  const maxScroll = () => Math.max(0, chipsBox.scrollWidth - chipsBox.clientWidth);

  function sync() {
    const max = maxScroll();
    bar.classList.toggle("off", max < 2);
    if (max < 2) return;
    const track = bar.clientWidth;
    const w = Math.max(36, Math.round(track * chipsBox.clientWidth / chipsBox.scrollWidth));
    const left = Math.round((track - w) * (chipsBox.scrollLeft / max));
    thumb.style.width = w + "px";
    thumb.style.left = left + "px";
  }
  chipsBox.addEventListener("scroll", sync, {passive: true});
  window.addEventListener("resize", sync);
  setTimeout(sync, 0);

  let dragging = false, startX = 0, startLeft = 0;
  const onDown = (e) => {
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startLeft = chipsBox.scrollLeft;
    thumb.setPointerCapture && thumb.setPointerCapture(e.pointerId);
  };
  const onMove = (e) => {
    if (!dragging) return;
    const max = maxScroll();
    const travel = bar.clientWidth - thumb.offsetWidth;
    if (travel <= 0 || max <= 0) return;
    chipsBox.scrollLeft = startLeft + (e.clientX - startX) * (max / travel);
  };
  const onUp = () => { dragging = false; };
  thumb.addEventListener("pointerdown", (e) => { e.stopPropagation(); onDown(e); });
  thumb.addEventListener("pointermove", onMove);
  thumb.addEventListener("pointerup", onUp);
  thumb.addEventListener("pointercancel", onUp);
  /* 点轨道：直接跳到对应位置 */
  bar.addEventListener("pointerdown", (e) => {
    if (e.target === thumb) return;
    const r = bar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    chipsBox.scrollLeft = ratio * maxScroll();
  });
  sync();
})();

function go(i, scroll) {
  if (i < 0 || i >= SONGS.length) return;
  cur = i;
  document.querySelectorAll(".song").forEach((p, k) => p.classList.toggle("on", k === i));
  document.querySelectorAll(".chip").forEach((c, k) => {
    c.classList.toggle("on", k === i);
    c.setAttribute("aria-selected", k === i ? "true" : "false");
  });
  const chip = document.querySelector('.chip[data-i="' + i + '"]');
  if (chip && chip.scrollIntoView) chip.scrollIntoView({block:"nearest", inline:"center"});
  setMode("light");
  document.getElementById("modeSwitch").hidden = !SONGS[i].meta.deepHtml;
  if (qBox.value) qBox.value = "";
  apply();
  updCnt();
  if (scroll) window.scrollTo({top: 0, behavior: "instant"});
  try { history.replaceState(null, "", "#s" + (i + 1)); } catch (e) {}
}

/* ---------- 工具栏 ---------- */
function activePanel() { return document.querySelector(".song.on"); }
function activeLines() {
  const p = activePanel();
  return p ? p.querySelectorAll(".lightview .line") : [];
}

function apply() {
  activeLines().forEach(l => {
    l.querySelector(".rd").style.display = state.rd ? "block" : "none";
    l.querySelector(".ro").style.display = state.ro ? "block" : "none";
    l.querySelector(".tr").style.display = state.tr ? "block" : "none";
  });
  document.querySelectorAll(".tg[data-k]").forEach(b => {
    const on = !!state[b.dataset.k];
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
  filter();
}

function setMode(mode) {
  const p = activePanel();
  if (!p) return;
  const isDeep = mode === "deep" && !!p.querySelector(".deepview");
  p.classList.toggle("deepmode", isDeep);
  document.querySelectorAll("#modeSwitch .tg").forEach(b =>
    b.classList.toggle("on", b.dataset.m === (isDeep ? "deep" : "light")));
  const hide = isDeep ? "none" : "";
  document.querySelectorAll(".tg[data-k]").forEach(b => { b.style.display = hide; });
  document.getElementById("allBtn").style.display = hide;
  updCnt();
}

function updCnt() {
  const s = stats[cur] || {all: 0};
  const box = activePanel();
  const q = qBox.value.trim();
  const narrow = window.matchMedia("(max-width:700px)").matches;
  const head = narrow ? (cur + 1) + "/" + SONGS.length
                      : "第 " + (cur + 1) + " / " + SONGS.length + " 首";
  if (box && box.classList.contains("deepmode")) {
    cnt.textContent = head + (narrow ? "" : " · 深读版");
    return;
  }
  if (q) {
    const hit = [...activeLines()].filter(l => !l.classList.contains("hide")).length;
    cnt.textContent = head + " · " + (narrow ? "匹配 " : "匹配 ") + hit + "/" + s.all;
    return;
  }
  cnt.textContent = head + (narrow ? "" : " · 共 " + s.all + " 句");
}

/* ---------- 搜索 ---------- */
function filter() {
  const q = qBox.value.trim().toLowerCase();
  const box = activePanel();
  if (!box) return;
  const lines = [...box.querySelectorAll(".lightview .line")];
  let visible = 0;
  lines.forEach(l => {
    const hit = !q || (l.dataset.search || "").indexOf(q) >= 0;
    l.classList.toggle("hide", !hit);
    if (hit) visible++;
  });
  box.querySelectorAll(".lightview .sec").forEach(sec => {
    const anyHit = [...sec.querySelectorAll(".line")].some(l => !l.classList.contains("hide"));
    sec.classList.toggle("nomatch", !!q && !anyHit);
    sec.style.display = (q && !anyHit) ? "none" : "";
  });
  const empty = box.querySelector(".lightview .empty");
  if (empty) empty.classList.toggle("on", !!q && visible === 0);
  if (q) scrollToFirstHit(box);
  updCnt();
}

/* 搜索结果通常在当前视口之外（页面顶部是速查卡），命中后把第一句带回视野 */
function scrollToFirstHit(box) {
  const first = [...box.querySelectorAll(".lightview .line")].find(l => !l.classList.contains("hide"));
  if (!first) return;
  const r = first.getBoundingClientRect();
  /* 偏移交给 CSS 的 scroll-padding-top（它跟着 --nav-h 走），这里只判断要不要跳 */
  if (r.top < 0 || r.top > window.innerHeight * 0.75) {
    first.scrollIntoView({block: "start", behavior: "instant"});
  }
}

let qTimer = 0;
qBox.addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(filter, 120);
});
qBox.addEventListener("keydown", e => {
  if (e.key === "Escape") { qBox.value = ""; filter(); }
  if (e.key === "Enter") { e.preventDefault(); filter(); }
});

document.querySelectorAll(".tg[data-k]").forEach(b => {
  b.addEventListener("click", () => {
    const k = b.dataset.k;
    state[k] = !state[k];
    try { localStorage.setItem("wbState", JSON.stringify(state)); } catch (e) {}
    apply();
  });
});

document.getElementById("allBtn").addEventListener("click", function () {
  const lines = [...activeLines()];
  const anyClosed = lines.some(l => !l.classList.contains("open"));
  lines.forEach(l => setOpen(l, anyClosed));
  document.querySelectorAll(".song.on .sec").forEach(syncSecTg);
  this.classList.toggle("on", anyClosed);
  this.setAttribute("aria-pressed", anyClosed ? "true" : "false");
  this.textContent = anyClosed ? "全部收起" : "全部展开";
});

document.querySelectorAll("#modeSwitch .tg").forEach(b => {
  b.addEventListener("click", () => {
    setMode(b.dataset.m);
    window.scrollTo({ top: 0, behavior: "instant" });
  });
});

/* 移动端：工具栏抽屉 */
toolsBtn.addEventListener("click", () => {
  const open = nav.classList.toggle("tools-open");
  toolsBtn.setAttribute("aria-expanded", open ? "true" : "false");
});

/* 键盘：← → 切曲，数字键直选，/ 聚焦搜索 */
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  if (e.key === "ArrowRight") { go((cur + 1) % SONGS.length, true); }
  else if (e.key === "ArrowLeft") { go((cur - 1 + SONGS.length) % SONGS.length, true); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= SONGS.length) { go(+e.key - 1, true); }
  else if (e.key === "/") { e.preventDefault(); qBox.focus(); }
});

/* ---------- 导航高度：写进 --nav-h，供锚点定位使用 ---------- */
function syncNavH() {
  const h = nav.getBoundingClientRect().height;
  document.documentElement.style.setProperty("--nav-h", Math.round(h) + "px");
}
if (window.ResizeObserver) new ResizeObserver(syncNavH).observe(nav);
else window.addEventListener("resize", syncNavH);
window.addEventListener("load", syncNavH);

/* ---------- 初始化 ---------- */
const mh = /^#s(\d+)$/.exec(location.hash || "");
const startAt = mh ? Math.min(Math.max(+mh[1] - 1, 0), SONGS.length - 1) : 0;
go(startAt, false);

/* 默认全部收起：切到某首时先看到歌词，想看解析再点 */

/* ---------- 主题 ---------- */
try { if (localStorage.getItem("wbTheme") === "light") document.documentElement.classList.add("light"); } catch (e) {}
const themeBtn = document.getElementById("themeBtn");
function syncThemeBtn() {
  const light = document.documentElement.classList.contains("light");
  themeBtn.textContent = light ? "☀️" : "🌙";
  themeBtn.setAttribute("aria-pressed", light ? "true" : "false");
  themeBtn.title = light ? "当前：浅色（点击切深色）" : "当前：深色（点击切浅色）";
}
themeBtn.addEventListener("click", function () {
  const light = document.documentElement.classList.toggle("light");
  try { localStorage.setItem("wbTheme", light ? "light" : "dark"); } catch (e) {}
  syncThemeBtn();
  syncNavH();
});
syncThemeBtn();
syncNavH();
/*==ENGINE-END==*/
</script>
