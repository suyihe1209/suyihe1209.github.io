<style>
/* ==== assets/base.css 内联 ==== */
/* ===== base.css —— 单曲与合集共用的样式（构建时内联进 <style>） ===== */

/* ---------- 设计令牌 ---------- */
:root{
  --bg:#08070d;
  --bg2:#0c0a14;
  --panel:#131020;
  --panel2:#1a1529;
  --line:#282040;
  --line2:#3a2e5c;
  --text:#ece9f7;
  --muted:#a09ab6;
  --muted2:#8b84a6;
  --cyan:#5fe3f5;
  --pink:#ff6fb5;
  --violet:#b78cff;
  --amber:#ffc266;
  --green:#7ff0a8;
  --red:#ff8080;
  --nav-h:64px;
  --r-md:14px;
  --r-sm:11px;
  --fs-body:15px;
  --fs-sm:14px;
  --fs-xs:13px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 14px);}
body{
  margin:0; background:
    radial-gradient(1100px 560px at 12% -8%, #2a1040 0%, transparent 58%),
    radial-gradient(900px 520px at 92% 2%, #0d2a38 0%, transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:"Source Han Serif CN","Noto Serif SC","Songti SC","SimSun","STSong",serif;
  font-size:var(--fs-body);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  text-size-adjust:100%;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 120px;}

/* ---------- 页头 ---------- */
.kicker{font-size:12px;letter-spacing:.28em;color:var(--pink);text-transform:uppercase;font-weight:700;}
h1{font-size:clamp(28px,5vw,44px);margin:12px 0 6px;letter-spacing:.02em;line-height:1.2;}
h1 .sub{display:block;font-size:.40em;color:var(--muted);font-weight:400;letter-spacing:.16em;margin-top:10px;}
.byline{color:var(--muted);font-size:14.5px;margin-top:14px;}
.byline code{background:var(--panel2);padding:2px 7px;border-radius:5px;color:var(--cyan);font-size:13px;}

/* ---------- 卡片区 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;margin:16px 0;}
.card h2{font-size:17.5px;margin:0 0 12px;color:var(--pink);letter-spacing:.04em;display:flex;align-items:center;gap:9px;}
.card h2::before{content:"";width:4px;height:16px;background:var(--pink);border-radius:2px;}
.card.cy h2{color:var(--cyan);} .card.cy h2::before{background:var(--cyan);}
.card.ok{border-color:#1e4a30;background:linear-gradient(180deg,#0b1c13,#0e0d18);}
.card.ok h2{color:var(--green);} .card.ok h2::before{background:var(--green);}
.card.ok p{margin:8px 0;font-size:var(--fs-body);}
.card.ok b{color:var(--green);}
.card.hot{border-color:#4a2a3d;}
.card.hot h2{color:var(--pink);}

/* ---------- 工具栏（单曲 .bar / 合集 .nav 共用控件） ---------- */
.tg{border:1px solid var(--line2);background:var(--panel2);color:var(--muted);
    font-size:13.5px;padding:6px 13px;border-radius:20px;cursor:pointer;transition:.16s;
    user-select:none;font-family:inherit;line-height:1.5;display:inline-flex;align-items:center;gap:6px;}
.tg:hover{color:var(--text);border-color:var(--pink);}
.tg.on{background:rgba(255,111,181,.15);border-color:var(--pink);color:var(--pink);font-weight:600;}
.tg.icon{padding:6px 10px;font-size:14px;}
.sp{flex:1;}
.home-link{text-decoration:none;color:var(--muted);font-size:15px;padding:4px 8px;
          transition:color .2s;}
.home-link:hover{color:var(--cyan);}
.count{font-size:var(--fs-xs);color:var(--muted2);white-space:nowrap;font-variant-numeric:tabular-nums;}

.search{position:relative;display:flex;align-items:center;flex:none;}
.search input{
  width:210px;max-width:42vw;background:var(--panel2);border:1px solid var(--line2);
  border-radius:20px;color:var(--text);font-family:inherit;font-size:13.5px;
  padding:6px 30px 6px 32px;transition:.16s;
}
.search input::placeholder{color:var(--muted2);}
.search input:focus{border-color:var(--cyan);background:var(--panel);}
.search::before{
  content:"";position:absolute;left:12px;width:12px;height:12px;pointer-events:none;
  border:2px solid var(--muted2);border-radius:50%;
}
.search::after{
  content:"";position:absolute;left:21px;top:20px;width:5px;height:2px;pointer-events:none;
  background:var(--muted2);transform:rotate(45deg);
}
.search input:focus ~ .search::before{border-color:var(--cyan);}

/* ---------- 段落 ---------- */
.sec{margin-top:34px;}
.sec-h{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
       padding-bottom:9px;margin-bottom:4px;flex-wrap:wrap;}
.sec-h .n{font-size:12.5px;font-weight:800;letter-spacing:.2em;color:var(--cyan);}
.sec-h h3{margin:0;font-size:20px;}
.sec-h .jp{color:var(--muted);font-size:14px;}
.sec-h .sp{flex:1;min-width:0;}
.sec-tg{border:1px solid transparent;background:transparent;color:var(--muted2);
        font-family:inherit;font-size:12.5px;padding:4px 10px;border-radius:14px;
        cursor:pointer;transition:.16s;white-space:nowrap;}
.sec-tg:hover{color:var(--pink);border-color:var(--line2);background:var(--panel2);}
.sec-cnt{font-size:12px;color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap;}
/* 搜索时整段无命中的降级显示（不留空白壳） */
.sec.nomatch{opacity:.42;}
.sec.nomatch .sec-h::after{content:"（无匹配）";font-size:12px;color:var(--muted2);}

/* ---------- 句子（阅读优先：连续流，无卡片边框） ---------- */
.line{position:relative;padding:13px 0 13px;margin:0;border-bottom:1px solid rgba(40,32,64,.55);
      transition:background .16s;}
.line:hover{background:rgba(255,255,255,.022);}
.line.hide{display:none;}
.line.open{background:rgba(255,255,255,.045);padding-left:16px;}
.line.open::before{content:"";position:absolute;left:2px;top:12px;bottom:12px;width:3px;
                   background:var(--pink);border-radius:3px;}

.head{cursor:pointer;position:relative;padding-right:26px;border-radius:8px;}
.head:hover .chev{opacity:.55;color:var(--pink);}
.head:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}
.orig{font-size:21px;letter-spacing:.03em;line-height:1.55;
      font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-weight:600;}
.rd{font-size:14px;color:var(--cyan);margin-top:4px;letter-spacing:.02em;display:none;}
.ro{font-size:13px;color:var(--muted2);margin-top:3px;font-style:italic;display:none;}
.tr{font-size:var(--fs-body);color:#c9c3dc;margin-top:9px;padding-left:12px;
    border-left:2px solid var(--line2);display:none;}
.foot{display:flex;align-items:center;gap:9px;margin-top:10px;min-height:20px;}
.lv{font-size:11px;font-weight:800;padding:2.5px 9px;border-radius:20px;letter-spacing:.05em;white-space:nowrap;}
.lv.n5{background:rgba(127,240,168,.15);color:var(--green);border:1px solid rgba(127,240,168,.35);}
.lv.n4{background:rgba(95,227,245,.14);color:var(--cyan);border:1px solid rgba(95,227,245,.34);}
.lv.n3{background:rgba(255,194,102,.14);color:var(--amber);border:1px solid rgba(255,194,102,.34);}
.lv.n2{background:rgba(255,128,128,.13);color:var(--red);border:1px solid rgba(255,128,128,.32);}
.lv.rep{background:rgba(183,140,255,.14);color:var(--violet);border:1px solid rgba(183,140,255,.34);}
.chev{position:absolute;right:2px;top:3px;font-size:12px;color:var(--muted2);
      opacity:.28;transition:.18s;pointer-events:none;}
.line.open .chev{opacity:1;color:var(--pink);transform:rotate(180deg);}

.detail{display:none;padding:14px 0 4px;}
.line.open .detail{display:block;animation:fade .2s ease;}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.detail h4{font-size:12.5px;letter-spacing:.16em;color:var(--violet);margin:16px 0 8px;font-weight:700;}
.detail h4:first-child{margin-top:4px;}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);}
th{text-align:left;color:var(--muted2);font-weight:600;font-size:12px;letter-spacing:.1em;
   padding:6px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:rgba(255,111,181,.05);}
td.w{font-weight:700;color:var(--text);white-space:nowrap;
     font-family:"Yu Gothic","Noto Sans JP",sans-serif;font-size:16px;}
td.rd2{color:var(--cyan);font-size:13.5px;white-space:nowrap;}
td.pos{color:var(--pink);font-size:12.5px;white-space:nowrap;}
td.mn{color:#c9c3dc;}
td.nt{color:var(--muted);font-size:13px;}

.sx{width:100%;border-collapse:collapse;font-size:var(--fs-sm);margin-top:8px;}
.sx th{font-size:12px;letter-spacing:.1em;padding:8px 10px;border-bottom:1px solid var(--line2);color:var(--muted2);}
.sx td{padding:9px 10px;border-bottom:1px solid var(--line);}
.sx td.a{color:var(--pink);font-weight:700;font-family:"Yu Gothic",sans-serif;font-size:15px;}
.sx td.b{color:var(--cyan);font-family:"Yu Gothic",sans-serif;}
.sx td.c{color:#c9c3dc;}
.sx tr:hover td{background:rgba(95,227,245,.05);}
/* 卡片里的表：窄屏横向滚动 */
.card .sx{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* ---------- 语法 / 大白话 / 提示 ---------- */
.g{margin:8px 0;padding:11px 14px;background:var(--panel2);border-radius:9px;
   border-left:3px solid var(--violet);font-size:14.5px;}
.g b{color:var(--violet);}
.plain{margin-top:12px;padding:11px 14px;border-radius:9px;font-size:14.5px;
       background:rgba(127,240,168,.07);border-left:3px solid var(--green);color:#cdeada;}
.plain b{color:var(--green);}
.tip{margin-top:10px;padding:11px 14px;border-radius:9px;font-size:14.5px;
     background:rgba(255,194,102,.07);border-left:3px solid var(--amber);color:#eadfc7;}
.tip b{color:var(--amber);}

/* ---------- 小卡网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:6px;}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px;}
.mini .t{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:6px;}
.mini .d{font-size:13.5px;color:var(--muted);}
.mini .d em{color:var(--text);font-style:normal;background:rgba(95,227,245,.1);padding:1px 5px;border-radius:4px;
            font-family:"Yu Gothic",sans-serif;}
.mini .ex{font-size:13.5px;margin-top:7px;color:#c9c3dc;padding-top:7px;border-top:1px solid var(--line);}
.mini .ex span{color:var(--pink);}

footer{text-align:center;color:var(--muted2);font-size:13px;margin-top:52px;
       padding-top:22px;border-top:1px solid var(--line);}

/* ---------- 空结果提示 ---------- */
.empty{display:none;padding:26px 0;text-align:center;color:var(--muted2);font-size:14px;}
.empty.on{display:block;}

/* ---------- 可访问性 ---------- */
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;}
.skip{position:absolute;left:-9999px;top:0;background:var(--panel2);color:var(--text);
      padding:10px 16px;border-radius:0 0 10px 0;z-index:200;}
.skip:focus{left:0;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation:none!important;transition:none!important;}
}

/* ---------- 浅色主题（共用部分） ---------- */
html.light{
  --bg:#f5efe6; --bg2:#efe6d8; --panel:#ffffff; --panel2:#f7f1e8;
  --line:#efe6d8; --line2:#e0d3bf;
  --text:#1c1730; --muted:#585170; --muted2:#6b6484;
  /* 浅底上必须换一套更深的强调色：原来的青/粉在白色上只有 1.7–2.5:1 */
  --cyan:#0b7a8d; --pink:#c2185b; --violet:#6b3fb8;
  --amber:#8a5a00; --green:#0f7a46; --red:#b3261e;
}
html.light body{background:
  radial-gradient(1100px 560px at 12% -8%, #efe7fb 0%, transparent 58%),
  radial-gradient(900px 520px at 92% 2%, #e6f4fa 0%, transparent 55%),
  var(--bg);}
html.light .line{border-bottom-color:var(--line);}
html.light .line:hover{background:rgba(40,32,64,.028);}
html.light .line.open{background:rgba(40,32,64,.05);}
html.light .card.ok{border-color:#b9e2c8;background:linear-gradient(180deg,#f2fbf5,#ffffff);}
html.light .card.hot{border-color:#e8c2d4;}
html.light .tr,html.light td.mn,html.light .sx td.c,html.light .mini .ex{color:#4d4763;}
html.light .plain{color:#1c6e40;background:rgba(23,138,76,.09);}
html.light .tip{color:#7a5b14;background:rgba(191,138,26,.1);}
html.light .g{background:#f7f4ff;}
html.light .tg{background:#fff;}
html.light .search input{background:#fff;}
html.light footer{border-top-color:var(--line);}

/* ---------- 移动端 ---------- */
@media (max-width:700px){
  :root{--fs-body:15px;}
  .wrap{padding:0 14px 90px;}
  .orig{font-size:18.5px;}
  .card{padding:16px 15px;border-radius:12px;}
  .count{font-size:12.5px;}
  .search input{width:150px;padding:6px 26px 6px 30px;font-size:13px;}
  .sec{margin-top:28px;}
  .sec-h h3{font-size:18px;}

  /* 歌词里的逐词表：改成「一行一词」的块，避免 5 列在窄屏被裁 */
  .line .sx{display:block;width:100%;margin-top:6px;}
  .line .sx thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  .line .sx tbody,.line .sx tr,.line .sx td{display:block;width:auto;}
  .line .sx tr{padding:9px 0 10px;border-bottom:1px solid var(--line);}
  .line .sx tr:hover td{background:transparent;}
  .line .sx td{border:0;padding:0;white-space:normal;}
  .line .sx td.w{font-size:16.5px;font-weight:700;margin-bottom:2px;}
  .line .sx td.rd2{font-size:13.5px;}
  .line .sx td.pos{font-size:12px;margin:3px 0 1px;}
  .line .sx td.mn{font-size:14px;}
  .line .sx td.nt{font-size:13px;color:var(--muted2);margin-top:4px;}
  /* 用 data-h 给移动端补上列名标签（只留给释义/备注，词头三行靠字号和颜色区分） */
  .line .sx td[data-h]::before{content:attr(data-h);color:var(--muted2);font-size:10.5px;
    letter-spacing:.12em;margin-right:7px;}
  .line .sx td.w[data-h]::before,.line .sx td.rd2[data-h]::before,
  .line .sx td.pos[data-h]::before{display:none;}
  .line .sx td.mn[data-h]{font-size:14.5px;}
  .line .sx td.nt[data-h]::before{display:none;}
  .line .sx td.nt[data-h]{padding-left:11px;border-left:2px solid var(--line2);}
  .line{padding:12px 0;}
  .line.open{padding-left:13px;}
  .line.open::before{left:1px;width:3px;}
  .detail h4{font-size:12px;}
}

/* ---------- 打印 ---------- */
@media print{
  html,body{background:#fff!important;color:#111!important;}
  .nav,.bar,.search,.chev,.sec-tg,.theme,.modeSwitch,.skip{display:none!important;}
  .wrap{max-width:none;padding:0;}
  .card,.line,.mini,.g,.plain,.tip{background:#fff!important;border-color:#bbb!important;
    break-inside:avoid;box-shadow:none!important;}
  .orig,.tr,td,.sx td{color:#111!important;}
  .rd{color:#0a6b7a!important;}
  .lv{border-color:#999!important;}
  .line{page-break-inside:avoid;}
  a[href]::after{content:"";}
}


/* ===== 单曲页专用：工具条 / 主标题区 / 浅色覆盖 ===== */
.bar{position:sticky;top:0;z-index:60;background:rgba(8,7,13,.94);
     backdrop-filter:blur(16px);border-bottom:1px solid var(--line);}
.bar .row{max-width:1080px;margin:0 auto;padding:9px 22px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.bar .sp{flex:1 1 auto;}
.bar .count{font-size:12.5px;}

header{padding:46px 0 26px;position:relative;overflow:hidden;}
header .ball{position:absolute;right:-10px;top:-4px;height:112%;opacity:.55;pointer-events:none;}
header h1 .sub{font-size:15px;color:var(--muted2);font-weight:400;margin-left:10px;}
.gfoot{opacity:.78;}

html.light .bar{background:rgba(250,248,255,.94);}

@media (max-width:700px){
  .bar .row{padding:8px 12px;gap:6px;}
  .bar .sp{display:none;}
  header{padding:28px 0 18px;}
  header .ball{display:none;}
}

/* ---------- 上一首 / 下一首 ---------- */
.pager{display:flex;justify-content:space-between;align-items:stretch;gap:12px;margin-top:48px;}
.pager a{flex:1;text-decoration:none;color:var(--text);background:transparent;
  border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;
  transition:.16s;display:flex;flex-direction:column;gap:4px;min-width:0;}
.pager a:hover{border-color:var(--pink);background:transparent;transform:translateY(-2px);}
.pager .lab{font-size:11.5px;letter-spacing:.14em;color:var(--muted2);font-weight:700;}
.pager .ttl{font-size:15px;font-weight:700;color:var(--cyan);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pager .next{align-items:flex-end;text-align:right;}
.pager .prev{align-items:flex-start;text-align:left;}
.pager .spacer{flex:1;border:1px dashed var(--line);border-radius:var(--r-md);display:flex;
  align-items:center;justify-content:center;color:var(--muted2);font-size:12.5px;letter-spacing:.1em;}
html.light .pager a{background:transparent;}
html.light .pager a:hover{background:transparent;}
@media (max-width:700px){
  .pager{flex-direction:column;}
  .pager a{align-items:flex-start;text-align:left;}
  .pager .next{align-items:flex-start;text-align:left;}
}
/* ---------- 思源宋体（自托管） ---------- */
@font-face{font-family:"Source Han Serif CN";font-style:normal;font-weight:400;font-display:swap;src:url("../fonts/SourceHanSerifCN-Regular.woff2") format("woff2");}
@font-face{font-family:"Source Han Serif CN";font-style:normal;font-weight:700;font-display:swap;src:url("../fonts/SourceHanSerifCN-Bold.woff2") format("woff2");}

/* ---------- 完整导航（与博客首页一致） ---------- */
.bar .mainnav{display:flex;align-items:center;gap:18px;}
.bar .mainnav a{text-decoration:none;color:var(--muted);font-size:16.5px;font-weight:400;
  padding:4px 0;transition:color .2s;}
.bar .mainnav a:hover{color:var(--cyan);}
.bar .mainnav a.active{color:var(--cyan);font-weight:700;}
.bar .theme{flex-shrink:0;}
.bar .logo{font-size:20px;font-weight:700;color:var(--text);text-decoration:none;margin-right:auto;}
.bar .logo .dot{color:var(--pink);}
@media (max-width:700px){
  .bar .mainnav{gap:12px;overflow-x:auto;}
  .bar .mainnav a{font-size:15px;white-space:nowrap;}
}

const lvName = {n5:"N5", n4:"N4", n3:"N3", n2:"N2+", lit:"文語", rep:"重复"};
const box = document.getElementById("lyrics");
const emptyEl = document.querySelector(".empty");
const bar = document.getElementById("bar");
const state = {rd:true, ro:true, tr:true};
const SECS = Array.isArray(S) ? S : (S.sections || []);
let all = 0;

try { Object.assign(state, JSON.parse(localStorage.getItem("wbState") || "{}")); } catch (e) {}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function stripTags(s){return String(s == null ? "" : s).replace(/<[^>]*>/g, " ");}

(SECS).forEach(sec => {
  const wrap = document.createElement("section");
  wrap.className = "sec";
  const nLines = (sec.lines || []).length;
  wrap.innerHTML = '<div class="sec-h"><span class="n">' + esc(sec.n) +
    "</span><h3>" + esc(sec.h) + '</h3><span class="jp">' + esc(sec.jp) +
    '</span><span class="sp"></span><span class="sec-cnt">' + nLines + " 句</span>" +
    '<button class="sec-tg" type="button">展开本节</button></div>';

  const secTg = wrap.querySelector(".sec-tg");
  secTg.addEventListener("click", () => {
    const lines = [...wrap.querySelectorAll(".line")];
    const anyClosed = lines.some(l => !l.classList.contains("open"));
    lines.forEach(l => setOpen(l, anyClosed));
    secTg.textContent = anyClosed ? "收起本节" : "展开本节";
  });

  (sec.lines || []).forEach(L => {
    all++;
    const d = document.createElement("div");
    d.className = "line" + (L.lv === "rep" ? " repcard" : "");

    let words = "";
    if (L.w && L.w.length) {
      words = '<h4>逐词拆解</h4><table class="sx"><thead><tr>' +
        "<th>词 / 表达</th><th>读音</th><th>词性</th><th>释义</th><th>备注</th></tr></thead><tbody>" +
        L.w.map(w => '<tr><td class="w" data-h="词">' + esc(w[0]) + '</td><td class="rd2" data-h="读音">' + esc(w[1]) +
          '</td><td class="pos" data-h="词性">' + esc(w[2]) + '</td><td class="mn" data-h="释义">' + esc(w[3]) +
          '</td><td class="nt" data-h="备注">' + esc(w[4] || "") + "</td></tr>").join("") +
        "</tbody></table>";
    }
    const gram = (L.g && L.g.length)
      ? "<h4>句法结构</h4>" + L.g.map(g => '<div class="g"><b>' + g[0] + "</b><br>" + g[1] + "</div>").join("")
      : "";
    const plain = L.p ? '<div class="plain"><b>大白话：</b>' + L.p + "</div>" : "";
    const tip = L.tip ? '<div class="tip"><b>提示：</b>' + L.tip + "</div>" : "";

    d.innerHTML =
      '<div class="head" role="button" tabindex="0" aria-expanded="false">' +
        '<div class="orig">' + esc(L.t) + "</div>" +
        '<div class="rd">' + esc(L.r) + "</div>" +
        '<div class="ro">' + esc(L.ro) + "</div>" +
        '<div class="tr">' + L.tr + "</div>" +
        '<div class="foot"><span class="lv ' + L.lv + '">' + (lvName[L.lv] || L.lv) + "</span></div>" +
        '<span class="chev" aria-hidden="true">▾</span>' +
      "</div>" +
      '<div class="detail">' + words + gram + plain + tip + "</div>";

    d.dataset.search = stripTags([L.t, L.r, L.ro, L.tr, L.p, L.tip]
      .concat((L.w || []).map(w => w.join(" ")))
      .concat((L.g || []).map(g => g.join(" ")))
      .join(" ")).toLowerCase();

    const head = d.querySelector(".head");
    head.addEventListener("click", () => setOpen(d, !d.classList.contains("open")));
    head.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); setOpen(d, !d.classList.contains("open")); }
    });

    wrap.appendChild(d);
  });
  box.appendChild(wrap);
});

function setOpen(line, open) {
  line.classList.toggle("open", !!open);
  const h = line.querySelector(".head");
  if (h) h.setAttribute("aria-expanded", open ? "true" : "false");
  const sec = line.closest(".sec");
  if (sec) syncSecTg(sec);
}
function syncSecTg(sec) {
  const tg = sec.querySelector(".sec-tg");
  if (!tg) return;
  const lines = [...sec.querySelectorAll(".line")];
  tg.textContent = lines.some(l => !l.classList.contains("open")) ? "展开本节" : "收起本节";
}

function apply() {
  box.querySelectorAll(".line").forEach(l => {
    l.querySelector(".rd").style.display = state.rd ? "block" : "none";
    l.querySelector(".ro").style.display = state.ro ? "block" : "none";
    l.querySelector(".tr").style.display = state.tr ? "block" : "none";
  });
}


/* 导航高度写进 --nav-h，供锚点与深读版目录使用 */
function syncNavH() {
  const h = bar.getBoundingClientRect().height;
  document.documentElement.style.setProperty("--nav-h", Math.round(h) + "px");
}
if (window.ResizeObserver) new ResizeObserver(syncNavH).observe(bar);
else window.addEventListener("resize", syncNavH);
window.addEventListener("load", syncNavH);

/* 默认全部收起：进来先看到歌词本身，想看解析再点 */
apply();

/* ---------- 主题 ---------- */
try { if (localStorage.getItem("wbTheme") === "light") document.documentElement.classList.add("light"); } catch (e) {}
const themeBtn = document.getElementById("themeBtn");
function syncThemeBtn() {
  const light = document.documentElement.classList.contains("light");
  themeBtn.textContent = light ? "☀️" : "🌙";
  themeBtn.setAttribute("aria-pressed", light ? "true" : "false");
  themeBtn.title = light ? "当前：浅色（点击切深色）" : "当前：深色（点击切浅色）";
}
themeBtn.addEventListener("click", function () {
  const light = document.documentElement.classList.toggle("light");
  try { localStorage.setItem("wbTheme", light ? "light" : "dark"); } catch (e) {}
  syncThemeBtn();
  syncNavH();
});
syncThemeBtn();
syncNavH();
/*==ENGINE-END==*/
